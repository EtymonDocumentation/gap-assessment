name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, content validation, tests, build, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Content YAML is schema-validated inside the test run (content/test); a bad edit fails here.
      - name: Unit tests and content validation
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke and accessibility tests
        run: npm run e2e

      # Server mode (accounts, server storage): builds the server and the server-mode web build, then runs the browser
      # tests against the real server. Written to its own folders (apps/web/dist-server, apps/server/dist); the site
      # uploaded below is still only apps/web/dist.
      - name: Build server mode
        run: npm run build:server

      - name: Server-mode browser tests
        working-directory: apps/web
        run: npx playwright test -c playwright.server.config.ts

      - name: Keep the smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-report-server
            apps/web/test-results-server
          retention-days: 7

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
