name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# One long job used to take about 93 minutes (81 of them the browser tests), so a push during a run cancelled it and the
# site stayed on an old build for hours. The slow part now runs in parallel:
#   check       typecheck, unit tests, content validation, build        (a few minutes)
#   web-e2e     the browser tests in 4 shards that run at the same time (about 20 minutes each)
#   server-e2e  the server-mode browser tests                           (its own job)
# The site goes live only when ALL of them pass (deploy needs every job). Every job has a timeout, so a hung browser
# cannot hold the queue for hours.
jobs:
  check:
    name: Typecheck, content validation, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The leak-guard tests look for client-identifying terms that must never appear in any output. The terms are not in
      # the repository: they come from the repository secret GAP_PRIVATE_TERMS_TEXT (one term per line). Without the secret
      # (a fork, or not set yet) that part of the guard is skipped and the test log says so. The terms are written to disk
      # only on a push to main: a pull request branch can change the workflow's steps, so it never gets the secret.
      - name: Private terms for the leak guard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRIVATE_TERMS_TEXT: ${{ secrets.GAP_PRIVATE_TERMS_TEXT }}
        run: |
          if [ -n "$PRIVATE_TERMS_TEXT" ]; then
            printf '%s\n' "$PRIVATE_TERMS_TEXT" > "$RUNNER_TEMP/private-terms.txt"
            echo "GAP_PRIVATE_TERMS=$RUNNER_TEMP/private-terms.txt" >> "$GITHUB_ENV"
          else
            echo "GAP_PRIVATE_TERMS_TEXT is not set: the private-term leak guard will be skipped."
          fi

      # Content YAML is schema-validated inside the test run (content/test); a bad edit fails here.
      - name: Unit tests and content validation
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/dist

  web-e2e:
    name: Smoke and accessibility tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser tests run against the production build (vite preview).
      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke and accessibility tests
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Keep the smoke report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  server-e2e:
    name: Server-mode browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Server mode (accounts, server storage): builds the server and the server-mode web build, then runs the browser
      # tests against the real server. Written to its own folders (apps/web/dist-server, apps/server/dist).
      - name: Build server mode
        run: npm run build:server

      - name: Server-mode browser tests
        working-directory: apps/web
        run: npx playwright test -c playwright.server.config.ts

      - name: Keep the server-mode report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-server
          path: |
            apps/web/playwright-report-server
            apps/web/test-results-server
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, web-e2e, server-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
