# ---------------------------------------------------------------- the master batch record (MBR)
# Built from the TRD above through the same functions a person uses (sections follow the selected unit operations in process order; blocks come
# from the step-blocks library). The sample tables of the compounding, bioburden-reduction filtration and filling sections come from the PPQ
# sampling plan above (one row per sampling point, kept in step with the plan). The other steps pull no PPQ samples. The limits are the TRD's
# claims; the longer PPQ-only holds are not written into the record as limits. There is no filtered-bulk-hold block:
# filling starts directly after sterile filtration. There is no needle-check block either: the TRD states that needle clogging is not likely.
mbr:
  at: "2026-10-19T09:00:00.000Z"
  by: Alex Example (fictional)
  role: MSAT engineer
  title: SYR-305 master batch record, Example Fill Site PFS Line 3 (fictional)
  docRef: DEMO-MBR-305-01
  sections:
    - { uo: ds_shipping_inbound, blocks: [inbound_shipment_check, shipment_monitoring_custody] }
    - { uo: ds_receipt_thaw, blocks: [receipt_and_thaw] }
    - { uo: buffer_prep, blocks: [buffer_preparation] }
    - { uo: compounding, blocks: [pooling_with_weights, dilution_and_mixing, sample_table] }
    - { uo: bbr_filtration, blocks: [bbr_filtration_run, sample_table] }
    - { uo: sterile_filtration, blocks: [sterile_filtration_run, filter_integrity_test] }
    - { uo: aseptic_filling, blocks: [line_preparation, syringe_nest_debagging, filling_run, plunger_stopper_placement, sample_table] }
    - { uo: visual_inspection, blocks: [visual_inspection_run] }
    - { uo: bulk_packaging, blocks: [bulk_packing, reconciliation_chain] }
    - { uo: labeling_packaging, blocks: [labeling_run] }
    - { uo: storage_shipping, blocks: [time_out_of_refrigeration_total, storage_and_shipment] }
    - { title: Batch record review, blocks: [batch_review] }
  # Rows the team has not decided yet; every other row with a TRD value is set to "same as TRD".
  undecided:
    - buffer_prep.mixing_speed_range
    - compounding.temperature
    - compounding.temperature_range
    - sterile_filtration.differential_pressure_range
    - aseptic_filling.fill_volume_range
    - aseptic_filling.headspace
    - labeling_packaging.labeling_speed_range
    # The study point row below carries its own value, so it has no "same as TRD" choice.
    - visual_inspection.inspection_rate_range
  rows:
    # One value the receiving unit tightens inside the TRD range, with its reason.
    - { uo: aseptic_filling, row: stopper_position_range, choice: tightened_by_cmo, mbrValue: 6.2 to 6.8, mbrUnit: mm, reason: "The placement unit repeats within a narrower band than the TRD range, so the receiving unit keeps the position inside it (fictional)" }
    # One study point beyond the TRD range: a challenge run of the inspection machine, not a limit.
    - { uo: visual_inspection, row: inspection_rate_range, mbrValue: "360", mbrUnit: units/min, studyPoint: true, reason: "Challenge run at a higher inspection rate for the machine qualification study (fictional)" }
  refs:
    # The sterile filtration steps point at the integrity test steps by reference, so the numbers follow when steps move.
    - { uo: sterile_filtration, block: sterile_filtration_run, step: 2, find: "Run the filter integrity test", insert: " {ref}", to: { uo: sterile_filtration, block: filter_integrity_test, step: 2 } }
    - { uo: sterile_filtration, block: sterile_filtration_run, step: 4, find: "Run the filter integrity test", insert: " {ref}", to: { uo: sterile_filtration, block: filter_integrity_test, step: 3 } }
  limits:
    # The total time out of refrigeration is the critical limit; each stage has its own target under it. The stage values are the TRD's
    # budgets for the stage (filling, inspection, bulk packing, labelling) and add up to the critical limit.
    - uo: storage_shipping
      limit: total_out_of_refrigeration
      targets:
        - { label: Filling, value: "6", unit: h, fromStep: { uo: aseptic_filling, block: filling_run, step: 2 }, toStep: { uo: aseptic_filling, block: filling_run, step: 5 } }
        - { label: Visual inspection, value: "3", unit: h, fromStep: { uo: visual_inspection, block: visual_inspection_run, step: 2 }, toStep: { uo: visual_inspection, block: visual_inspection_run, step: 6 } }
        - { label: Bulk packaging, value: "1", unit: h, fromStep: { uo: bulk_packaging, block: bulk_packing, step: 2 }, toStep: { uo: bulk_packaging, block: bulk_packing, step: 6 } }
        - { label: Labelling and packaging, value: "2", unit: h, fromStep: { uo: labeling_packaging, block: labeling_run, step: 3 }, toStep: { uo: labeling_packaging, block: labeling_run, step: 6 } }
