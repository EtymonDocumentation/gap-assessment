    # Starting text the team changed because it did not fit this program, or because it was an instruction to the author.
    edits:
      - { writeup: sec_batch_size, part: dilution, text: "For a program with dilution, the batch size stated above is the size after dilution. {{trd.batchSize.drugSubstanceLotMixingStatement|State how drug substance lots may be combined or not combined}}. The batch is mixed in a 100 L single-use mixing bag. The impeller of the bag is covered from a volume of 9 L, which is the lower end of the proven acceptable range, so the smallest batch can still be mixed (fictional)." }
      - { writeup: sec_process_parameters, part: fn_inline_filtration_tor, text: "The inline sterile filtration time counts towards the time out of refrigeration of the filling process. The time out of refrigeration is tracked for each portion of the batch separately. The total for a portion must not exceed {{uo.storage_shipping.param.max_total_time_out_of_refrigeration.max|Total time out of refrigeration}}, counted from the start of filling of that portion until its drug product is back in refrigerated storage. The time at ambient temperature after thaw has its own limit and is not part of this total." }
      - { writeup: sec_process_parameters, part: fn_tor_budget, text: "The time out of refrigeration of a portion is budgeted by step: filling up to {{uo.aseptic_filling.param.max_fill_duration.setPoint|Filling time out of refrigeration}}, visual inspection up to {{uo.visual_inspection.param.max_time_out_of_refrigeration.max|Inspection time out of refrigeration}}, bulk packing up to {{uo.bulk_packaging.param.max_time_out_of_refrigeration.max|Bulk packing time out of refrigeration}}, and labelling and packaging up to {{uo.labeling_packaging.param.max_time_out_of_refrigeration.max|Labelling time out of refrigeration}}. Together they stay within the total of {{uo.storage_shipping.param.max_total_time_out_of_refrigeration.max|Total time out of refrigeration}}. The filling time limit rests on the media fill, which covered the longest filling run. A portion is 70 tubs of 100 syringes, so 7,000 syringes (fictional). The out and return times of a portion include the handling before and after the work of the step, and the total is the sum of the recorded times." }
      - { writeup: sec_total_time_out_of_refrigeration, part: p1, text: "The total time out of refrigeration limits given in the overall process parameters section are strictly observed. The time is tracked for each portion of the batch, from the start of filling of that portion. The total limit is {{uo.storage_shipping.param.max_total_time_out_of_refrigeration.max|Total time out of refrigeration}} for each portion. Before PPQ the requirement is a target to exceed (more than 12 h); the PPQ challenge is 14 h in every lot. The time that will be claimed afterwards is the lowest time achieved across the three PPQ lots, and the limit of this record stays at 12 h (self-restricted). Limits ladder: the requirement before PPQ (more than 12 h, from development) is a target to exceed; the validated limit after PPQ is the lowest time achieved across the three lots (the 14 h challenge is a buffer); the record limit of the batch record is 12 h (self-restricted); the alert limit is 10.8 h, 90 % of the record limit (assumed, reviewed after trending of the PPQ data)." }
      - { writeup: wu_aseptic_filling, part: n1, text: "The longest time allowed from the start of filling of a portion until that portion is back in refrigerated storage is given in the overall process parameters section; the time is tracked for each portion separately. The filled units are protected from light while in refrigerated storage, as described in the formulation and manufacturing precautions section. The hold-up allowance (dead volume) of a batch is about 3.0 L: compounding bag 0.5 L, bioburden-reduction filter and tubing 0.6 L, holding bag 0.4 L, sterile filter and tubing 0.5 L, filler prime and purge 0.7 L and surge bag 0.3 L (fictional). The planned number of units of a batch is set so that the filled volume, the bulk samples and this allowance fit in the batch volume. The fill weight is checked on every syringe where a weight check device is available outside the critical area, otherwise at the frequency of the fill weight table; after any restart, intervention or adjustment the check is tighter (every 10 minutes for the first 30 minutes; assumed). Fill and sterility-relevant samples are taken at the beginning, middle and end of the filling run and with every intervention or line stop, from every filling head (EU GMP Annex 1 (2022) 8.17 and FDA guidance on sterile drug products produced by aseptic processing (2004) XI.B)." }
      - { writeup: wu_visual_inspection, part: n1, text: "The longest time allowed for inspection of a portion is given in the overall process parameters section ({{uo.visual_inspection.param.max_time_out_of_refrigeration.max|Maximum inspection time}}). The time out of refrigeration is tracked for each portion, from the start of filling of that portion." }
      - { writeup: wu_labeling_packaging, part: detail, text: "Labels are applied using {{uo.labeling_packaging.equip.labeler.operatingPrinciple|Labelling method}} at a speed of {{uo.labeling_packaging.param.labeling_speed.setPoint|Labelling speed}}. The serialization approach is {{uo.labeling_packaging.equip.serialization.type|Serialization level}}. Secondary packaging is {{uo.labeling_packaging.mat.secondary_pack.format|Pack configuration ~a}}. For label reconciliation, the approach is {{uo.labeling_packaging.ipc.label_reconciliation.frequency|Label reconciliation}}. Labels are checked for {{uo.labeling_packaging.ipc.label_checks.tests|Label checks}}, in line with the labelling and production record expectations of 21 CFR Part 211. The time out of refrigeration is tracked for each portion, from the start of filling of that portion; during packaging it is no more than {{uo.labeling_packaging.param.max_time_out_of_refrigeration.max|Maximum time out of refrigeration during packaging}} for a portion." }
      - { writeup: sec_acronyms, part: p1, text: Common abbreviations used in this document are listed below. }
      - { writeup: sec_manufacturing_process_overview, part: p1, text: "Where this section says drug substance, the same applies to bulk placebo. The general process is described step by step below, in process order: drug substance shipping and receipt, frozen storage and thaw, buffer preparation, pooling, compounding and dilution, bioburden reduction filtration, sterile filtration with PUPSIT, aseptic filling with vacuum stoppering in an isolator, visual inspection, bulk packaging, labelling and packaging, and storage and shipping." }
      - { writeup: sec_dilution_buffer, part: excipient_solution_n1, text: "This calculation is for an estimated batch: 4500 g of stabilizer stock (4375 g are used in the buffer) and 100 g of surfactant stock (50 g are used). The receiving unit is free to change the amounts to fit its manufacturing constraints, as long as the same ratios (the formula) are followed. Mix with a gentle vortex until the excipient has visibly dissolved. Avoid splashing and foaming." }
      - { writeup: sec_dilution_buffer, part: formulation_n3, text: "This calculation is for an estimated buffer batch of 25.0 kg: the 18.75 L of diluent for the 50 L target batch plus about 33 % for losses and dead volume (density taken as 1.00 kg/L, fictional). The receiving unit is free to change the amounts to fit its manufacturing constraints, as long as the same ratios (the formula) are followed. Mix with the impeller until each excipient has visibly dissolved. Avoid splashing and foaming." }
      - { writeup: wu_ds_receipt_thaw, part: thaw, text: "**Thawing.** The bottles of frozen drug substance are thawed using {{uo.ds_receipt_thaw.equip.thaw_unit.operatingPrinciple|Thaw method ~a}}. The thaw set point is {{uo.ds_receipt_thaw.param.thaw_temperature.setPoint|Thaw temperature}} and the expected duration is {{uo.ds_receipt_thaw.param.thaw_duration.setPoint|Thaw duration}}. The post-thaw mixing method is {{uo.ds_receipt_thaw.equip.thaw_mixer.operatingPrinciple|Post-thaw mixing ~a}}, as set out in the overall process parameters section." }
      - { writeup: wu_visual_inspection, part: p1, text: "The final drug product is inspected by {{uo.visual_inspection.equip.inspection.operatingPrinciple|Inspection method}}. The automated inspection recipe is specifically developed and validated for this product. The receiving unit is responsible for 100 % visual inspection in line with the pharmacopoeial chapters on visible particulates in injections (for example USP <790> and <1790>). The defect classes inspected are {{uo.visual_inspection.ipc.defects.tests|Defect classes}}. AQL sampling uses {{uo.visual_inspection.ipc.aql.frequency|Sampling plan ~the}}." }
      - { writeup: wu_bulk_packaging, part: p2, text: "The assembled bulk packaging configuration for the {{uo.aseptic_filling.mat.container.format|Container format or size}} presentation is listed in the table below, with each component, its distributor and the manufacturer's part number." }
      - { writeup: wu_buffer_prep, part: onsite, text: "Raw materials are dispensed using {{uo.buffer_prep.equip.dispensing.operatingPrinciple|Dispensing method ~a}} and prepared in {{uo.buffer_prep.equip.prep_vessel.type|Preparation vessel type ~a}} with a capacity of {{uo.buffer_prep.equip.prep_vessel.capacity|Vessel capacity}}, for a batch volume of {{uo.buffer_prep.param.batch_volume.setPoint|Buffer batch volume}}. Each component is added in the order of the formulation table. The buffer is mixed with {{uo.buffer_prep.equip.prep_mixer.operatingPrinciple|Mixer ~a}} at {{uo.buffer_prep.param.mixing_speed.setPoint|Mixing speed}} for {{uo.buffer_prep.param.mixing_time.setPoint|Mixing time}}, without foam, and the final mixing speed is recorded in the batch record." }
      - { writeup: wu_sterile_filtration, part: p1, text: "Sterile filtration is performed in line with filling: the bioburden-reduced drug substance is passed from the holding bag through a sterile {{uo.sterile_filtration.mat.sterilizing_filter.poreRating|Pore rating}} {{uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction|Membrane}} sterilizing-grade filter, the integrity of which is tested before and after use, directly into a small sterile surge bag at the filler (there is no separate sterile bulk vessel). The filtration time limit covers the whole filling run and is tied to the 8 h filling time limit. {{uo.sterile_filtration.mat.redundant_filter.present|Redundant filter used ~A second, redundant sterilizing-grade filter is used in series. ~No second, redundant filter is used in series.}} Before filtration starts, the product temperature must be {{trd.sterile_filtration.productTemperature|Product temperature}}. The bioburden of the load that reaches the final sterilizing filter is tested immediately before the sterilizing filtration on every batch (100 mL, not more than 10 CFU/100 mL; this is the limit on the load of the final filter, not a general limit for the bulk, as in EMA guideline on the sterilisation of the medicinal product 4.1.5 and EU GMP Annex 1 (2022) 8.93). Holds longer than 24 h (the formulated bulk and the filtered bulk in the holding bag) are qualified by the hold studies of the PPQ lots and a risk assessment (EMA guideline on the sterilisation of the medicinal product 4.1.5 and 4.1.6). The media fill (aseptic process simulation) does not qualify the holds on its own; it periodically includes material held for the longest qualified time, and it covers the longest fill time. The filter is tested by a pre-use post-sterilization integrity test (PUPSIT) and a non-destructive integrity test after use (EU GMP Annex 1 (2022) 8.87). The connections and interventions on the aseptic side are listed (type, location, grade) in the PPQ sampling plan for inclusion in the media fill (EU GMP Annex 1 (2022) 8.16 and 8.17). The side after the sterilizing filter (surge bag, filling needles) has no sampling ports and stays closed; all samples there are taken from filled syringes. The bioburden sample is taken before the filter, from the holding bag at the end of its hold. The filter integrity tests (before and after use) are recorded as tests, not as product samples." }
      - { writeup: wu_ds_receipt_thaw, part: hold_limits, text: "Note: the time at ambient temperature starts at the end of the thaw. The thaw is its own controlled step with its own duration limit and does not count towards the ambient time. If the drug substance is not pooled within {{uo.ds_receipt_thaw.param.max_ambient_time.max|Time at ambient temperature after thaw}} of the end of thaw, the thawed bottle is stored at {{trd.ds_receipt_thaw.holdTemperature|Storage temperature after thaw}}. The longest time the thawed material can be held at that temperature before pooling is {{uo.ds_receipt_thaw.param.max_cold_hold.max|Maximum cold hold before pooling}}. If the thawed material is kept in refrigerated storage it is protected from light as described in the formulation and manufacturing precautions section. Limits ladder of a hold, each step with its origin: the requirement before PPQ (for example more than 24 h, from development) is a target to exceed; the validated limit after PPQ is the lowest time achieved across the three PPQ lots; the record limit of the batch record is set at or below the validated limit; the alert limit is 90 % of the record limit (assumed, reviewed after trending of the PPQ data)." }
      - { writeup: wu_bbr_filtration, part: p2, text: "Filtration runs at a differential pressure of {{uo.bbr_filtration.param.differential_pressure.setPoint|Differential pressure}} and is expected to take {{uo.bbr_filtration.param.max_filtration_time.setPoint|Expected filtration time}}; the normal operating range of the filtration time is {{uo.bbr_filtration.param.max_filtration_time.nor|Filtration time range}}. The bulk bioburden before the filter is not more than {{uo.bbr_filtration.ipc.bioburden.limit|Bioburden limit}}." }
      - { writeup: wu_bulk_packaging, part: p1, text: "Inspected units are packed into {{uo.bulk_packaging.mat.bulk_container.type|Bulk container type ~a}} holding {{uo.bulk_packaging.mat.bulk_container.unitsPerContainer|Units per container}} units each, closed with {{uo.bulk_packaging.mat.bulk_container.seal|Seal or closure ~a}}. The packed bulk is stored under {{uo.bulk_packaging.mat.bulk_product.storageCondition|Bulk storage condition}} conditions and held for no more than {{uo.bulk_packaging.param.max_hold_time.max|Bulk hold time}}. The time out of refrigeration is tracked for each portion of the batch, from the start of filling of that portion; during bulk packing it is no more than {{uo.bulk_packaging.param.max_time_out_of_refrigeration.max|Maximum time out of refrigeration during bulk packing}} for a portion." }
# A fictional PPQ sampling plan for the syringe program (Table 4 of the proposal memo, samples 1 to 17, plus samples 18 to 21 so that every hold has a T0 and an end-of-hold sample). It is replayed through the same
# editing functions a person uses. The plan lists only PPQ-specific samples: routine in-process and release samples follow the TRD and the
# specification and are named in a subsection, not in the table. Three PPQ batches bracket the 100 L single-use mixing bag: 9 L (the smallest
# volume that covers the impeller), 50 L (the TRD target) and 100 L (the bag maximum). Counts per test are assumed; the real numbers come from
# the QC methods. One open item is left on purpose: nobody has yet said whether agency requests refer to PPQ samples.
sampling:
  at: "2026-10-15T09:00:00.000Z"
  by: Alex Example (fictional)
  role: MSAT engineer
  plans:
    - title: SYR-305 PPQ sampling plan (fictional)
      notes: Fictional demonstration plan. Proof of concept, not validated, not for GMP use.
      batchRationale: "Three PPQ batches bracket the widest range the 100 L single-use mixing bag allows: 9 L (the smallest volume that fully covers the impeller), 50 L (the middle, the TRD target) and 100 L (the bag maximum). The PPQ sets the proven acceptable range, so the values proven here become the TRD limits (fictional). Three batches follow from the risk to the patient (a sterile injectable with a moderate process complexity) and from prior knowledge: two development batches and an engineering batch at the receiving unit showed the same behaviour, so three PPQ batches are enough to show the process repeats, and none is chosen as a fixed rule (fictional)."
      design:
        bracketing: "Only the batch size is bracketed (9 L, 50 L and 100 L). Every hold and every time limit is run in every one of the three batches, at the same target in each, because a shorter hold in one batch would leave that hold unproven for the others (fictional)."
        rework: "No rework and no reprocessing are allowed in PPQ. A batch that needs either is stopped and reported as a deviation to the quality unit (fictional)."
        engineeringBatch: { decision: planned, note: "One engineering batch at 50 L runs before PPQ to test the setup of the isolator, the filling line and the mixing bag. It does not count as a PPQ batch (fictional)." }
        freezeRule: "After the engineering batch, no change to the equipment settings, the batch record or the analytical methods is made until the third PPQ batch is complete. A change that cannot wait is assessed by quality assurance and may end the PPQ (fictional)."
        postPpq: "After PPQ, the samples marked PPQ only stop. The samples marked as continuing go on in routine production. Enhanced sampling, at the level of PPQ for the attributes where PPQ showed a trend, continues for the first 10 commercial batches before continued process verification takes over; the number is the team's proposal and is reviewed with the PPQ summary report (fictional)."
      readiness:
        - { key: equipment_qualified, status: complete, note: "Isolator, filling line and mixing bag qualified; the report is DEMO-OQ-305-01 (fictional)." }
        - { key: methods_ready, status: open, note: "Two analytical methods are still being transferred (fictional)." }
        - { key: training, status: complete }
        - { key: batch_records, status: open, note: "Master batch record in draft (fictional)." }
      parties:
        - {"party": "sponsor", "name": "Alex Example (fictional)", "role": "Technology transfer lead", "department": "Process Validation (fictional)", "memoLine": "from"}
        - {"party": "cmo", "name": "Receiving site manufacturing (fictional)", "role": "Takes the samples and writes the PPQ summary report", "department": "Manufacturing Sciences (fictional)", "memoLine": "to"}
        - {"party": "contract_lab", "name": "QC sample management, receiving site (fictional)", "role": "Receives, ships and tests the samples", "memoLine": "cc"}
      subsections:
        - title: "Hold challenges per batch"
          placement: "after_section:batches"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "Before PPQ, the requirement for each hold is a target to exceed (shown as more than N h), not a validated value. Every hold, and the total time out of refrigeration, is run in every one of the three batches, to the same PPQ target in each batch, and each target is longer than its requirement. Every hold has a pair of samples, a T0 and an end-of-hold sample, so the end result is compared with the start. A T0 is a sample at the start of the hold, the sample taken just before the product goes into the hold, or a sample from the bag right after it is filled; where such a sample already exists it is named as the T0 and not taken twice. Batch size is the only thing that is bracketed (low, target, high). The time that will be claimed afterwards (the validated limit, the PAR of the hold) is the lowest time achieved across the three PPQ lots, never the longest time tested. This is self-restricted on purpose: the receiving unit gets no room to work at the edge of the tested times, where there is no data, and the longer tested time is a buffer, not a range it may use."}, {"type": "table", "columns": ["Hold", "Requirement before PPQ (target to exceed)", "PPQ target (every batch)", "T0 sample", "End-of-hold sample"], "rows": [["Thawed drug substance at 2 to 8 °C", "> 24 h", "30 h", "SP-018 (start of the cold hold, after thaw)", "SP-019 (as the containers are taken out of cold storage)"], ["Ambient time after thaw (starts at the end of the thaw)", "> 4 h", "5 h", "SP-018 (taken at the end of the thaw, when the ambient clock starts)", "SP-001 and SP-002 (start of mixing, right after pooling ends the ambient time)"], ["Dilution buffer", "> 72 h", "96 h", "The routine buffer in-process sample (pH, osmolality, density), the last sample before the hold; not repeated in this plan", "SP-020 (at the end of the hold, before the buffer is used)"], ["Diluted bulk before filtration", "> 24 h", "30 h", "SP-005 and SP-006 (end of mixing, right before the hold starts)", "SP-021 (end of the hold, before the bulk goes to filtration)"], ["Filter contact at bioburden-reduction filtration", "> 4 h", "24 h", "SP-021 (bulk right before it is filtered)", "SP-007 (filtrate right after it is transferred into the holding bag)"], ["Filtered bulk in the holding bag at 2 to 8 °C", "> 24 h", "30 h", "SP-007 (sample from the holding bag right when it is filled; SP-008 is taken in the middle)", "SP-009 (the bioburden sample immediately before sterile filtration; it also serves as the end-of-hold sample)"], ["Total time out of refrigeration of a portion", "> 12 h", "14 h", "SP-011 (beginning of filling, when the clock starts)", "SP-017 (units tested after the 14 h challenge)"]]}, {"type": "paragraph", "text": "The TRD limits today are the targets to exceed shown above, and the PPQ batches hold to the PPQ target; the batch record marks each PPQ target that goes beyond its record limit as a study point, so running it is planned and is not a deviation. The batch record keeps the 12 h limit for the total time out of refrigeration (self-restricted); the 14 h is a study point of the challenge portion. The operators follow the batch record, so every hold sample is taken at the end of the hold, in the step that ends the hold, and not after a fixed number of hours. The holds run back to back. The filling time limit of 8 h comes from the media fill and cannot be raised. If filling runs past it, the syringes filled after the cutoff are set aside and a deviation is raised. The sterilizing filter's contact time is limited by the 8 h filling limit; its longer contact data come from the lab filter validation (assumed)."}]
        - title: "Aseptic-side connections and interventions"
          placement: "after_section:batches"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "After the sterilizing filter there is no product sampling port: every opening is a sterility risk and the sterile boundary stays closed. Each connection and intervention on the aseptic side is listed below (type, location, grade) and is part of the media fill (aseptic process simulation), which also covers the longest fill time. The holds are not qualified by the media fill: they are qualified by the hold samples of the three PPQ lots (T0 and end of hold), and the media fill periodically includes material held for the longest qualified time."}, {"type": "table", "columns": ["Connection or intervention", "Type", "Location", "Grade"], "rows": [["Sterile filter outlet to the surge bag", "Single-use sterile connector, made once at set-up", "Filling area, before the run", "A"], ["Surge bag to the filling line", "Single-use aseptic connection, made once at set-up", "Filling isolator, before the run", "A"], ["Vent filter and drain bag of the PUPSIT", "Closed after the test; not a sampling point", "Sterile filtration set-up", "A"], ["Pulling filled syringes for samples (beginning, middle, end, after a stop)", "Inherent intervention at the line exit; samples are filled syringes only", "Filling isolator, line exit", "A"], ["Filling head, needle or stopper feeder adjustment, line stop and restart", "Corrective intervention", "Filling isolator", "A"], ["Product sample port after the sterilizing filter", "None. Not allowed", "Not applicable", "Not applicable"]]}]
        - title: "Thaw: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "After thaw, the drug substance is held at 2 to 8 °C and then at ambient temperature for the times in the hold table. The ambient clock starts at the end of the thaw; the thaw is its own controlled step with its own duration limit. Where the batch is too small to pool and mix the drug substance, the thawed bottles are inverted 4 to 14 times and the certificate of analysis protein value is used instead of a pooled sample (assumed)."}, {"type": "paragraph", "text": "One PPQ sample is pulled here, in every batch: sample 18, the T0 of the cold hold, taken from the thawed drug substance when it is placed in cold storage. Its pair, sample 19, is taken at the end of the cold hold and is listed with pooling."}]
        - title: "Dilution buffer preparation: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "Each PPQ batch uses its own buffer batch, made with the TRD mixing settings and held for the time in the hold table before use. The batch record states the buffer amounts, worked out from the TRD formula (the TRD shows a 25 kg example): 0.375 L of buffer per litre of product batch, so 3.4 L, 18.75 L and 37.5 L for PPQ 3, PPQ 1 and PPQ 2, plus losses. Routine buffer samples (pH, osmolality, density) are not in this plan, per TRD and specification."}, {"type": "paragraph", "text": "One PPQ sample is pulled here, in every batch: sample 20, taken at the end of the buffer hold, before the buffer is used. The T0 of the buffer hold is the routine in-process buffer sample taken just before the hold starts, so it is not taken twice."}]
        - title: "Pooling, dilution and mixing: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "Up to three drug substance lots are pooled and diluted to target in the 100 L single-use mixing bag. Homogeneity is shown by sampling the top and bottom of the bag at three times during mixing: T0 at the start of mixing, T1 at 15 min and T2 at the end of mixing (30 min). The impeller is fully covered before mixing starts (the bag covers it from 9 L), so the bulk mixes properly and shear is limited. The largest batch is mixed at the lowest speed and shortest time of the TRD range; the smallest at the highest speed and longest time (assumed). The diluted bulk is then held as in the hold table. PPQ samples 1 to 6 are the mixing samples; T2 (samples 5 and 6) is also the T0 of the diluted bulk hold, because it is taken at the end of mixing, right before the hold starts. Sample 19 is taken here, as the thawed containers are taken out of cold storage (the end of the cold hold). The end-of-hold sample of the diluted bulk, sample 21, is listed with filtration."}]
        - title: "Bioburden-reduction filtration and hold: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "After routine pre-filtration samples, filtration is paused with product in contact with the filter for the time in the hold table. At about 1 L/min, a 100 L batch alone takes close to 2 h, so a line delay can quickly use up a short contact limit; that is why the filter contact is challenged to 24 h in every batch. The filtered bulk is then held in the holding bag at 2 to 8 °C for the PPQ target of 30 h in every batch. Sample 21 is taken from the formulated bulk at the end of its hold, right before filtration; it is the end-of-hold sample of the diluted bulk hold and the T0 of the filter contact. Sample 7, taken from the filtrate right after it is transferred into the holding bag, is the end sample of the filter contact and the T0 of the holding bag hold. PPQ samples are taken at the start of the hold, in the middle of the hold and at the end of the hold, in every batch (samples 7 to 9). The end-of-hold sample is taken in the step of the batch record that ends the hold, not after a fixed number of hours."}]
        - title: "Sterile filtration: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "Routine pre-filtration bioburden and endotoxin samples are taken. Sterile filtration runs in line with filling, with no hold. No PPQ samples will be pulled for this unit operation. The filtrate cannot be sampled without breaking sterility."}]
        - title: "Filling and plunger stopper placement: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "list", "items": ["The first 8 syringes (4 plus 4 backup) after the initial purge and weight checks are taken to check the filter flush (sample 10).", "Beginning, middle and end: 55 syringes each, plus an identical backup set of 55 (samples 11 to 13). The syringes are taken evenly from every filling head (all heads are sampled; 4 heads, assumed), and the fill weight is checked on every head after every intervention, line stop, restart or adjustment.", "In every PPQ batch (PPQ 1, PPQ 2 and PPQ 3) a 60-minute line stop is made as a challenge. It is a study point of the batch record, not a routine step. A batch without the challenge would count as a 0 h hold, so all three batches are challenged. After the purge, the first 8 syringes after the restart are taken (sample 14); the syringes filled just before the stop (sample 12, taken in the middle of the run) are the T0 of the line stop.", "Interventions are performed up to the TRD normal maximum of 12 per batch (assumed).", "PPQ 2 fills at 200 syringes per minute (the top of the proven speed range) so that 100 L finishes inside the 8 h media-fill limit even with the 60-minute line stop.", "Post-filling hold: when about 1 L remains (assumed), the line is stopped and the surge bag is held until the end of the filling time limit (8 h after the start of filling, the proven limit). At the end of that hold, in the step that ends it, filling resumes and the first syringes filled from the held bulk are sampled (sample 15). Nothing is sampled from the surge bag or any other port after the sterilizing filter: the sterile boundary stays closed and all samples there are taken from filled syringes. The filled syringes stay in the filling room for this time."]}]
        - title: "Inspection, bulk packing, labelling and packaging: run design"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "Routine samples (release testing, AQL, retains) follow the TRD and the specification. No PPQ samples will be pulled for this unit operation."}, {"type": "paragraph", "text": "After the post-filling hold, 300 stability syringes and 70 T0 syringes are taken at random in every PPQ batch (samples 16 and 17, listed with filling because they are taken there). A batch without the challenge would count as a 0 h time out of refrigeration, so all three batches are challenged; for the 9 L batch the syringe samples stay below 15 % of its units. They go through inspection with the batch, then stay at room temperature in light until the total time out of refrigeration reaches the PPQ target of 14 h in every batch, counted from the start of filling (the requirement is more than 12 h; the record limit stays 12 h, so the 14 h is a study point of this challenge portion)."}, {"type": "paragraph", "text": "Time out of refrigeration is tracked per portion: tubs or trays leave and return to the cold room in portions, each portion's out and return times are recorded, and each portion stays within 12 h from the start of filling. A portion is 70 tubs of 100 syringes, so 7,000 syringes; the out and return times include handling, and the 12 h total is summed from the recorded times. At 90 syringes per minute a portion is labelled in about 1.3 h, which fits 2 h including handling. A whole 100 L batch could not be inspected (about 5 h) and labelled (about 15 h) inside 12 h at once."}]
        - title: "Routine samples (not in this plan)"
          placement: "after_section:process-flow"
          includeInCmo: true
          blocks: [{"type": "paragraph", "text": "These samples are not in this plan, per TRD and specification. They are shown in the flow figure only."}, {"type": "list", "items": ["Pooled drug substance protein concentration; protein concentration after dilution.", "Buffer pH, osmolality and density; buffer bioburden and endotoxin before filtration.", "Bioburden and endotoxin before bioburden-reduction filtration and before sterile filtration (100 mL and 5 mL, per TRD).", "Filter integrity before and after use.", "Fill weight checks; stopper position on 5 syringes at the start, middle and end (per TRD); 100 % in-line camera check.", "100 % visual inspection and AQL; release testing and retains per the specification."]}]
      # The plan's own process steps in process order (the order here IS the order on the diagram). Hours are fictional planned durations; the
      # longest (PPQ 2 and 3) hold times are drawn. "Ambient time after thaw" is a step of its own so that its minimum time can be a target.
      # Buffer preparation is a sub-process that feeds compounding.
      steps:
        - {"ref": "thaw", "unitOp": "ds_receipt_thaw", "hours": 12, "text": ["Thaw per the TRD"]}
        - {"ref": "ambient", "custom": "Ambient time after thaw", "hours": 5, "text": ["PPQ target 5 h in every batch", "Requirement: more than 4 h"]}
        - {"ref": "compounding", "unitOp": "compounding", "hours": 5, "text": ["Pool, dilute and mix", "Impeller covered from 9 L"]}
        - {"ref": "bbr", "unitOp": "bbr_filtration", "hours": 26, "text": ["About 2 h of filtration for 100 L", "Filter contact pause 24 h in every batch (requirement: more than 4 h)"]}
        - {"ref": "sterile", "unitOp": "sterile_filtration", "hours": 8, "text": ["In line with filling"]}
        - {"ref": "filling", "unitOp": "aseptic_filling", "hours": 8, "text": ["Filling limit 8 h (media fill)", "PPQ 2 at 200/min"]}
        - {"ref": "inspection", "unitOp": "visual_inspection", "hours": 5}
        - {"ref": "bulk", "unitOp": "bulk_packaging", "hours": 2}
        - {"ref": "labelling", "unitOp": "labeling_packaging", "hours": 15}
        - {"ref": "storage", "unitOp": "storage_shipping", "hours": 24}
        - {"ref": "buffer_prep", "unitOp": "buffer_prep", "hours": 6, "subProcess": "buffer"}
      holds:
        - {"ref": "cold", "after": "thaw", "label": "Thawed drug substance hold", "durationText": "PPQ target 30 h in every batch", "hours": 30, "condition": "2 to 8 °C"}
        - {"ref": "diluted", "after": "compounding", "label": "Diluted bulk hold", "durationText": "PPQ target 30 h in every batch", "hours": 30, "condition": "2 to 8 °C"}
        - {"ref": "holdbag", "after": "bbr", "label": "Post-BBR bulk hold in the holding bag", "durationText": "PPQ target 30 h in every batch", "hours": 30, "condition": "2 to 8 °C"}
        - {"ref": "bufferhold", "after": "buffer_prep", "label": "Dilution buffer hold", "durationText": "PPQ target 96 h in every batch", "hours": 96}
      subProcesses:
        - {"ref": "buffer", "label": "Buffer", "feeds": "compounding"}
      # PPQ must reach these times. The time out of refrigeration is counted per portion in the batch record; the bar spans the whole batch
      # only because the figure draws the batch as one line.
      timeTargets:
        - {"label": "Ambient time after thaw", "from": "ambient", "fromEdge": "start", "to": "compounding", "toEdge": "start", "comparator": ">=", "hours": 5, "note": "PPQ target in every batch (requirement: more than 4 h). The clock starts at the end of the thaw; the time before cold storage and the time from taking the containers out until pooling starts are added up (drawn as one block)."}
        - {"label": "Total time out of refrigeration of a portion", "from": "filling", "fromEdge": "start", "to": "storage", "toEdge": "start", "comparator": ">=", "hours": 14, "note": "Samples 16 and 17. PPQ target in every batch (requirement: more than 12 h; record limit 12 h). Counted per portion, from the start of filling to final storage at 2 to 8 °C."}
      batches:
        - {"label": "PPQ 1", "plannedLotSizeUnits": 42000, "batchSize": 50, "batchSizeUnit": "L", "notes": "Middle of the range, the TRD target (about 42,000 syringes at 1.1 mL = 46.2 L, plus bulk samples and the 3 L hold-up allowance; filled at 150/min, about 4.7 h). Includes the 60-minute line stop challenge."}
        - {"label": "PPQ 2", "plannedLotSizeUnits": 76000, "batchSize": 100, "batchSizeUnit": "L", "notes": "Largest batch of the bag (about 76,000 syringes at 1.1 mL = 83.6 L, plus 0.50 L of bulk samples (with the line purge, the two bioburden samples and the in-process controls) and the 3 L hold-up allowance = 87.10 L of the 100 L, and the other 12.9 L are not filled because the 8 h limit ends the run; filled at 200/min, the top of the proven speed range, about 6.3 h plus 1 h of line stop and 0.5 h of interventions = 7.8 h, inside the 8 h limit). Includes the 60-minute line stop challenge."}
