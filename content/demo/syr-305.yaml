 across the three lots. Every batch is held to the same PPQ target of 30 h (requirement: more than 24 h)."}}, "reporting": {"what": ["individual", "trend"], "presentation": ["by_time_point", "across_batches"], "deviationRef": "SOP-DEV-305 (fictional)"}}}

# ---------------------------------------------------------------- the master batch record (MBR)
# Built from the TRD above through the same functions a person uses (sections follow the selected unit operations in process order; blocks come
# from the step-blocks library). The sample tables of the compounding, bioburden-reduction filtration and filling sections come from the PPQ
# sampling plan above (one row per sampling point, kept in step with the plan). The other steps pull no PPQ samples. The limits are the TRD's
# claims; the longer PPQ-only holds are not written into the record as limits. There is no filtered-bulk-hold block:
# filling starts directly after sterile filtration. There is no needle-check block either: the TRD states that needle clogging is not likely.
mbr:
  at: "2026-10-19T09:00:00.000Z"
  by: Alex Example (fictional)
  role: MSAT engineer
  title: SYR-305 master batch record, Example Fill Site PFS Line 3 (fictional)
  docRef: DEMO-MBR-305-01
  sections:
    - { uo: ds_shipping_inbound, blocks: [inbound_shipment_check, shipment_monitoring_custody] }
    - { uo: ds_receipt_thaw, blocks: [receipt_and_thaw, sample_table] }
    - { uo: buffer_prep, blocks: [buffer_preparation, sample_table] }
    - { uo: compounding, blocks: [pooling_with_weights, dilution_and_mixing, sample_table] }
    - { uo: bbr_filtration, blocks: [bbr_filtration_run, sample_table] }
    # Sterile filtration runs in line with filling into a small sterile surge bag at the filler: there is no sterile bulk vessel. The end of the
    # filtration (end time, integrity test after use, filtration time) is recorded in the filling section, after the end of filling.
    - { uo: sterile_filtration, blocks: [sterile_filtration_inline, filter_integrity_test] }
    - { uo: aseptic_filling, blocks: [line_preparation, syringe_nest_debagging, portion_definition, stopper_placement_setup, filling_run, sterile_filtration_inline_end, portion_cold_storage, plunger_stopper_placement, sample_table] }
    - { uo: visual_inspection, blocks: [visual_inspection_run] }
    - { uo: bulk_packaging, blocks: [bulk_packing, reconciliation_chain] }
    - { uo: labeling_packaging, blocks: [labeling_run] }
    - { uo: storage_shipping, blocks: [time_out_of_refrigeration_total, storage_and_shipment] }
    - { title: Batch record review, blocks: [batch_review] }
  # Rows the team has not decided yet; every other row with a TRD value is set to "same as TRD".
  undecided:
    # The study point row below carries its own value, so it has no "same as TRD" choice.
    - visual_inspection.inspection_rate_range
  rows:
    # One value the receiving unit tightens inside the TRD range, with its reason.
    # The buffer batch rows keep the TRD values (the 25.0 kg example batch). The 50.0 kg batch for PPQ 2 is a study point row below.
    - { uo: buffer_prep, row: batch_volume, choice: same_as_trd }
    - { uo: buffer_prep, row: batch_volume_range, choice: same_as_trd }
    - { uo: aseptic_filling, row: stopper_position_range, choice: tightened_by_cmo, mbrValue: 6.2 to 6.8, mbrUnit: mm, reason: "The placement unit repeats within a narrower band than the TRD range, so the receiving unit keeps the position inside it (fictional)" }
    # One study point beyond the TRD range: a challenge run of the inspection machine, not a limit.
    - { uo: visual_inspection, row: inspection_rate_range, mbrValue: "360", mbrUnit: units/min, studyPoint: true, reason: "Challenge run at a higher inspection rate for the machine qualification study (fictional)" }
  # The challenges of the approved PPQ plan that go beyond the limits of this record. Each is a STUDY POINT with its reason, so running it is
  # planned and is not a deviation. The TRD limits stay as they are; the PPQ results decide whether the longer values are claimed afterwards.
  studyPoints:
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, label: "Study point: hold of the thawed drug substance in cold storage (all PPQ batches)", mbrValue: "30", mbrUnit: h, reason: "The approved PPQ plan holds every PPQ batch to the same target of 30 h, longer than the requirement of more than 24 h and beyond the limit of this record (study point)" }
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, label: "Study point: ambient time after thaw (all PPQ batches)", mbrValue: "5", mbrUnit: h, reason: "The approved PPQ plan runs every PPQ batch with the same target of 5 h at ambient temperature after the end of the thaw, longer than the requirement of more than 4 h and beyond the limit of this record (study point)" }
    - { uo: buffer_prep, block: buffer_preparation, label: "Study point: buffer hold (all PPQ batches)", mbrValue: "96", mbrUnit: h, reason: "The approved PPQ plan holds the buffer of every PPQ batch to the same target of 96 h, longer than the requirement of more than 72 h and beyond the limit of this record (study point)" }
    - { uo: buffer_prep, block: buffer_preparation, label: "Study point: buffer batch for PPQ 2", mbrValue: "50", mbrUnit: L, reason: "PPQ 2 needs 37.5 L of buffer, more than the 25.0 kg example batch of the TRD gives; a 50 L buffer batch is made for it (study point)" }
    - { uo: compounding, block: dilution_and_mixing, label: "Study point: formulated bulk hold (all PPQ batches)", mbrValue: "30", mbrUnit: h, reason: "The approved PPQ plan holds the formulated bulk of every PPQ batch to the same target of 30 h, longer than the requirement of more than 24 h and beyond the limit of this record (study point)" }
    - { uo: compounding, block: dilution_and_mixing, label: "Study point: largest batch size (PPQ 2)", mbrValue: "100", mbrUnit: L, reason: "The approved PPQ plan mixes the largest batch the 100 L bag allows, beyond the normal operating range of this record (study point)" }
    - { uo: compounding, block: dilution_and_mixing, label: "Study point: smallest batch size (PPQ 3)", mbrValue: "9", mbrUnit: L, reason: "The approved PPQ plan mixes the smallest batch that covers the impeller, below the normal operating range of this record (study point)" }
    - { uo: bbr_filtration, block: bbr_filtration_run, label: "Study point: filter contact time (all PPQ batches)", mbrValue: "24", mbrUnit: h, reason: "The approved PPQ plan pauses filtration with product on the filter in every PPQ batch for the same target of 24 h, longer than the requirement of more than 4 h and beyond the normal operating range of this record (study point)" }
    - { uo: bbr_filtration, block: bbr_filtration_run, label: "Study point: hold in the holding bag (all PPQ batches)", mbrValue: "30", mbrUnit: h, reason: "The approved PPQ plan holds the filtered bulk of every PPQ batch to the same target of 30 h, longer than the requirement of more than 24 h and beyond the limit of this record (study point)" }
    - { uo: aseptic_filling, block: filling_run, label: "Study point: filling line speed (PPQ 2)", mbrValue: "200", mbrUnit: units/min, reason: "PPQ 2 (100 L) runs at the top of the proven speed range so that the run fits inside the 8 h filling time limit (study point)" }
    - { uo: aseptic_filling, block: filling_run, label: "Study point: planned line stop (all PPQ batches)", mbrValue: "60", mbrUnit: min, reason: "A 60-minute line stop is a challenge of every PPQ batch, so that no batch counts as a 0 h hold. The routine record has no planned line stop (study point)" }
    - { uo: storage_shipping, block: time_out_of_refrigeration_total, label: "Study point: total time out of refrigeration of the challenge portion (all PPQ batches)", mbrValue: "14", mbrUnit: h, reason: "The approved PPQ plan keeps the stability and T0 syringes of every PPQ batch out of refrigeration for the same target of 14 h, longer than the requirement of more than 12 h. The limit of this record stays at 12 h (self-restricted); the 14 h is a study point of this challenge portion only" }
  refs: []
  # The record's own buffer calculation, worked from the TRD formula (ratio x size), so a reviewer can check every figure against the TRD tables.
  steps:
    # T0 and end-of-hold samples of the holds that have no sample slot in the library (the library knows only the holding-bag hold).
    - uo: buffer_prep
      block: buffer_preparation
      step: 7
      text: "Record the buffer volume and the storage vessel, and the time the buffer is placed in hold (the start of the hold): {volume}, {vessel ID}, {hold start}."
      after:
        - "Take sample SP-020 (sample table of this section) at the end of the hold, in the step that ends it: when the hold is over and before the buffer is taken for use. The T0 of this hold is the last in-process buffer sample taken before the hold (not taken twice). Record the time and the person who took it: {sampling time}, {sampled by}."
        - "Record the time the buffer is taken for use (the end of the hold) and the hold time: {hold end}, {hold time}."
    - uo: buffer_prep
      block: buffer_preparation
      step: 5
      text: "Take the in-process samples listed in the table below and record the results: {sampling time}, {results}. The last of these samples, taken before the buffer goes into hold, is the T0 of the buffer hold."
    # The portion is defined in the record itself: 70 tubs of 100 syringes (fictional), the group that leaves and returns to cold storage together.
    - uo: aseptic_filling
      block: portion_definition
      step: 1
      text: "Define the portions of this batch before filling starts. In this record a portion is 70 tubs of 100 syringes, so 7 000 syringes (fictional), and is the smallest group that leaves and returns to refrigerated storage together. Every time-out-of-refrigeration entry later in this record names the portion by its ID. Record: {portion IDs}."
    - uo: ds_receipt_thaw
      block: receipt_and_thaw
      step: 7
      text: "Record the time the thawed drug substance is placed in cold storage (the start of the cold hold), the cold storage unit and the ambient time used up to this point. The cold hold ends, and the ambient clock runs again, when the containers are taken out for pooling (recorded in the pooling section): {ambient time used}, {cold storage start}, {cold storage unit ID}."
      after:
        - "Take sample SP-018 (sample table of this section) from the thawed drug substance at the start of the cold hold. It is the T0 of the cold hold and of the ambient time after thaw. Record the time and the person who took it: {sampling time}, {sampled by}."
        - "Take sample SP-019 (sample table of this section) from the thawed drug substance at the end of the cold hold, in the step that ends it: when the hold is over and before the containers are taken out of cold storage in the pooling section. Record the time and the person who took it: {sampling time}, {sampled by}."
    - uo: compounding
      block: pooling_with_weights
      step: 1
      text: "Check the line clearance of the compounding area and record it: {line clearance form number}."
      after:
        - "Before the containers are taken out of cold storage in the next step, check that sample SP-019, the end sample of the cold hold, was taken (it is listed in the sample table of the receipt and thaw section). Record the check: {sampling checked}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 4
      text: "Check that the bioburden sample before the BBR filter was taken: it is sample SP-021 of the pooling, compounding and dilution section (100 mL, not more than 10 CFU/100 mL, every batch), drawn from the compounding vessel at the end of the bulk hold, immediately before this filtration (worst case; it is also the T0 of the filter contact, whose end sample is SP-007). Record: {sampling time}, {sample volume}, {sample number}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 2
      text: "Wet the filter as described in {form or SOP number} and run the integrity test before use. Record the wetting fluid, the time, the reading and the filter specification: {wetting fluid}, {time}, {pre-use reading}, {specification}, {pre-use result}."
      after:
        - "Samples from the holding bag (samples SP-007 to SP-009) are drawn through the sample-bag manifold attached to the holding bag line before use (draw into the sample bag, then heat-seal it off), or through a sterile connector. The holding bag is never opened. Purge the line first: discard the first 5 mL. The T0 sample SP-007 is drawn right when the bag is filled. Record the purge volume with each sample: {purge volume}."
    # The later step is edited first: the added steps move everything behind step 2 down.
    - uo: sterile_filtration
      block: sterile_filtration_inline
      step: 2
      text: "Wet the filter as described in {form or SOP number} and run the pre-use post-sterilization integrity test (PUPSIT) on the assembled filter before use, with the vent filter and drain bag of the test kept closed afterwards. Record the wetting fluid, the time, the reading and the filter specification: {wetting fluid}, {time}, {pre-use reading}, {specification}, {pre-use result}."
    - uo: aseptic_filling
      block: sterile_filtration_inline_end
      step: 2
      text: "Run the non-destructive integrity test after use, before the filter is removed, and record the reading against the filter specification: {post-use reading}, {specification}, {post-use result}."
    - uo: sterile_filtration
      block: sterile_filtration_inline
      step: 3
      text: "Check that the bioburden sample before the sterilizing filter was taken: it is sample SP-009 (100 mL, not more than 10 CFU/100 mL, every batch) of the BBR filtration section, drawn from the holding bag through its sample-bag manifold at the end of the holding-bag hold, immediately before this filtration starts (it serves as the end-of-hold sample of the holding bag too, not taken twice). The sterile side (after this filter: surge bag, filling needles) has no sampling ports and stays closed: all samples there are taken from filled syringes, in the filling section. The integrity tests (before and after use) are recorded as tests, not as product samples: {sampling checked}, {sample number}."
    - uo: buffer_prep
      block: buffer_preparation
      step: 3
      text: "Add the components in the order of the steps above. Each amount is to be within the TRD addition tolerance of ±2 % (fictional) of the calculated amount shown in its step. Confirm in the steps above that the lot and weight of each component are recorded."
    - uo: buffer_prep
      block: buffer_preparation
      step: 2
      text: "Buffer batch size: 25.0 kg (the TRD example, used for PPQ 1 and PPQ 3) takes half of each amount shown below. The 50.0 kg batch (about 50 L at 1.00 kg/L, fictional) for PPQ 2 is a study point of this record: PPQ 2 needs 37.5 L of buffer (0.375 L of buffer per litre of product batch) plus about 33 % for losses and dead volume. Each amount below is the TRD ratio x 50.0 kg. Record the buffer batch size: {buffer batch size}."
      after:
        - "Stabilizer stock (40 % w/w, TRD excipient solution table). Needed: 175 g of stock per kg of buffer x 50.0 kg = 8750 g. Make 9000 g of solution: 9000 g x 40 % = 3600 g of Stabilizer B, and 9000 g - 3600 g = 5400 g of water for injection. Record: {Stabilizer B lot}, {Stabilizer B weight}, {water weight}."
        - "Surfactant stock (10 % w/w, TRD excipient solution table). Needed: 2.0 g of stock per kg of buffer x 50.0 kg = 100 g. Make 200 g of solution: 200 g x 10 % = 20.0 g of Surfactant C, and 200 g - 20.0 g = 180 g of water for injection. Record: {Surfactant C lot}, {Surfactant C weight}, {water weight}."
        - "Buffer salt A: 1.55 g/kg x 50.0 kg = 77.5 g. Record: {lot number}, {weight}."
        - "Buffer salt B: 2.10 g/kg x 50.0 kg = 105 g. Record: {lot number}, {weight}."
        - "Stabilizer stock: 175 g of stock per kg of buffer x 50.0 kg = 8750 g of stock. Record: {stock batch}, {weight}."
        - "Surfactant stock: 2.0 g of stock per kg of buffer x 50.0 kg = 100 g of stock. Record: {stock batch}, {weight}."
        - "Water for injection to 50.0 kg: 50 000 g - (77.5 g + 105 g + 8750 g + 100 g = 9032.5 g) = 40 967.5 g. Record: {lot number}, {weight}."
    - uo: compounding
      block: dilution_and_mixing
      step: 10
      text: "Record the time the formulated bulk is placed in hold (the start of the formulated bulk hold), the holding vessel and the holding temperature. The hold ends when the bulk is taken to filtration (recorded in the filtration section): {hold start}, {holding vessel ID}, {holding temperature}."
      after:
        - "Take sample SP-021 (sample table of this section) from the formulated bulk at the end of the formulated bulk hold, in the step that ends it: when the hold is over and before the bulk is taken to the filtration section. It is also the T0 of the filter contact; the end sample of the filter contact is sample SP-007. Record the time and the person who took it: {sampling time}, {sampled by}."
    - uo: compounding
      block: dilution_and_mixing
      step: 1
      text: "Calculate the volume of buffer to add: volume = the TRD diluent ratio x the batch size. The TRD ratio is 18.75 L of buffer for a 50 L batch = 0.375 L per litre of batch. For the PPQ batches: 9 L x 0.375 = 3.375 L; 50 L x 0.375 = 18.75 L; 100 L x 0.375 = 37.5 L. Record: {batch size}, {calculated volume}."
      after:
        - "Volume balance (fictional). The batch volume is to cover the filled volume, the bulk samples and the hold-up allowance (dead volume) of about 3.0 L: compounding bag 0.5 L, bioburden-reduction filter and tubing 0.6 L, holding bag 0.4 L, sterile filter and tubing 0.5 L, filler prime and purge 0.7 L, surge bag 0.3 L. Planned units x 1.1 mL + bulk samples + 3.0 L is not to exceed the batch size. Bulk samples are 0.49 L in every batch: 12 samples of 20 mL each (6 mixing samples, 3 holding-bag hold samples, sample 21 from the compounding vessel and samples 18 and 19 from the thawed containers) = 0.24 L, plus the 5 mL that is discarded to purge the sample line before each of the 10 draws from the vessel or the bag = 0.05 L, plus two bioburden samples of 100 mL (with samples 21 and 9) = 0.20 L. No sample is taken from the sterile side (after the sterilizing filter). PPQ 1: 42 000 units = 46.2 L + 0.49 L + 3.0 L = 49.69 L of 50 L. PPQ 2: 76 000 units = 83.6 L + 0.49 L + 3.0 L = 87.09 L of 100 L. PPQ 3: 5 000 units = 5.5 L + 0.49 L + 3.0 L = 8.99 L of 9 L. Record: {planned units}, {bulk sample volume}, {hold-up allowance}, {volume balance}."
        - "Samples from the compounding vessel (mixing samples, sample 21) are drawn through the sampling valve or port of the vessel. The compounding vessel is on the non-sterile side, before the sterilizing filter, so sampling here does not open the sterile boundary. Purge the sample line first: discard the first 5 mL, then fill the sample containers. Record the purge volume with each sample: {purge volume}."
    # The PPQ line stop (a study point) and the post-filling hold sample belong to this record only; the library knows neither.
    - uo: aseptic_filling
      block: filling_run
      step: 10
      text: "Take samples SP-013, SP-016, SP-017 (sample table of this section) at the end of the filling run and record the time and the person who took them: {sampling time}, {sampled by}."
      after:
        - "PPQ batches only: when about 1 L of bulk remains, stop the line and hold the surge bag until the end of the filling time limit (8 h after the start of filling). At the end of that hold, in this step, restart the filling and take sample SP-015 (sample table of this section) from the first syringes filled from the held bulk. Do not sample the surge bag: it is on the sterile side and stays closed. Record the time and the person who took it: {line stop time}, {sampling time}, {sampled by}."
    - uo: aseptic_filling
      block: filling_run
      step: 8
      text: "In every PPQ batch (the 60-minute line stop is a study point of this record; the routine record has no planned line stop): after the line stop and the purge that follows it, take sample SP-014 (sample table of this section) from the first syringes filled after the restart. The T0 of the line stop is sample SP-012 (the syringes filled just before the stop, in the middle of the filling run; not taken twice). Take the syringes evenly from every filling head. After the line stop, and after every other intervention, restart or adjustment, check the fill weight on every filling head at a tighter frequency (every 10 minutes for the first 30 minutes, then the routine frequency of the table; assumed) before the run continues. Record the stop time, the restart time and the person who took it: {stop time}, {restart time}, {sampled by}."
    # The challenge portion of the PPQ time out of refrigeration (a study point). It is a step of this record only.
    - uo: storage_shipping
      block: time_out_of_refrigeration_total
      step: 2
      text: "Add up the recorded stage times of each portion and record the total against the critical limit shown in the table below. The total is the sum of the recorded times, never an estimate: {portion ID}, {total time}."
      after:
        - "PPQ batches only (study point of this record): keep the stability and T0 syringes (samples SP-016 and SP-017) at room temperature in light, outside refrigerated storage, until their total time out of refrigeration, counted from the start of filling, reaches 14 h. Their T0 is sample SP-011 (beginning of filling); the end sample is SP-017. The limit of this record stays at 12 h for every other portion. Record the time the syringes left refrigerated storage and the time they returned: {portion ID}, {out time}, {return time}, {total time}."
  limits:
    # The total time out of refrigeration is the critical limit; each stage has its own target under it. The stage values are the TRD's
    # budgets for the stage (filling, inspection, bulk packing, labelling) and add up to the critical limit. The out and return times of a stage
    # include the handling before and after the work; the total is summed from the recorded times.
    - uo: storage_shipping
      limit: total_out_of_refrigeration
      targets:
        - { label: Filling (per portion), value: "6", unit: h, fromStep: { uo: aseptic_filling, block: filling_run, step: 3 }, toStep: { uo: aseptic_filling, block: portion_cold_storage, step: 1 } }
