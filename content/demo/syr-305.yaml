# ---------------------------------------------------------------- the technical requirements document (TRD)
# Built from the answers above through the same functions a person uses: the TRD is created from the project, the team then types
# the limits with their sources, switches optional paragraphs on, fills the blanks the project cannot know and edits the starting text.
trd:
  at: "2026-10-12T09:00:00.000Z"
  by: Alex Example (fictional)
  role: MSAT engineer
  title: SYR-305 technical requirements document (fictional)
  docRef: DEMO-TRD-305-01
  version: "0.9 draft"
  purpose: >-
    This technical requirements document sets out the technical requirements for transferring the SYR-305 prefilled syringe process
    from Example Biologics Drug Substance Site (fictional), which supplies frozen drug substance, to Example Fill Site (fictional),
    which thaws, formulates, filters, fills, inspects, packs and ships the drug product. It is the basis from which the master batch
    record of the receiving unit is written (fictional demonstration document).
  scopeNote: >-
    The scope runs from the receipt of frozen drug substance at Example Fill Site (fictional) to the shipment of labelled prefilled
    syringes. Drug substance manufacture, analytical method transfer and release testing are outside this document.
  approvals:
    - { role: "Author (MSAT, receiving unit)", name: Alex Example (fictional) }
    - { role: Technical reviewer (sending unit), name: Sam Example (fictional) }
    - { role: Quality assurance approver (receiving unit), name: Robin Example (fictional) }
  sources:
    - { identifier: DEMO-PD-305-01, docType: Process development report, title: SYR-305 process development report (fictional), version: "1.0" }
    - { identifier: DEMO-STB-305-01, docType: Study report, title: SYR-305 drug substance stability and hold time summary (fictional), version: "1.0" }
  steps:
    - uo: ds_shipping_inbound
      description: Frozen drug substance travels in a qualified dry-ice shipper from the sending unit to the receiving unit by road, with data loggers and real-time telemetry, under signed custody at each handover.
    - uo: ds_receipt_thaw
      description: The shipment is inspected on arrival and the frozen bottles are stored at the specified temperature. Before use they are thawed in a controlled-rate thaw system and mixed on a rocking platform.
    - uo: buffer_prep
      description: The dilution buffer is prepared on site from weighed raw materials in a single-use bag, bioburden-reduction filtered and held in a controlled, time-limited hold before use.
    - uo: compounding
      description: Thawed drug substance lots are pooled in a single-use bag and diluted with the buffer to the target protein concentration under gentle impeller mixing.
    - uo: bbr_filtration
      description: The formulated bulk passes a bioburden-reduction filter into the holding bag before the sterilizing filter.
    - uo: sterile_filtration
      description: The bulk passes two sterilizing-grade filters in series, in a single-use assembly, with the pre-use post-sterilization integrity test (PUPSIT) performed on the primary filter.
    - uo: aseptic_filling
      description: Glass syringes are filled by a rotary piston pump and the plunger stoppers are placed under vacuum, in an isolator on the filling line.
    - uo: visual_inspection
      description: Every filled syringe is inspected on an automated inspection machine; rejects are counted against an alert limit.
    - uo: bulk_packaging
      description: Inspected syringes are packed into nested tubs, closed, labelled with batch and status labels and held refrigerated until labelling.
    - uo: labeling_packaging
      description: Pressure-sensitive labels are applied, serialization is applied and aggregated, and the units are packed into single-unit cartons.
    - uo: storage_shipping
      description: Labelled syringes are stored in the refrigerated warehouse and shipped refrigerated in qualified passive shippers.
