# ---------------------------------------------------------------- the master batch record (MBR)
# Built from the TRD above through the same functions a person uses (sections follow the selected unit operations in process order; blocks come
# from the step-blocks library). The sample tables of the compounding, bioburden-reduction filtration and filling sections come from the PPQ
# sampling plan above (one row per sampling point, kept in step with the plan). The other steps pull no PPQ samples. The limits are the TRD's
# claims; the longer PPQ-only holds are not written into the record as limits. There is no filtered-bulk-hold block:
# filling starts directly after sterile filtration. There is no needle-check block either: the TRD states that needle clogging is not likely.
mbr:
  at: "2026-10-19T09:00:00.000Z"
  by: Alex Example (fictional)
  role: MSAT engineer
  title: SYR-305 master batch record, Example Fill Site PFS Line 3 (fictional)
  docRef: DEMO-MBR-305-01
  sections:
    - { uo: ds_shipping_inbound, blocks: [batch_identification, inbound_shipment_check, shipment_monitoring_custody] }
    - { uo: ds_receipt_thaw, blocks: [receipt_and_thaw, sample_table] }
    - { uo: buffer_prep, blocks: [buffer_preparation, sample_table] }
    - { uo: compounding, blocks: [pooling_with_weights, dilution_and_mixing, sample_table] }
    - { uo: bbr_filtration, blocks: [bbr_filtration_run, filter_records, sample_table] }
    # Sterile filtration runs in line with filling into a small sterile surge bag at the filler: there is no sterile bulk vessel. The end of the
    # filtration (end time, integrity test after use, filtration time) is recorded in the filling section, after the end of filling.
    - { uo: sterile_filtration, blocks: [sterile_filtration_inline, filter_integrity_test, filter_records] }
    - { uo: aseptic_filling, blocks: [line_preparation, syringe_nest_debagging, portion_definition, stopper_placement_setup, sterile_filtration_inline_start, filling_run, intervention_log, sterile_filtration_inline_end, plunger_stopper_placement, sample_table] }
    - { uo: visual_inspection, blocks: [visual_inspection_run] }
    - { uo: bulk_packaging, blocks: [bulk_packing, reconciliation_chain] }
    - { uo: labeling_packaging, blocks: [labeling_run] }
    - { uo: storage_shipping, blocks: [time_out_of_refrigeration_total, storage_and_shipment] }
    - { title: Batch record review, blocks: [batch_review] }
  # Rows the team has not decided yet; every other row with a TRD value is set to "same as TRD".
  undecided:
    # The study point row below carries its own value, so it has no "same as TRD" choice.
    - visual_inspection.inspection_rate_range
  rows:
    # One value the receiving unit tightens inside the TRD range, with its reason.
    # The buffer batch rows keep the TRD values (the 25.0 kg example batch). The 50.0 kg batch for PPQ 2 is a study point row below.
    - { uo: buffer_prep, row: batch_volume, choice: same_as_trd }
    - { uo: buffer_prep, row: batch_volume_range, choice: same_as_trd }
    - { uo: aseptic_filling, row: stopper_position_range, choice: tightened_by_cmo, mbrValue: 6.2 to 6.8, mbrUnit: mm, reason: "The placement unit repeats within a narrower band than the TRD range, so the receiving unit keeps the position inside it (fictional)" }
    # One study point beyond the TRD range: a challenge run of the inspection machine, not a limit.
    - { uo: visual_inspection, row: inspection_rate_range, mbrValue: "360", mbrUnit: units/min, studyPoint: true, reason: "Challenge run at a higher inspection rate for the machine qualification study (fictional)" }
  # The challenges of the approved PPQ plan that go beyond the limits of this record. Each is a STUDY POINT with its reason, so running it is
  # planned and is not a deviation. The TRD limits stay as they are; the PPQ results decide whether the longer values are claimed afterwards.
  studyPoints:
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, label: "Study point: hold of the thawed drug substance in cold storage (all PPQ batches)", mbrValue: "30", mbrUnit: h, reason: "The approved PPQ plan holds every PPQ batch to the same target of 30 h, longer than the requirement of more than 24 h and beyond the limit of this record (study point)" }
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, label: "Study point: ambient time after thaw (all PPQ batches)", mbrValue: "5", mbrUnit: h, reason: "The approved PPQ plan runs every PPQ batch with the same target of 5 h at ambient temperature after the end of the thaw, longer than the requirement of more than 4 h and beyond the limit of this record (study point)" }
    - { uo: buffer_prep, block: buffer_preparation, label: "Study point: buffer hold (all PPQ batches)", mbrValue: "96", mbrUnit: h, reason: "The approved PPQ plan holds the buffer of every PPQ batch to the same target of 96 h, longer than the requirement of more than 72 h and beyond the limit of this record (study point)" }
    - { uo: buffer_prep, block: buffer_preparation, label: "Study point: buffer batch for PPQ 2", mbrValue: "50", mbrUnit: L, reason: "PPQ 2 needs 37.5 L of buffer, more than the 25.0 kg example batch of the TRD gives; a 50 L buffer batch is made for it (study point)" }
    - { uo: compounding, block: dilution_and_mixing, label: "Study point: formulated bulk hold (all PPQ batches)", mbrValue: "30", mbrUnit: h, reason: "The approved PPQ plan holds the formulated bulk of every PPQ batch to the same target of 30 h, longer than the requirement of more than 24 h and beyond the limit of this record (study point)" }
    - { uo: compounding, block: dilution_and_mixing, label: "Study point: largest batch size (PPQ 2)", mbrValue: "100", mbrUnit: L, reason: "The approved PPQ plan mixes the largest batch the 100 L bag allows, beyond the normal operating range of this record (study point)" }
    - { uo: compounding, block: dilution_and_mixing, label: "Study point: smallest batch size (PPQ 3)", mbrValue: "9", mbrUnit: L, reason: "The approved PPQ plan mixes the smallest batch that covers the impeller, below the normal operating range of this record (study point)" }
    - { uo: bbr_filtration, block: bbr_filtration_run, label: "Study point: filter contact time (all PPQ batches)", mbrValue: "24", mbrUnit: h, reason: "The approved PPQ plan pauses filtration with product on the filter in every PPQ batch for the same target of at least 24 h, longer than the requirement of more than 4 h and beyond the normal operating range of this record (study point). The contact time is counted from the start to the end of the filtration (about 25 h with the filtering time); the 24 h pause alone meets the target" }
    - { uo: bbr_filtration, block: bbr_filtration_run, label: "Study point: hold in the holding bag (all PPQ batches)", mbrValue: "30", mbrUnit: h, reason: "The approved PPQ plan holds the filtered bulk of every PPQ batch to the same target of 30 h, longer than the requirement of more than 24 h and beyond the limit of this record (study point)" }
    - { uo: aseptic_filling, block: filling_run, label: "Study point: filling line speed (PPQ 2)", mbrValue: "200", mbrUnit: units/min, reason: "PPQ 2 (100 L) runs at the top of the proven speed range so that the run fits inside the 8 h filling time limit (study point)" }
    - { uo: aseptic_filling, block: filling_run, label: "Study point: planned line stop (all PPQ batches)", mbrValue: "60", mbrUnit: min, reason: "A 60-minute line stop is a challenge of every PPQ batch, so that no batch counts as a 0 h hold. The routine record has no planned line stop (study point)" }
    - { uo: storage_shipping, block: time_out_of_refrigeration_total, label: "Study point: total time out of refrigeration of the challenge portion (all PPQ batches)", mbrValue: "14", mbrUnit: h, reason: "The approved PPQ plan keeps the stability and T0 syringes of every PPQ batch out of refrigeration for the same target of 14 h, longer than the requirement of more than 12 h. The limit of this record stays at 12 h (self-restricted); the 14 h is a study point of this challenge portion only" }
  # Cross-references to steps of this record. A reference prints the number of the step it points to, so it stays right when steps are added
  # or moved. The place written here ("step") is the place in the finished record (the references are inserted after the steps below).
  # The text of the step has the words in "find"; the number is inserted right after them.
  refs:
    # Receipt and thaw (cold storage step) -> the pooling steps that end the hold
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, step: 8, find: "taken out for pooling", insert: " {ref}", to: { uo: compounding, block: pooling_with_weights, step: 3 } }
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, step: 8, find: "that pooling step", insert: " {ref}", to: { uo: compounding, block: pooling_with_weights, step: 2 } }
    - { uo: ds_receipt_thaw, block: receipt_and_thaw, step: 4, find: "in its hold", insert: " {ref}", to: { uo: buffer_prep, block: buffer_preparation, step: 14 } }
    - { uo: ds_receipt_thaw, block: sample_table, step: 1, find: "names it", insert: " {ref}", to: { uo: ds_receipt_thaw, block: receipt_and_thaw, step: 10 } }
    - { uo: ds_receipt_thaw, block: sample_table, step: 1, find: "pooling section", insert: " {ref}", to: { uo: compounding, block: pooling_with_weights, step: 2 } }
    # Buffer preparation -> the thaw, the end of the buffer hold
    - { uo: buffer_prep, block: buffer_preparation, step: 14, find: "of the drug substance starts", insert: " {ref}", to: { uo: ds_receipt_thaw, block: receipt_and_thaw, step: 5 } }
    - { uo: buffer_prep, block: buffer_preparation, step: 14, find: "dilution section", insert: " {ref}", to: { uo: compounding, block: dilution_and_mixing, step: 5 } }
    - { uo: buffer_prep, block: sample_table, step: 1, find: "dilution section", insert: " {ref}", to: { uo: compounding, block: dilution_and_mixing, step: 5 } }
    # Compounding -> the BBR steps that end the formulated bulk hold
    - { uo: compounding, block: dilution_and_mixing, step: 16, find: "recorded in the filtration section ", insert: "{ref}", to: { uo: bbr_filtration, block: bbr_filtration_run, step: 5 } }
    - { uo: compounding, block: dilution_and_mixing, step: 16, find: "taken in the filtration section, in ", insert: "{ref}", to: { uo: bbr_filtration, block: bbr_filtration_run, step: 4 } }
    - { uo: compounding, block: dilution_and_mixing, step: 15, find: "volume balance", insert: " {ref}", to: { uo: compounding, block: dilution_and_mixing, step: 2 } }
    - { uo: compounding, block: sample_table, step: 1, find: "filtration section", insert: " {ref}", to: { uo: bbr_filtration, block: bbr_filtration_run, step: 4 } }
    # BBR filtration -> the filling steps that end the holding-bag hold
    - { uo: bbr_filtration, block: bbr_filtration_run, step: 13, find: "in the filling section", insert: " {ref}", to: { uo: aseptic_filling, block: sterile_filtration_inline_start, step: 1 } }
    - { uo: bbr_filtration, block: bbr_filtration_run, step: 14, find: "in the filling section", insert: " {ref}", to: { uo: aseptic_filling, block: sterile_filtration_inline_start, step: 2 } }
    - { uo: bbr_filtration, block: sample_table, step: 1, find: "filling section", insert: " {ref}", to: { uo: aseptic_filling, block: sterile_filtration_inline_start, step: 1 } }
    - { uo: bbr_filtration, block: sample_table, step: 1, find: "compounding table", insert: " {ref}", to: { uo: bbr_filtration, block: bbr_filtration_run, step: 4 } }
    # Sterile filtration set-up -> the filling step that takes the sample
    - { uo: sterile_filtration, block: sterile_filtration_inline, step: 3, find: "in the filling section", insert: " {ref}", to: { uo: aseptic_filling, block: sterile_filtration_inline_start, step: 1 } }
    # Filling
    - { uo: aseptic_filling, block: filling_run, step: 2, find: "started in ", insert: "{ref}", to: { uo: aseptic_filling, block: sterile_filtration_inline_start, step: 3 } }
    - { uo: aseptic_filling, block: filling_run, step: 10, find: "start of the sterile filtration", insert: " {ref}", to: { uo: aseptic_filling, block: sterile_filtration_inline_start, step: 3 } }
    - { uo: aseptic_filling, block: filling_run, step: 12, find: "storage and shipping section", insert: " {ref}", to: { uo: storage_shipping, block: time_out_of_refrigeration_total, step: 3 } }
    - { uo: aseptic_filling, block: sterile_filtration_inline_end, step: 1, find: "counted to the restart", insert: " {ref}", to: { uo: aseptic_filling, block: filling_run, step: 10 } }
    - { uo: aseptic_filling, block: sterile_filtration_inline_end, step: 4, find: "filtrate", insert: " {ref}", to: { uo: bbr_filtration, block: bbr_filtration_run, step: 9 } }
    - { uo: aseptic_filling, block: sterile_filtration_inline_end, step: 4, find: "prime the line", insert: " {ref}", to: { uo: aseptic_filling, block: filling_run, step: 2 } }
    - { uo: aseptic_filling, block: sterile_filtration_inline_end, step: 4, find: "volume balance", insert: " {ref}", to: { uo: compounding, block: dilution_and_mixing, step: 2 } }
    # Per-portion stages: the steps repeat for each portion
    - { uo: visual_inspection, block: visual_inspection_run, step: 2, find: "up to ", insert: "{ref}", to: { uo: visual_inspection, block: visual_inspection_run, step: 6 } }
    - { uo: bulk_packaging, block: bulk_packing, step: 2, find: "up to ", insert: "{ref}", to: { uo: bulk_packaging, block: bulk_packing, step: 6 } }
    - { uo: bulk_packaging, block: bulk_packing, step: 5, find: "visual inspection check", insert: " {ref}", to: { uo: visual_inspection, block: visual_inspection_run, step: 5 } }
    - { uo: labeling_packaging, block: labeling_run, step: 3, find: "up to ", insert: "{ref}", to: { uo: labeling_packaging, block: labeling_run, step: 6 } }
    # Storage and shipping
    - { uo: storage_shipping, block: time_out_of_refrigeration_total, step: 1, find: "until its units are back in refrigerated storage.", insert: " The start of filling of each portion is recorded in {ref}.", to: { uo: aseptic_filling, block: filling_run, step: 4 } }
    - { uo: storage_shipping, block: time_out_of_refrigeration_total, step: 3, find: "set aside in the filling run", insert: " {ref}", to: { uo: aseptic_filling, block: filling_run, step: 12 } }
  # Steps changed or added in the record. The record's own buffer calculation is worked from the TRD formula (ratio x size), so a reviewer can
  # check every figure against the TRD tables. Within one block the later step is edited first, so the places named here stay the places of
  # the block as the library gives it (with the sample steps placed), before any step is added to that block.
  steps:
    # ---- Receipt and thaw. The end sample of the cold hold is taken where the hold ends (the pooling section), not here.
    - uo: ds_receipt_thaw
      block: receipt_and_thaw
      step: 7
      text: "Put the thawed containers into cold storage at 2 to 8 °C and record the time (the start of the cold hold), the cold storage unit and the ambient time used up to this point. PPQ batches: keep the containers at ambient temperature until the ambient time used reaches 4.0 h, then put them into cold storage; the last hour of the 5 h ambient time of the PPQ plan is used after the cold hold, in the pooling section (study point: the limit of this record is 4 h, so 5 h is planned and is not a deviation). The cold hold ends, and the ambient clock runs again, when the containers are taken out for pooling. PPQ batches hold for 30 h (study point: the limit of this record is 24 h, so 30 h is planned and is not a deviation). The end sample of the cold hold, SP-019, is not taken here: it is taken in that pooling step, immediately before the containers come out of cold storage: {ambient time used}, {cold storage start}, {cold storage unit ID}."
      after:
        - "How every sample of this record is handled. Label each tube with the sample number, the batch number and the time it was taken. Bulk samples (the drug substance, buffer, formulated bulk, filtrate and mixing samples) are frozen at once at -30 °C or colder, within {freezing time limit} of being taken; syringe samples are stored as the sample table of their section says. Hand the samples to QC sample management at the sample hatch and sign for the hand-over in the sample log: {hand-over time}, {handed over by}, {received by}."
        - "Take sample SP-018 (sample table of this section) from the thawed drug substance at the start of the cold hold. It is the T0 of the cold hold and of the ambient time after thaw. Record the time and the person who took it: {sampling time}, {sampled by}."
    - uo: ds_receipt_thaw
      block: receipt_and_thaw
      step: 3
      after:
        - "PPQ batches only (study point: the buffer hold of the PPQ plan is 96 h, the limit of this record is 72 h): do not start the thaw until the buffer of this batch is in its hold and has been in it for at least 57 h. From the start of the thaw to the addition of the buffer is about 39 h (assumed: 4 h thaw, 5 h ambient time and 30 h cold hold), so the buffer then reaches the 96 h of the plan when it is used. Record: {buffer hold start}, {buffer hold time at the start of the thaw}."
    - uo: ds_receipt_thaw
      block: sample_table
      step: 1
      text: "Check that sample SP-018 was taken at the step of this section that names it, and that the quantity, container and storage match the table. Sample SP-019 is taken in the pooling section and is checked there: {check result}, {checked by}."
    # ---- Buffer preparation. The end of the buffer hold and its end sample are in the pooling, compounding and dilution section, just before the buffer is used.
    - uo: buffer_prep
      block: buffer_preparation
      step: 7
      text: "Record the buffer volume and the storage vessel, and the time the buffer is placed in hold (the start of the hold), kept at 2 to 8 °C. PPQ batches: make this buffer at least 57 h before the thaw of the drug substance starts so that the buffer hold reaches the 96 h of the PPQ plan when the buffer is added (study point: the limit of this record is 72 h, so 96 h is planned and is not a deviation). The hold ends, and the end sample SP-020 is taken, in the pooling, compounding and dilution section and the step after it, just before the buffer is added: {volume}, {vessel ID}, {hold start}."
    - uo: buffer_prep
      block: buffer_preparation
      step: 5
      text: "Take the in-process samples listed in the table below and record the results: {sampling time}, {results}. The last of these samples, taken before the buffer goes into hold, is the T0 of the buffer hold."
    - uo: buffer_prep
      block: buffer_preparation
      step: 3
      text: "Add the components in the order of the steps above. Each amount is to be within the TRD addition tolerance of ±2 % (fictional) of the calculated amount shown in its step, in the column of the batch size you make. Confirm in the steps above that the lot and weight of each component are recorded."
    - uo: buffer_prep
      block: buffer_preparation
      step: 2
      text: "Buffer batch size. Make one of two sizes and record which: 25.0 kg (the TRD example batch, used for PPQ 1 and PPQ 3) or 50.0 kg (about 50 L at 1.00 kg/L, fictional; used for PPQ 2, a study point of this record: PPQ 2 needs 37.5 L of buffer, 0.375 L of buffer per litre of product batch, plus about 33 % for losses and dead volume). Every amount in the steps below is worked for both sizes (TRD ratio x batch size): use the amounts of the size you make. Record the buffer batch size: {buffer batch size}."
      after:
        - "Stabilizer stock (40 % w/w, TRD excipient solution table). Needed: 175 g of stock per kg of buffer, so 4375 g for the 25.0 kg batch and 8750 g for the 50.0 kg batch. Make 4500 g of solution for the 25.0 kg batch (4500 g x 40 % = 1800 g of Stabilizer B, and 4500 g - 1800 g = 2700 g of water for injection) or 9000 g for the 50.0 kg batch (9000 g x 40 % = 3600 g of Stabilizer B, and 9000 g - 3600 g = 5400 g of water for injection). Record: {Stabilizer B lot}, {Stabilizer B weight}, {water weight}."
        - "Surfactant stock (10 % w/w, TRD excipient solution table). Needed: 2.0 g of stock per kg of buffer, so 50 g for the 25.0 kg batch and 100 g for the 50.0 kg batch. Make 100 g of solution for the 25.0 kg batch (100 g x 10 % = 10.0 g of Surfactant C, and 100 g - 10.0 g = 90 g of water for injection) or 200 g for the 50.0 kg batch (200 g x 10 % = 20.0 g of Surfactant C, and 200 g - 20.0 g = 180 g of water for injection). Record: {Surfactant C lot}, {Surfactant C weight}, {water weight}."
        - "Buffer salt A: 1.55 g/kg, so 38.75 g for the 25.0 kg batch and 77.5 g for the 50.0 kg batch. Record: {lot number}, {weight}."
        - "Buffer salt B: 2.10 g/kg, so 52.5 g for the 25.0 kg batch and 105 g for the 50.0 kg batch. Record: {lot number}, {weight}."
        - "Stabilizer stock: 175 g of stock per kg of buffer, so 4375 g for the 25.0 kg batch and 8750 g for the 50.0 kg batch. Record: {stock batch}, {weight}."
        - "Surfactant stock: 2.0 g of stock per kg of buffer, so 50 g for the 25.0 kg batch and 100 g for the 50.0 kg batch. Record: {stock batch}, {weight}."
        - "Water for injection to the batch weight. 25.0 kg batch: 25 000 g - (38.75 g + 52.5 g + 4375 g + 50 g = 4516.25 g) = 20 483.75 g. 50.0 kg batch: 50 000 g - (77.5 g + 105 g + 8750 g + 100 g = 9032.5 g) = 40 967.5 g. Record: {lot number}, {weight}."
    - uo: buffer_prep
      block: sample_table
      step: 1
      text: "Check that the sample of the table below (SP-020) was taken at the end of the buffer hold, in the pooling, compounding and dilution section, and that the quantity, container and storage match the table: {check result}, {checked by}."
    # ---- Pooling. The end sample of the cold hold is taken in the step that ends the hold: just before the containers come out of cold storage.
    - uo: compounding
      block: pooling_with_weights
      step: 6
      text: "Record the time the ambient clock stops for the pooled drug substance and add up the ambient time before and after the cold hold. Record the total against the ambient limit shown in the receipt and thaw section. PPQ batches: the total is planned at about 5.0 h (4.0 h before the cold hold and 1.0 h after it), a study point; the limit of this record is 4 h, so 5 h is planned and is not a deviation: {ambient clock stop}, {total ambient time}."
    - uo: compounding
      block: pooling_with_weights
      step: 2
      text: "Take the thawed containers out of cold storage and record the time. This ends the cold hold (PPQ batches: 30 h is the study point against the limit of 24 h; it is planned and is not a deviation) and the ambient clock runs again from this time: {out of cold storage time}, {cold hold time}."
    - uo: compounding
      block: pooling_with_weights
      step: 1
      after:
        - "Take sample SP-019 (sample table of the receipt and thaw section) from the thawed drug substance at the end of the cold hold, in the step that ends it: now, when the hold is over and before the containers are taken out of cold storage in the next step. Record the time and the person who took it: {sampling time}, {sampled by}."
    # ---- Dilution and mixing. Top and bottom samples, the buffer hold end, the one hold start (the hold start of the library was entered twice), the volume of the in-process controls.
    - uo: compounding
      block: dilution_and_mixing
      step: 12
      text: "Record the time the formulated bulk is placed in hold (the start of the formulated bulk hold), the vessel and the holding temperature (2 to 8 °C). The bulk stays in the compounding vessel for the whole hold; it is not moved to another vessel. The hold ends when the bulk is taken to filtration, recorded in the filtration section . PPQ batches hold for 30 h (study point: the limit of this record is 24 h, so 30 h is planned and is not a deviation). The end sample of this hold, SP-021, is not taken here: it is taken in the filtration section, in , just before the bulk is taken from its hold: {hold start}, {compounding vessel ID}, {holding temperature}."
    - uo: compounding
      block: dilution_and_mixing
      step: 11
      text: "Run the in-process controls listed in the table below on the formulated bulk and record each result against its limit before the bulk goes to filtration. They use 10 mL of the bulk in all, drawn through the sampling valve after the line purge; this volume is part of the bulk samples of the volume balance: {pH}, {osmolality}, {protein concentration}, {appearance}, {bioburden result}, {reviewed by}."
    - uo: compounding
      block: dilution_and_mixing
      step: 8
      text: "Take samples SP-005 (top) and SP-006 (bottom) (sample table of this section) at the end of the mixing time, before the mixer is stopped: SP-005 from the upper sampling port and SP-006 from the bottom sampling valve of the compounding vessel, each after the line purge. Record the time and the person who took them: {sampling time}, {sampled by}."
    - uo: compounding
      block: dilution_and_mixing
      step: 7
      text: "Take samples SP-003 (top) and SP-004 (bottom) (sample table of this section) in the middle of the mixing time, 15 min after mixing starts: SP-003 from the upper sampling port and SP-004 from the bottom sampling valve of the compounding vessel, each after the line purge. Record the time and the person who took them: {sampling time}, {sampled by}."
    - uo: compounding
      block: dilution_and_mixing
      step: 5
      text: "Take samples SP-001 (top) and SP-002 (bottom) (sample table of this section) at the start of mixing: SP-001 from the upper sampling port and SP-002 from the bottom sampling valve of the compounding vessel, each after the line purge. Record the time and the person who took them: {sampling time}, {sampled by}."
    - uo: compounding
      block: dilution_and_mixing
      step: 2
      after:
        - "Take sample SP-020 (sample table of the buffer preparation section) from the buffer at the end of the buffer hold, in the step that ends it: now, when the hold is over and before the buffer is taken for use in the step after next. The T0 of this hold is the last in-process buffer sample taken before the hold (not taken twice). Record the time and the person who took it: {sampling time}, {sampled by}."
        - "Record the time the buffer is taken for use (the end of the buffer hold) and the hold time. PPQ batches: the planned hold is 96 h (study point: the limit of this record is 72 h, so 96 h is planned and is not a deviation): {hold end}, {hold time}."
    - uo: compounding
      block: dilution_and_mixing
      step: 1
      text: "Calculate the volume of buffer to add: volume = the TRD diluent ratio x the batch size. The TRD ratio is 18.75 L of buffer for a 50 L batch = 0.375 L per litre of batch. For the PPQ batches: 9 L x 0.375 = 3.375 L; 50 L x 0.375 = 18.75 L; 100 L x 0.375 = 37.5 L. Record: {batch size}, {calculated volume}."
      after:
        - "Volume balance (fictional). The batch volume is to cover the filled volume, the bulk samples and the hold-up allowance (dead volume) of about 3.0 L: compounding bag 0.5 L, bioburden-reduction filter and tubing 0.6 L, holding bag 0.4 L, sterile filter and tubing 0.5 L, filler prime and purge 0.7 L (the prime of the line and the purge at the restart after the line stop), surge bag 0.3 L. Planned units x 1.1 mL + bulk samples + 3.0 L is not to exceed the batch size. Bulk samples are 0.50 L in every batch: 12 samples of 20 mL each (6 mixing samples, 3 holding-bag hold samples, sample 21 from the compounding vessel and samples 18 and 19 from the thawed containers) = 0.24 L, plus the 5 mL that is discarded to purge the sample line before each of the 10 draws from the vessel or the bag = 0.05 L, plus two bioburden samples of 100 mL (with samples 21 and 9) = 0.20 L, plus the in-process controls of the formulated bulk, 10 mL in all with their purge = 0.01 L. No sample is taken from the sterile side (after the sterilizing filter). PPQ 1: 42 000 units = 46.2 L + 0.50 L + 3.0 L = 49.70 L of 50 L. PPQ 2: 76 000 units = 83.6 L + 0.50 L + 3.0 L = 87.10 L of 100 L. PPQ 2 is the one batch that is not filled to the end of the bulk: at 200 units/min with the 60-minute line stop, 76 000 units already use 7.8 h of the 8 h limit, so the other 12.90 L of the 100 L (the spare of the volume balance) are not filled; they stay in the holding bag as unfilled bulk, are counted in the reconciliation and are discarded after the batch. PPQ 1 and PPQ 3 are filled to the end of the bulk (spare 0.30 L and 0.055 L). PPQ 3: 4 950 units = 5.445 L + 0.50 L + 3.0 L = 8.945 L of 9 L. Record: {planned units}, {bulk sample volume}, {hold-up allowance}, {volume balance}."
        - "Samples from the compounding vessel (mixing samples, sample 21) are drawn through the sampling valve or port of the vessel. The compounding vessel is on the non-sterile side, before the sterilizing filter, so sampling here does not open the sterile boundary. Purge the sample line first: discard the first 5 mL, then fill the sample containers. Record the purge volume with each sample: {purge volume}."
    - uo: compounding
      block: sample_table
      step: 1
      text: "Check that every sample of the table below, except SP-021, was taken at the step of this section that names it, and that the quantity, container and storage match the table. SP-021 is taken at the end of the formulated bulk hold in the filtration section and is checked there: {check result}, {checked by}."
    # ---- BBR filtration. The bulk hold ends here: sample first, then the hold end. The 24 h pause of the PPQ plan is a step. The filtrate runs straight into the holding bag.
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 12
      text: "Keep the holding bag in cold storage. It leaves cold storage only when the sterile filtration is ready to start, in the filling section, where the end of the hold and the hold time are recorded."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 11
      text: "Sample SP-009, the end sample of the holding-bag hold, is not taken here: it is taken from the holding bag in the filling section, at the end of the hold and immediately before the sterile filtration starts."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 10
      text: "In the middle of the hold, 15 h after the hold started (halfway through the 30 h PPQ study hold; the limit of this record is 24 h), take sample SP-008 (sample table of this section) from the holding bag and record the time and the person who took it: {sampling time}, {sampled by}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 8
      text: "Put the holding bag with the filtrate into cold storage at 2 to 8 °C and record the time (the start of the hold) and the cold storage unit: {cold storage start}, {cold storage unit ID}. PPQ batches hold for 30 h (study point: the limit of this record is 24 h, so 30 h is planned and is not a deviation)."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 7
      text: "Weigh the holding bag with the filtrate and subtract its empty weight (recorded when the filter was assembled): {full bag weight}, {filtrate weight}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 5
      after:
        - "PPQ batches only (study point: the filter contact time of the PPQ plan is at least 24 h, the limit of this record is 4 h). The filtration, the pause, the integrity test after use and the weighing of the holding bag are done at 2 to 8 °C (fictional: the compounding vessel, the filter and the holding bag stand in the cold room). Then, after 30 min of filtration, stop the pump with the filter full of product and keep the product on the filter for 24 h at 2 to 8 °C, then restart the pump and finish the filtration. The 24 h is planned and is not a deviation. The filter contact time is counted once, in the same way as the samples: from the start of the filtration (the time of sample SP-021, taken just before it) to the end of the filtration (the time of sample SP-007, taken when the holding bag is filled). It is the 24 h pause plus the filtering time, about 25 h, so the pause alone meets the 24 h of the PPQ plan. Two more fluids wait during the pause, and each has its own entry with vessel, temperature, start and end: the bulk not yet filtered stays in the compounding vessel at 2 to 8 °C from the stop time to the restart time, still in the formulated bulk hold, and its extra time is reported with the formulated bulk hold time; the filtrate already in the holding bag stays there at 2 to 8 °C from the time the first filtrate entered the bag to the restart time, and this waiting time is reported with the holding-bag hold, which is counted from the end of the filtration. Record: {temperature at start of filtration}, {stop time}, {temperature at stop}, {restart time}, {temperature at restart}, {pause time}, {contact time}, {compounding vessel ID}, {unfiltered bulk temperature}, {first filtrate time}, {holding bag temperature at restart}, {temperature at end of filtration}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 4
      text: "Record the time the formulated bulk is taken from its hold to this filtration (the end of the formulated bulk hold) and the hold time. PPQ batches: the planned hold is 30 h (study point: the limit of this record is 24 h, so 30 h is planned and is not a deviation). The bulk that is not yet filtered when the pump is stopped for the pause stays in this hold, and its extra time is reported with this hold time: {hold end}, {hold time}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 3
      text: "Take sample SP-021 (sample table of the pooling, compounding and dilution section) from the formulated bulk at the end of the formulated bulk hold, in the step that ends it: now, when the hold is over and before the bulk is taken from its hold in the next step. Draw it through the sampling valve of the compounding vessel after the line purge: 2 x 10 mL for the chemistry tests and 100 mL in a sterile bottle for bioburden (not more than 10 CFU/100 mL, every batch). It is also the T0 of the filter contact, which is counted from the start of the filtration to its end, as defined in the step on the pause; the end sample of the filter contact is sample SP-007. Record the time, the volumes and the person who took it: {sampling time}, {sample volume}, {sample number}, {sampled by}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 2
      text: "Wet the filter as described in {form or SOP number} and run the integrity test before use. Record the wetting fluid, the time, the reading and the filter specification: {wetting fluid}, {time}, {pre-use reading}, {specification}, {pre-use result}."
      after:
        - "Samples from the holding bag (samples SP-007 to SP-009) are drawn through the sample-bag manifold attached to the holding bag line before use (draw into the sample bag, then heat-seal it off), or through a sterile connector. The holding bag is never opened. Purge the line first: discard the first 5 mL. The T0 sample SP-007 is drawn right when the bag is filled. Record the purge volume with each sample: {purge volume}."
    - uo: bbr_filtration
      block: bbr_filtration_run
      step: 1
      text: "Assemble the filter and the bulk transfer path as described in {form or SOP number}. Connect the filter outlet to the holding bag, so that the filtrate runs straight into it and the bag is never opened, and weigh the empty holding bag. Record the filter identification and the holding bag: {filter lot}, {filter ID}, {holding bag ID}, {holding bag lot}, {empty bag weight}."
    - uo: bbr_filtration
      block: sample_table
      step: 1
      text: "Check that samples SP-007 and SP-008 of the table below, and sample SP-021 of the compounding table, were taken at the steps that name them, and that the quantity, container and storage match the tables. Sample SP-009 is taken in the filling section and is checked there: {check result}, {checked by}."
    # ---- Sterile filtration set-up. The sample SP-009 is taken in the filling section, where the filtration starts.
    - uo: sterile_filtration
      block: sterile_filtration_inline
      step: 3
      text: "The bioburden sample before the sterilizing filter is sample SP-009 (100 mL, not more than 10 CFU/100 mL, every batch). It also serves as the end-of-hold sample of the holding bag, so it is not taken twice. It is not taken here: it is taken from the holding bag through its sample-bag manifold in the filling section, at the end of the holding-bag hold and immediately before the filtration starts. The sterile side (after this filter: surge bag, filling needles) has no sampling ports and stays closed: all samples there are taken from filled syringes, in the filling section. The integrity tests (before and after use) are recorded as tests, not as product samples."
    - uo: sterile_filtration
      block: sterile_filtration_inline
      step: 2
      text: "Wet the filter as described in {form or SOP number} and run the pre-use post-sterilization integrity test (PUPSIT) on the assembled filter before use, with the vent filter and drain bag of the test kept closed afterwards. Record the wetting fluid, the time, the reading and the filter specification: {wetting fluid}, {time}, {pre-use reading}, {specification}, {pre-use result}."
    # ---- Filling section. Set-up, then the holding bag leaves cold storage and the filtration starts, then the line is primed with filtrate.
    - uo: aseptic_filling
      block: portion_definition
      step: 1
      text: "Define the portions of this batch before filling starts. In this record a portion is 70 tubs of 100 syringes, so 7 000 syringes (fictional), and is the smallest group that leaves and returns to refrigerated storage together. Every time-out-of-refrigeration entry later in this record names the portion by its ID. Record: {portion IDs}."
    - uo: aseptic_filling
      block: stopper_placement_setup
      step: 1
      text: "Set the stopper placement unit as described in {form or SOP number}. Set the vacuum for placement to 60 kPa below atmospheric pressure (fictional set point, allowed band 55 to 65 kPa). Record the vacuum level set for placement and the other placement settings: {vacuum level}, {placement settings}."
    - uo: aseptic_filling
      block: sterile_filtration_inline_start
      step: 2
      text: "Take the holding bag out of cold storage only now, when the filter is assembled and tested, the filling line is set up and the steps above are signed. Record the time it leaves cold storage (the end of the hold) and the hold time. PPQ batches hold for 30 h (study point: the limit of this record is 24 h, so 30 h is planned and is not a deviation). From now on the holding bag, the surge bag and the filled syringes are out of refrigeration, in the filling room at 15 to 25 °C (fictional room range), until the filled portions are back in refrigerated storage; this time counts against the total time out of refrigeration. Record the product temperature at this moment: {cold storage end}, {hold time}, {temperature at removal}."
    - uo: aseptic_filling
      block: sterile_filtration_inline_start
      step: 1
      text: "Take sample SP-009, the bioburden sample before the sterilizing filter and the end sample of the holding-bag hold, from the holding bag through its sample-bag manifold, in the step that ends the hold: at the end of the hold and immediately before the filtration starts (the bag is still in cold storage). Purge the line first: discard the first 5 mL. Take 100 mL in a sterile bottle for bioburden (not more than 10 CFU/100 mL, every batch) and the 2 x 10 mL for the chemistry tests of the sample table of the BBR filtration section. Record the time, the volumes and the person who took it: {sampling time}, {sample volume}, {sample number}, {sampled by}."
    # The PPQ line stop (a study point), the PPQ hold to the time limit, the end samples of the filling run and the portions into storage. Later steps first.
    - uo: aseptic_filling
      block: filling_run
      step: 10
      text: "Take sample SP-013 (sample table of this section) from the last syringes filled, at the end of the filling run, and record the time and the person who took it: {sampling time}, {sampled by}. Take the stability syringes SP-016 (300 syringes) and the T0 syringes SP-017 (70 syringes) from the challenge portion, which is the last portion filled (taken at random from its tubs before the rest of that portion goes into refrigerated storage), and set them aside at room temperature ({room temperature}) in light ({light level}); do not put them into cold storage. They stay out of refrigeration for the challenge of the storage and shipping section. Their time out of refrigeration is counted from the start of filling of that portion. Record the portion and the time they were set aside: {portion ID}, {time set aside}, {sampled by}."
    - uo: aseptic_filling
      block: filling_run
      step: 9
      text: "Record the end of filling (for PPQ batches, after the filling that follows the restart in the step above), the time each portion was completed and the number of units filled: {end}, {portion ID}, {portion completed}, {units filled}."
    - uo: aseptic_filling
      block: filling_run
      step: 8
      text: "In every PPQ batch (the 60-minute line stop is a study point of this record; the routine record has no planned line stop): after sample SP-012, stop the line for 60 minutes. Keep the product in the closed surge bag in the filling room at 15 to 25 °C for the 60 minutes, as described in {form or SOP number}, and record the room temperature at the stop and at the restart: {temperature at stop}, {temperature at restart}. Restart the line, purge {restart purge volume} and take sample SP-014 (sample table of this section) from the first syringes filled after the restart, 2 x 4 syringes taken evenly from every filling head ({syringes per head} per head). The T0 of the line stop is sample SP-012 (the syringes filled just before the stop, in the middle of the filling run; not taken twice). After the line stop, and after every other intervention, restart or adjustment, check the fill weight on every filling head at a tighter frequency (every 10 minutes for the first 30 minutes, then the routine frequency of the table; assumed) before the run continues. Record the stop time, the restart time and the person who took it: {stop time}, {restart time}, {sampled by}."
      after:
        - "PPQ batches only (study point of this record): when about 1 L of bulk remains (PPQ 1 and PPQ 3), or when the planned units less about 900 syringes have been filled (PPQ 2, which is not filled to the end of the bulk, see the volume balance), stop the line and hold the surge bag in the filling room at 15 to 25 °C until 8 h have passed since the start of the sterile filtration. That is the shorter of the filtration limit and the filling time limit; filling started later, so its 8 h are not yet used up. At the end of that hold, in this step, restart the filling and take sample SP-015 (sample table of this section) from the first syringes filled from the held bulk. Do not sample the surge bag: it is on the sterile side and stays closed. The 8 h limits of the filtration and of the filling run to this restart. The filling of the last litre after the restart belongs to the study point: record it, but it is not counted against the 8 h limits. Record the time, the room temperature at the line stop and at the restart, and the person who took it: {line stop time}, {restart time}, {temperature at line stop}, {temperature at restart}, {sampling time}, {sampled by}."
    - uo: aseptic_filling
      block: filling_run
      step: 5
      text: "Check the fill. The in-line weight check runs on 100 % of the units: record the rejects, not each reading. In addition, at {check interval}, weigh {syringes per head} filled syringes from every filling head by hand and record the weights. The limits in grams are the limits of the fill volume range in the table below multiplied by the density of the formulated bulk, which is measured and not assumed: {density}, {lower weight limit}, {upper weight limit}, {check time}, {head}, {weights}."
    - uo: aseptic_filling
      block: filling_run
      step: 3
      after:
        - "Repeat this step for every portion in turn. Record the time filling of the portion starts. When the portion is complete, close its tubs, move them out of the isolator through the transfer port, put them into refrigerated storage (2 to 8 °C) at once and record the time they enter the storage and the storage unit. The time out of refrigeration of the portion counts from the start of filling of the portion to this storage time: {portion ID}, {portion start}, {tub count}, {storage start}, {storage unit ID}."
    - uo: aseptic_filling
      block: filling_run
      step: 2
      text: "Connect the sterile product path to the filling line, then prime the line and purge it with the first filtrate from the surge bag, as described in {form or SOP number}. The filtration was started in , so this step comes after it. Do not start filling before the purge is signed. Record the connection, the volume purged and the time: {connection check}, {purge volume}, {purge time}."
    # The end of the sterile filtration, the integrity test after use and the volume reconciliation.
    - uo: aseptic_filling
      block: sterile_filtration_inline_end
      step: 3
      after:
        - "Reconcile the volume of the batch: the weight of the filtrate minus the units filled x 1.1 mL, minus the volume purged to prime the line and the volume purged at the restart after the line stop, minus only the bulk samples taken after the holding bag was weighed (SP-007, SP-008 and SP-009 with their line purges, 0.175 L; the samples taken before the weighing are already out of the weighed filtrate) gives the volume left in the holding bag, the sterilizing filter and the surge bag. Compare it with the volume expected there: the hold-up of those three (holding bag 0.4 L + sterile filter and tubing 0.5 L + surge bag 0.3 L = 1.2 L) plus the spare of the volume balance (the batch size minus its total: 0.30 L for PPQ 1, 12.90 L of unfilled bulk for PPQ 2, 0.055 L for PPQ 3). If the difference is more than 0.20 L either side (fictional limit), open an investigation: {units filled}, {purge volume}, {restart purge volume}, {volume left in the line}, {difference}, {investigation number}."
    - uo: aseptic_filling
      block: sterile_filtration_inline_end
      step: 2
      text: "Run the non-destructive integrity test after use, before the filter is removed, and record the reading against the filter specification. This is the only post-use test of the filter; the filter record table copies the reading: {post-use reading}, {specification}, {post-use result}."
    - uo: aseptic_filling
      block: sterile_filtration_inline_end
      step: 1
      text: "When filling has ended, stop the sterile filtration. Record the end of the filtration, the differential pressure at the end and the filtration time against the maximum shown in the sterile filtration section. The filtration time is counted from the start of the filtration to the end of filling; for PPQ batches it is counted to the restart; the filling of the last litre after the restart is not counted: {end}, {pressure at end}, {filtration time}."
    - uo: aseptic_filling
      block: plunger_stopper_placement
      step: 1
      text: "Take 10 position check syringes (fictional number) at the start, in the middle and at the end of the filling of each portion, from the line exit before the tubs are closed (not from tubs in refrigerated storage), and record the portion and the time. Measure the stopper position from the top of the barrel flange to the back of the stopper and record each reading against the position shown in the table below: {portion ID}, {check time}, {reading}."
    # ---- Per-portion stages: the steps are repeated for each portion.
    - uo: visual_inspection
      block: visual_inspection_run
      step: 5
      text: "Apply the sampling check to the accepted units of this portion and record the result. From the 7 000 units of a portion take 315 units (fictional: general inspection level II, normal inspection; sampling table {sampling table reference}). Accept the portion if the 315 units contain no critical defect (AQL 0.065), not more than 2 major defects (AQL 0.25) and not more than 5 minor defects (AQL 0.65). Otherwise the portion does not go on to packing and a deviation is opened: {sample size}, {critical defects}, {major defects}, {minor defects}, {result}."
    - uo: visual_inspection
      block: visual_inspection_run
      step: 2
      text: "Do this step and the steps up to  for each portion in turn, with one row of the entry table for each portion. Record the time this portion leaves refrigerated storage for inspection, before it is handled: {portion ID}, {out time}."
    - uo: bulk_packaging
      block: bulk_packing
      step: 5
      text: "Check each bulk container as shown in the table below and record the result. The check of the packed bulk uses the same plan, sample size and accept numbers as the visual inspection check, applied to the containers of this portion: {sample size}, {check result}."
    - uo: bulk_packaging
      block: bulk_packing
      step: 2
      text: "Do this step and the steps up to  for each portion in turn, with one row of the entry table for each portion. Record the time this portion leaves refrigerated storage for packing, before it is handled: {portion ID}, {out time}."
    - uo: bulk_packaging
      block: reconciliation_chain
      step: 2
      text: "Calculate the reconciliation: (accepted + rejected + sampled + other loss) / filled x 100. The result is to be 100.0 % within 0.5 % either side (99.5 % to 100.5 %, fictional limit); outside it, record the investigation in the next step. Record the result: {result}."
    - uo: labeling_packaging
      block: labeling_run
      step: 3
      text: "Do this step and the steps up to  for each portion in turn, with one row of the entry table for each portion. Record the time this portion leaves refrigerated storage for labelling and packaging, before it is handled. This is the end of the packed bulk hold of the portion; record the hold time from the hold start in the bulk packaging section: {portion ID}, {out time}, {hold end}, {packed bulk hold time}."
    # ---- Storage and shipping. The challenge portion of the PPQ time out of refrigeration (a study point) is a step of this record only.
    - uo: storage_shipping
      block: time_out_of_refrigeration_total
      step: 2
      text: "Add up the recorded stage times of each portion and record the total against the critical limit shown in the table below. The total is the sum of the recorded times, never an estimate: {portion ID}, {total time}."
      after:
        - "PPQ batches only (study point of this record): keep the stability and T0 syringes (samples SP-016 and SP-017), set aside in the filling run, at room temperature in light, outside refrigerated storage, until their total time out of refrigeration, counted from the start of filling of the challenge portion they were taken from (the last portion filled), reaches 14 h. Their T0 comparison is sample SP-011 (beginning of filling of the batch); the end sample is SP-017. The limit of this record stays at 12 h for every other portion. Record the time the syringes left refrigerated storage and the time they returned: {portion ID}, {out time}, {return time}, {total time}."
    - uo: storage_shipping
      block: storage_and_shipment
      step: 4
      text: "Calculate from the temperature record the total time outside the storage temperature range (2 to 8 °C) and outside the shipping temperature range recorded in the first step of this block, and compare it with the excursion allowance shown in the table below: {excursion start}, {excursion end}, {time outside the range}, {result against the allowance}."
    - uo: storage_shipping
      block: storage_and_shipment
      step: 1
      text: "Record the location and the conditions of storage and the monitoring device. The storage temperature range is 2 to 8 °C. The shipping temperature range is not in the TRD and is entered before the record is issued: {shipping temperature range}, {location}, {conditions}, {monitor ID}."
  limits:
    # The total time out of refrigeration is the critical limit; each stage has its own target under it. The stage values are the TRD's
    # budgets for the stage (filling, inspection, bulk packing, labelling) and add up to the critical limit. The out and return times of a stage
    # include the handling before and after the work; the total is summed from the recorded times.
    - uo: storage_shipping
      limit: total_out_of_refrigeration
      targets:
        - { label: Filling (per portion), value: "6", unit: h, fromStep: { uo: aseptic_filling, block: filling_run, step: 3 }, toStep: { uo: aseptic_filling, block: filling_run, step: 4 } }
        - { label: Visual inspection (per portion), value: "3", unit: h, fromStep: { uo: visual_inspection, block: visual_inspection_run, step: 2 }, toStep: { uo: visual_inspection, block: visual_inspection_run, step: 6 } }
        - { label: Bulk packaging (per portion), value: "1", unit: h, fromStep: { uo: bulk_packaging, block: bulk_packing, step: 2 }, toStep: { uo: bulk_packaging, block: bulk_packing, step: 6 } }
        - { label: Labelling and packaging (per portion), value: "2", unit: h, fromStep: { uo: labeling_packaging, block: labeling_run, step: 3 }, toStep: { uo: labeling_packaging, block: labeling_run, step: 6 } }

# PDA TR 44 style FMEA of the sterile part of the process (fictional). Scales 1 to 10; detection is REVERSED (a high number is poor detection).
# The action threshold of 100 is the fictional team's own entry. One row (RA-005) has no "risk accepted?" answer on purpose, so the open item shows.
# Sampling point numbers are the 1-based numbers of the PPQ sampling plan above; the fill numbers match the TRD (12 interventions per batch,
# 8 h filling) and the batch record (intervention log, filter records with pre-use and post-use integrity tests).
risk:
  at: "2026-10-26T09:00:00.000Z"
  by: Alex Example (fictional)
  role: MSAT engineer
  title: SYR-305 sterile process FMEA, PDA TR 44 layout (fictional)
  scopeNote: "Risks to sterility and to product quality from thaw and pooling to stoppering at the receiving unit, scored for the transfer of SYR-305 (fictional)."
  context: Prepared by the fictional transfer team from the engineering run, the filter validation and the media fill summary. Fictional example to show the PDA TR 44 layout.
  loadout: fmea-pda-tr44
  actionThreshold: 100
  reviewTriggers: [investigation, new_risk, change_control, process_change, periodic]
  nextReview: "2027-04-15"
  reviews:
    - { date: "2026-10-12", by: Alex Example (fictional), note: "First issue, made by the transfer team before the PPQ plan was approved (fictional)." }
    - { date: "2026-10-26", trigger: new_risk, by: Alex Example (fictional), note: "Added the PUPSIT assembly row after the filter set-up review and set the action threshold (fictional)." }
  items:
    - step: ds_receipt_thaw
      points: [18, 19]
      failureMode: Thawed drug substance is held colder or warmer, or longer, than the cold hold and ambient time that were proven (fictional)
      effect: Aggregates or loss of potency in the pooled bulk
      causes: Delay after thaw, or a cold storage excursion
      controlsPrevention: Cold hold and ambient time clocks in the batch record; alarmed cold storage unit
      controlsDetection: Sample at the start and the end of the cold hold (T0 and end of hold)
      initial: { severity: 7, occurrence: 3, detection: 3 }
      accepted: "yes"
      actions: []
    - step: compounding
      points: [21]
      failureMode: Dilution error in pooling or dilution, so the formulated bulk is at the wrong concentration (fictional)
      effect: Syringes outside the protein concentration specification
      causes: Wrong buffer amount or weight, wrong pooled volume
      controlsPrevention: Buffer amounts calculated from the TRD ratios and checked by a second person; weights printed from the balance
      controlsDetection: Protein concentration and pH of the formulated bulk before filtration
      initial: { severity: 7, occurrence: 3, detection: 4 }
      accepted: "yes"
      actions: []
    - step: compounding
      points: [21]
      failureMode: Bioburden of the formulated bulk above 10 CFU/100 mL at the end of the 30 h bulk hold, so the BBR filter receives more than it was validated for (fictional)
      effect: Higher bioburden reaches the sterilizing filter; endotoxin risk
      causes: Long hold at ambient temperature, a breach of the closed system at a connection
      controlsPrevention: Closed single-use bag and sterile connectors; hold time limit in the batch record
      controlsDetection: Bioburden sample at the end of the hold; the result is known only after filtration has started
      initial: { severity: 8, occurrence: 3, detection: 6 }
      residual: { severity: 8, occurrence: 2, detection: 6 }
      accepted: "yes"
      actions:
        - { text: "Add a bioburden alert limit with trend review after each batch and a rule to stop the hold at the qualified maximum (fictional)", owner: Example Fill Site QA (fictional), due: "2026-12-01", status: in_progress }
    - step: bbr_filtration
      points: [7]
      failureMode: BBR filter fails the integrity test after use (fictional)
      effect: Filtrate may not be bioburden-reduced; batch put on hold
      causes: Damaged membrane, wrong wetting, wrong test set-up
      controlsPrevention: Filter ID and lot in the filter records; wetting as written in the batch record
      controlsDetection: Integrity test before use and after use, recorded in the filter records
      initial: { severity: 8, occurrence: 2, detection: 3 }
      accepted: "yes"
      actions: []
    - step: bbr_filtration
      failureMode: Filtration paused with product on the filter for much longer than the 24 h that was studied (fictional)
      effect: Protein loss on the membrane; extractables in the filtrate
      causes: Line failure or a staffing gap during the pause
      controlsPrevention: Maximum filter contact time in the batch record; escalation to the production lead
      controlsDetection: Start and end times recorded; filtrate protein concentration
      initial: { severity: 6, occurrence: 3, detection: 4 }
      actions: []
    - step: sterile_filtration
      points: [9]
      failureMode: Sterilizing filter fails the integrity test after use (fictional)
      effect: Loss of sterility assurance for the whole batch
      causes: Damaged or wrongly installed membrane
      controlsPrevention: Pre-use post-sterilization integrity test (PUPSIT); filter lot checked against the TRD
      controlsDetection: Non-destructive integrity test after use, before the filter is removed
      initial: { severity: 10, occurrence: 2, detection: 2 }
      accepted: "yes"
      actions: []
    - step: sterile_filtration
      failureMode: Contamination is introduced when the PUPSIT is assembled and its vent filter and drain bag are closed again (fictional)
      effect: Loss of sterility of the filtrate side
      causes: Open manipulation of a connection after the test, an unconnected vent
      controlsPrevention: Closed vent filter and drain bag kit; connections made with sterile connectors in grade A
      controlsDetection: Visual check of the closed kit; media fill covers the set-up
      initial: { severity: 10, occurrence: 4, detection: 5 }
      residual: { severity: 10, occurrence: 2, detection: 5 }
      accepted: "yes"
      actions:
        - { text: "Replace the loose vent filter and drain bag by a pre-assembled single-use test kit and include the set-up in the next media fill (fictional)", owner: Alex Example (fictional), due: "2026-11-20", status: open }
    - step: aseptic_filling
      failureMode: "Inherent intervention: pulling filled syringes for samples at the line exit (about 5 times per batch, less than once an hour) (fictional)"
      effect: Loss of sterility of the filled syringes
      causes: Hands or tools in the isolator at the line exit, airflow disturbed near open syringes
      controlsPrevention: Only the interventions on the qualified list; sample removal with the isolator gloves and a defined tool
      controlsDetection: Environmental monitoring of the isolator; the intervention is part of the media fill
      initial: { severity: 10, occurrence: 5, detection: 4 }
      residual: { severity: 10, occurrence: 3, detection: 3 }
      accepted: "yes"
      intervention: { complexity: medium, duration: low, proximity: high, frequency: medium, airflow: medium, level: medium }
      actions:
        - { text: "Move the sample removal to a closed sample-take-off at the line exit and simulate it in the media fill (fictional)", owner: Example Fill Site QA (fictional), due: "2027-01-31", status: open }
    - step: aseptic_filling
      failureMode: "Corrective intervention: filling head, needle or stopper feeder adjustment, line stop and restart (a few per batch; the TRD allows 12 interventions in total) (fictional)"
      effect: Loss of sterility of the filled syringes
      causes: Jam of syringes or stoppers, a needle not aligned
      controlsPrevention: Qualified intervention list with a procedure and training; set-up checks before the run
      controlsDetection: Intervention log in the batch record; environmental monitoring after the intervention
      initial: { severity: 10, occurrence: 6, detection: 5 }
      residual: { severity: 10, occurrence: 4, detection: 4 }
      accepted: "no"
      intervention: { complexity: high, duration: high, proximity: high, frequency: low, airflow: high, level: high }
      actions:
        - { text: "Run the adjustment and restart in the media fill at the highest number of interventions of a batch (fictional)", owner: Example Fill Site QA (fictional), due: "2027-01-31", status: open }
        - { text: "Add a feeder jam alarm so that the line stops before the operator has to reach in (fictional)", owner: Example Fill Site Engineering (fictional), due: "2027-03-15", status: open }
    - step: aseptic_filling
      points: [16]
      failureMode: Stopper or plunger placed outside the 6.2 to 6.8 mm position, so the closure does not seal (fictional)
      effect: Loss of container closure integrity over shelf life
      causes: Stopper placement unit out of adjustment after a line stop
      controlsPrevention: Position range in the batch record; set-up check after each restart
      controlsDetection: Position check on samples; container closure integrity test on PPQ and stability units
      initial: { severity: 9, occurrence: 3, detection: 3 }
      accepted: "yes"
      actions: []
