  - { q: comp.mixer_qual, side: source, value: pq_complete }
  - { q: comp.mixer_qual, side: target, value: pq_complete }                                                     # equivalent
  - { q: comp.mixer_range, side: target, value: { min: { value: 100, unit: rpm }, max: { value: 200, unit: rpm } } }
  - { q: comp.procedures, side: target, value: update_required }

  # ---------------------------------------------------------------- BBR filtration
  # Both sites use a BBR filter. The RU filter has a different part number, so the validation coverage question appears.
  - { q: bbr.presence, side: source, value: yes }
  - { q: bbr.presence, side: target, value: yes }
  - { q: bbr.membrane, side: source, value: pes }
  - { q: bbr.membrane, side: target, same: true }
  - { q: bbr.pore, side: source, value: "0.45" }
