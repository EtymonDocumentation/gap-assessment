  # is the difference. Questions of the other routes stay hidden on the side that does not use them.
  - { q: buf.presence, side: source, value: yes }
  - { q: buf.presence, side: target, value: yes }
  - { q: buf.route, side: source, value: prepared_on_site }
  - { q: buf.route, side: target, value: received_rtu }              # different supply route (high)
  - { q: buf.dispensing, side: source, value: automated_dispensing }
  - { q: buf.vessel_type, side: source, value: single_use_bag }
  - { q: buf.vessel_capacity, side: source, value: { value: 500, unit: L } }
  - q: buf.batch_volume
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: non_critical
      setPoint: { value: 400, unit: L }
      par: { min: { value: 300, unit: L }, max: { value: 500, unit: L } }
      rangeBasis: development_report
  - { q: buf.mixer, side: source, value: single_use_impeller }
  - q: buf.mixing_speed
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: non_critical
      setPoint: { value: 80, unit: rpm }
      nor: { min: { value: 60, unit: rpm }, max: { value: 100, unit: rpm } }
      par: { min: { value: 40, unit: rpm }, max: { value: 120, unit: rpm } }
      rangeBasis: development_report
  - q: buf.mixing_time
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: non_critical
      setPoint: { value: 45, unit: min }
      nor: { min: { value: 40, unit: min }, max: { value: 50, unit: min } }
      par: { min: { value: 30, unit: min }, max: { value: 60, unit: min } }
      rangeBasis: development_report
  - { q: buf.ipc, side: source, value: [ph, conductivity, bioburden] }
  - { q: buf.hold_time, side: source, value: { value: 48, unit: h } }
  - { q: buf.supplier, side: target, value: Buffer Supplier C (fictional) }
  - { q: buf.storage, side: target, value: refrigerated }
  - { q: buf.shelf_life, side: target, value: { value: 30, unit: d } }
  - { q: buf.bbr_filtered, side: source, value: yes }
  - { q: buf.bbr_filtered, side: target, value: no }                  # removed element: the RU does not BBR filter the buffer
  - { q: buf.bbr_membrane, side: source, value: pes }
  - { q: buf.bbr_pore, side: source, value: "0.2" }
  - { q: buf.bbr_bioburden, side: source, value: { value: 10, unit: CFU/100 mL } }
  - { q: buf.bbr_integrity, side: source, value: pre_and_post_use }
  # milestone 3: supplier qualification and equipment qualification
  - { q: buf.supplier_qual, side: target, value: in_progress }        # outside: supplier qualification not complete
  - { q: buf.vessel_qual, side: source, value: pq_complete }
  - { q: buf.mixer_qual, side: source, value: pq_complete }
  - { q: buf.procedures, side: target, value: new_required }

  # ---------------------------------------------------------------- compounding
  - { q: comp.presence, side: source, value: yes }
  - { q: comp.presence, side: target, value: yes }
  - q: comp.batch_size                                               # scale change 60 L -> 150 L
    side: source
    docs: [DEMO-PPQ-217-01]
    fields:
      setPoint: { value: 60, unit: L }
      par: { min: { value: 40, unit: L }, max: { value: 60, unit: L } }
      rangeBasis: PPQ
  - q: comp.batch_size
    side: target
    fields:
      setPoint: { value: 150, unit: L }
      nor: { min: { value: 120, unit: L }, max: { value: 150, unit: L } }
  - { q: comp.mixing_coverage, side: source, value: { min: { value: 20, unit: L }, max: { value: 80, unit: L } }, docs: [DEMO-MIX-217-03] }   # outside
  - { q: comp.hold_time, side: source, value: { value: 24, unit: h }, docs: [DEMO-HT-217-02] }
  - { q: comp.hold_time, side: target, value: { value: 36, unit: h } }                                           # outside
  - { q: comp.hold_cov, side: target, value: { value: 24, unit: h }, docs: [DEMO-HT-217-02] }                    # milestone 3: hold study covers 24 h only (outside)
  - { q: comp.hold_basis, side: target, value: partial_study }                                                   # milestone 3: microbial endpoint only
  - { q: comp.vessel_type, side: source, value: stainless_tank }
  - { q: comp.vessel_type, side: target, value: single_use_bag }
  - { q: comp.vessel_capacity, side: source, value: { value: 100, unit: L } }
  - { q: comp.vessel_capacity, side: target, value: { value: 200, unit: L } }
  - { q: comp.mixer, side: source, value: top_entry_impeller }
  - { q: comp.mixer, side: target, value: single_use_impeller }
  - { q: comp.mixing_demonstrated, side: target, value: planned }
  - q: comp.mixing_speed                                             # within validated range
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: KPP
      setPoint: { value: 150, unit: rpm }
      nor: { min: { value: 120, unit: rpm }, max: { value: 180, unit: rpm } }
      par: { min: { value: 100, unit: rpm }, max: { value: 200, unit: rpm } }
      rangeBasis: characterization
  - q: comp.mixing_speed
    side: target
    fields:
      setPoint: { value: 140, unit: rpm }
      nor: { min: { value: 110, unit: rpm }, max: { value: 170, unit: rpm } }
  - q: comp.mixing_time
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: KPP
      setPoint: { value: 30, unit: min }
      nor: { min: { value: 25, unit: min }, max: { value: 35, unit: min } }
      par: { min: { value: 20, unit: min }, max: { value: 45, unit: min } }
      rangeBasis: characterization
  - { q: comp.mixing_time, side: target, same: true }
  - q: comp.temperature
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: non_critical
      setPoint: { value: 20, unit: "°C" }
      nor: { min: { value: 18, unit: "°C" }, max: { value: 22, unit: "°C" } }
      par: { min: { value: 15, unit: "°C" }, max: { value: 25, unit: "°C" } }
      rangeBasis: development_report
  - q: comp.temperature
    side: target
    fields:
      setPoint: { value: 20, unit: "°C" }
      nor: { min: { value: 18, unit: "°C" }, max: { value: 22, unit: "°C" } }
  - { q: comp.ipc, side: source, value: [bioburden, ph, osmolality, protein_concentration] }
  - { q: comp.ipc, side: target, same: true }
  # dilution questions (shown because dilution = yes)
  - { q: comp.diluent, side: source, value: Formulation buffer FB-1 (fictional) }
  - { q: comp.diluent, side: target, same: true }
  - { q: comp.diluent_volume, side: source, value: { value: 30, unit: L } }
  - { q: comp.diluent_volume, side: target, value: { value: 75, unit: L } }       # scale change with the larger RU batch
  - q: comp.target_conc
    side: source
    docs: [DEMO-CPV-217-01]
    fields:
      classification: KPP
      setPoint: { value: 50, unit: mg/mL }
      nor: { min: { value: 48, unit: mg/mL }, max: { value: 52, unit: mg/mL } }
      par: { min: { value: 45, unit: mg/mL }, max: { value: 55, unit: mg/mL } }
      rangeBasis: PPQ
  - q: comp.target_conc
    side: target
    fields:
      setPoint: { value: 50, unit: mg/mL }
      nor: { min: { value: 48, unit: mg/mL }, max: { value: 52, unit: mg/mL } }
  # milestone 3: equipment qualification (cleaning questions stay hidden: the target vessel is single-use)
