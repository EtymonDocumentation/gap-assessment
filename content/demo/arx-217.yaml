  - { q: filt.pupsit, side: source, value: performed }
  - { q: filt.pupsit, side: target, value: not_performed_unjustified }
  - { q: filt.pupsit_method, side: source, value: bubble_point }
  - { q: filt.pupsit_fluid, side: source, value: wfi }
  - { q: filt.pupsit_downstream, side: source, value: closed_assembly }
  - { q: filt.bioburden_limit, side: source, value: { value: 10, unit: CFU/100 mL } }
  - { q: filt.bioburden_limit, side: target, value: { value: 10, unit: CFU/100 mL } }
  - { q: filt.integrity_method, side: source, value: bubble_point }
  - { q: filt.integrity_method, side: target, same: true }
  - { q: filt.tester_qual, side: source, value: pq_complete }
  - { q: filt.tester_qual, side: target, value: pq_complete }
  - { q: filt.procedures, side: target, value: update_required }

  # ---------------------------------------------------------------- aseptic filling
  - { q: fill.presence, side: source, value: yes }
  - { q: fill.presence, side: target, value: yes }
  - { q: fill.pump, side: source, value: rotary_piston }
