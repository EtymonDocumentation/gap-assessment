  - { q: fill.ppq_strategy, side: target, value: reduced_bridging }
  - { q: fill.ppq_batches, side: target, value: { value: 3, unit: count } }
  - { q: fill.aps_runs, side: source, value: { value: 2, unit: count }, docs: [DEMO-APS-S4-26] }
  - { q: fill.aps_runs, side: target, value: { value: 3, unit: count } }                                         # within (more initial runs planned)
  - { q: fill.aps_interventions, side: source, value: { value: 12, unit: count } }
  - { q: fill.aps_interventions, side: target, value: { value: 16, unit: count } }                               # outside
  - { q: fill.aps_scope, side: target, value: bridging_required }
  - { q: fill.filtered_hold, side: source, value: { value: 12, unit: h }, docs: [DEMO-HT-217-02] }
  - { q: fill.filtered_hold, side: target, value: { value: 18, unit: h } }                                       # outside
  - { q: fill.filtered_hold_cov, side: target, value: { value: 12, unit: h }, docs: [DEMO-HT-217-02] }           # outside coverage
  - { q: fill.bulk_vessel, side: source, value: stainless_tank }
