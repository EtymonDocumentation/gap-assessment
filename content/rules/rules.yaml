    title: Capping environment
    match: [uo.capping.equip.capper.type]
    comparator: enum
    severity: medium
    why: The protection of stoppered, uncrimped vials is part of the contamination control strategy.
    activities: [risk_assessment_update, environmental_monitoring_assessment, procedure_update]

  # ------------------------------------------------------------------ materials and components
  - id: R-SUA-SUPPLIER
    version: 1.0.0
    title: Single-use assembly supplier (informational)
    match: [uo.sterile_filtration.mat.sua.supplier]
    comparator: informational
    severity: none
    why: Recorded for the E&L assessment; the presence comparison and E&L question carry the gap.

  - id: R-SUA-PRESENCE
    version: 1.0.0
    title: Single-use filtration assembly
    match: [uo.sterile_filtration.mat.sua.present]
    comparator: presence
    severity: medium
    regulatory: true
    why: A single-use assembly introduces new product-contact polymers and connections that require E&L and compatibility assessment.
    activities: [extractables_leachables, filter_compatibility, procedure_update, training]
    outcomes:
      removed_element:
        why: Replacing a single-use assembly with reusable equipment introduces cleaning and sterilization requirements.
        activities: [equipment_qualification, procedure_update, training]

  - id: R-FILTER-TRAIN
    version: 1.0.0
    title: Filtration train element
    match: [uo.sterile_filtration.mat.*.present]
    comparator: presence
    severity: high
    regulatory: true
    why: The filtration train is part of the {{validated|current}} sterilization design; adding or removing a filter changes it.
    activities: [filter_bacterial_retention, risk_assessment_update, procedure_update]

  - id: R-FILTER-DESIGN
    version: 1.0.0
    title: Sterilizing filter design
    match:
      - uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction
      - uo.sterile_filtration.mat.sterilizing_filter.poreRating
      - uo.sterile_filtration.mat.sterilizing_filter.supplier
      - uo.sterile_filtration.mat.sterilizing_filter.partNumber
    comparator: text
    severity: high
    regulatory: true
    why: Sterilizing filter validation (bacterial retention, compatibility, extractables) is specific to the membrane and device.
    activities: [filter_bacterial_retention, filter_compatibility, extractables_leachables, procedure_update]

  - id: R-CONTAINER-FORMAT
    version: 1.0.0
    title: Primary container format
    match: [uo.aseptic_filling.mat.container.format]
    comparator: enum
    severity: high
    regulatory: true
    why: The container format is part of the registered presentation and of the {{validated|current}} filling, stoppering and CCI configuration.
    activities: [cci_study, equipment_qualification, media_fill, ppq]

  - id: R-COMPONENT
    version: 1.0.0
    title: Primary packaging component
    match: [uo.*.mat.*.supplier, uo.*.mat.*.partNumber]
    comparator: text
    severity: medium
    regulatory: true
    why: A different component supplier or part can change dimensions and materials, affecting machinability, CCI and E&L.
    activities: [cci_study, extractables_leachables, engineering_run]

  # ------------------------------------------------------------------ in-process controls
  - id: R-INTEGRITY-TESTS
    version: 1.0.0
    title: Filter integrity testing
    match: [uo.sterile_filtration.ipc.integrity.tests]
    comparator: set
    severity: high
    regulatory: true
    why: Filter integrity testing confirms the sterilizing filter performed as {{validated|intended}}. Removing a test requires a documented risk assessment against EU GMP Annex 1 and other applicable expectations.
    activities: [risk_assessment_update, procedure_update, training]
    outcomes:
      new_requirement:
        severity: low
        regulatory: false
        why: An additional integrity test strengthens the control strategy; procedures and training are needed.
        activities: [procedure_update, training]

  - id: R-IPC-SET
    version: 1.0.0
    title: In-process control panel
    match: [uo.*.ipc.*.tests]
    comparator: set
    severity: medium
    regulatory: true
    why: Removing an in-process control changes the control strategy demonstrated in validation.
    activities: [risk_assessment_update, procedure_update, training]
    outcomes:
      new_requirement:
        severity: low
        regulatory: false
        why: An additional in-process control requires a method, procedure and training at the RU.
        activities: [procedure_update, training]

  - id: R-IPC-FREQ
    version: 1.0.0
    title: In-process control approach
    match: [uo.*.ipc.*.frequency]
    comparator: enum
    severity: medium
    why: A different in-process control approach changes sampling, alarm handling and batch record content.
    activities: [equipment_qualification, procedure_update, training]

  # ------------------------------------------------------------------ evidence (target-side follow-ups)
  - id: R-EV-MIXING
    version: 1.0.0
    title: Mixing effectiveness at RU
    match: [uo.compounding.study.mixing.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    why: Homogeneity has not been demonstrated for the RU mixing configuration.
    activities: [mixing_study]

  - id: R-EV-BRET
    version: 1.0.0
    title: Bacterial retention validation for RU filter
    match: [uo.sterile_filtration.study.bacterial_retention.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: Sterilizing filtration is not validated for the RU filter with this product until bacterial retention is demonstrated.
    activities: [filter_bacterial_retention]

  - id: R-EV-COMPAT
    version: 1.0.0
    title: Filter compatibility for RU filter
    match: [uo.sterile_filtration.study.filter_compatibility.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: medium
    why: Chemical compatibility of the RU filter with the formulation is not established.
    activities: [filter_compatibility]

  - id: R-EV-EXTRACTABLES
    version: 1.0.0
    title: Extractables data for RU filter
    match: [uo.sterile_filtration.study.filter_extractables.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Extractables data for the RU filter are needed for the product leachables assessment.
    activities: [extractables_leachables]

  - id: R-EV-SIZING
    version: 1.0.0
    title: Filter sizing for RU batch volume
    match: [uo.sterile_filtration.study.filter_sizing.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Filter capacity for the RU batch volume has not been confirmed.
    activities: [filter_sizing]

  - id: R-EV-SUA-EL
    version: 1.0.0
    title: E&L assessment for RU single-use assembly
    match: [uo.sterile_filtration.study.sua_el.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Leachables from new product-contact polymers have not been assessed for this product.
    activities: [extractables_leachables]

  - id: R-EV-FILL-ACCURACY
    version: 1.0.0
    title: Fill accuracy of RU pump
    match: [uo.aseptic_filling.study.fill_accuracy.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    why: Fill accuracy and precision of the RU pump with this product have not been demonstrated.
    activities: [fill_accuracy_study, engineering_run]

  - id: R-EV-PUMP-IMPACT
    version: 1.0.0
    title: Product-quality impact of RU pump
    match: [uo.aseptic_filling.study.pump_product_impact.status]
    comparator: evidence
    config:
      map: { no_impact: within_validated_range, impact: outside_validated_range, not_assessed: outside_validated_range }
    severity: high
    regulatory: true
    why: The effect of the RU pump on product quality (shear, particles, aggregation) is not established.
    activities: [product_quality_impact, comparability_assessment]

  - id: R-EV-PPQ
    version: 1.0.0
    title: PPQ coverage of RU filling principle
    match: [uo.aseptic_filling.study.ppq.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: Existing PPQ does not demonstrate the process with the RU filling principle.
    activities: [ppq]

  - id: R-EV-CCI
    version: 1.0.0
    title: CCI for RU configuration
    match: [uo.capping.study.cci.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Container closure integrity has not been demonstrated for the RU container-closure system and capping process.
    activities: [cci_study]

  - id: R-EV-RSF
    version: 1.0.0
    title: RSF–CCI correlation at RU
    match: [uo.capping.study.rsf_cci_correlation.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: The RSF range has not been correlated with CCI on the RU capping equipment.
    activities: [rsf_study]

  # ------------------------------------------------------------------ procedures
  - id: R-PROCEDURES
    version: 1.1.0
    title: RU procedures
    match: [uo.*.doc.procedures.status]
    comparator: evidence
    config:
      # Updating an existing procedure is an action to complete, not a change of operating principle.
      map: { in_place: equivalent, update_required: new_requirement, new_required: new_requirement }
    severity: low
    why: Procedures and batch record instructions must reflect the RU process before GMP manufacture.
    activities: [procedure_update, training]

  # ================================================================== milestone 3: validation studies and equipment qualification
  # Each rule links a gap to the validation activity it implies. They sit ahead of the generic
  # fallbacks so the first match is the specific one.

  # ---- process performance qualification
  - id: R-PPQ-STRATEGY
    version: 1.0.0
    title: PPQ approach at RU
    match: [uo.aseptic_filling.study.ppq.strategy]
    comparator: evidence
    config:
      map: { full_ppq: new_requirement, reduced_bridging: outside_validated_range, source_data_leveraged: within_validated_range }
    severity: high
    why: The PPQ approach decides what is demonstrated at the RU. New batches are needed for a full PPQ; a bridging approach needs a justified gap analysis; leveraging SU data needs a documented rationale that the SU PPQ covers the RU conditions.
    activities: [ppq, ppq_coverage_assessment, risk_assessment_update]
    outcomes:
      within_validated_range:
        why: SU PPQ data are judged to cover the RU. The coverage rationale must be documented and approved.
        activities: [ppq_coverage_assessment]

  - id: R-PPQ-BATCHES
    version: 1.0.0
    title: Planned PPQ batches (informational)
    match: [uo.aseptic_filling.study.ppq.batches]
    comparator: informational
    severity: none
    why: Recorded to size the validation plan; the PPQ approach question carries the gap.

  # ---- aseptic process simulation
  - id: R-APS-INITIAL-RUNS
    version: 1.0.0
    title: APS initial runs
    match: [uo.aseptic_filling.study.aps.initialRuns]
    comparator: lower_limit
    severity: medium
    why: Initial qualification of an aseptic line is shown by several consecutive successful simulations. Fewer runs at the RU than in the SU programme weaken that demonstration.
    activities: [media_fill, risk_assessment_update]

  - id: R-APS-INTERVENTIONS
    version: 1.0.0
    title: Maximum interventions per batch (simulation worst case)
    match: [uo.aseptic_filling.param.max_interventions.max]
    comparator: upper_limit
    severity: medium
    why: The simulation must include the worst-case interventions allowed in routine manufacture. More allowed interventions at the RU than were simulated at the SU are not covered.
    activities: [media_fill, risk_assessment_update, procedure_update]

  - id: R-EV-APS-SCOPE
    version: 1.0.0
    title: APS coverage of RU container, closure and filling principle
    match: [uo.aseptic_filling.study.aps.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: The simulation is valid for the line, container and closure configuration it represents. The RU configuration is not demonstrated until a simulation covers it.
    activities: [media_fill]

  # ---- hold times
  - id: R-FILTERED-HOLD
    version: 1.0.0
    title: Filtered bulk hold time (maximum)
    match: [uo.aseptic_filling.param.max_filtered_hold.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: Holding the sterile bulk longer than the {{validated|demonstrated}} time is not supported by the chemical, physical and microbial hold data.
    activities: [hold_time_study, risk_assessment_update]
    outcomes:
      within_validated_range:
        why: The planned maximum filtered bulk hold is within the {{validated|demonstrated}} hold time.

  - id: R-HOLD-COVERAGE-BULK
    version: 1.0.0
    title: Hold study coverage of formulated bulk hold
    match: [uo.compounding.study.hold_time.coverage]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.compounding.param.max_hold_time.max }
    severity: high
    why: Hold-time data cover only the durations studied. The longest planned bulk hold must fall within that coverage.
    activities: [hold_time_study]

  - id: R-HOLD-COVERAGE-FILTERED
    version: 1.0.0
    title: Hold study coverage of filtered bulk hold
    match: [uo.aseptic_filling.study.filtered_hold.coverage]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.aseptic_filling.param.max_filtered_hold.max }
    severity: high
    why: Hold-time data cover only the durations studied. The longest planned filtered bulk hold must fall within that coverage.
    activities: [hold_time_study]

  - id: R-EV-HOLD-BASIS
    version: 1.0.0
    title: Endpoints of the bulk or buffer hold time study
    match: [uo.compounding.study.hold_time.basis, uo.buffer_prep.study.hold_time.basis]
    comparator: evidence
    config:
      map: { full_study: within_validated_range, partial_study: outside_validated_range, extrapolated: outside_validated_range, none: outside_validated_range }
    severity: high
    why: A hold time claim needs chemical, physical and microbial evidence. Missing endpoints leave part of the claim unsupported.
    activities: [hold_time_study, scientific_justification]

  # ---- extractables and leachables
  - id: R-EL-DATA-SOURCE
    version: 1.0.0
    title: Source of extractables data
    match: [uo.*.study.*.dataSource]
    comparator: evidence
    config:
      map: { product_specific_study: within_validated_range, supplier_data: outside_validated_range, none: outside_validated_range }
    severity: high
    regulatory: true
    why: Supplier data alone do not reflect the product formulation, temperature and contact time. A product-specific assessment or study is needed before the leachables risk can be closed.
    activities: [extractables_leachables, risk_assessment_update]

  - id: R-EL-RISK
    version: 1.0.0
    title: Leachables risk assessment outcome
    match: [uo.*.study.*.riskOutcome]
    comparator: evidence
    config:
      map: { below_threshold: within_validated_range, above_threshold: outside_validated_range, not_assessed: outside_validated_range }
    severity: high
    regulatory: true
    why: The leachables risk is closed only when the toxicological assessment shows worst-case levels below the safety threshold for the route of administration.
    activities: [extractables_leachables, risk_assessment_update]

  - id: R-EV-CONTAINER-EL
    version: 1.0.0
    title: Container closure E&L data for RU components
    match: [uo.aseptic_filling.study.container_el.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Extractables and leachables from the RU glass, stopper and coatings have not been assessed for this product over shelf life.
    activities: [extractables_leachables, stability_assessment]

  # ---- cleaning
  - id: R-BULK-VESSEL-TYPE
    version: 1.0.0
    title: Sterile bulk holding vessel type
    match: [uo.aseptic_filling.equip.bulk_vessel.type]
    comparator: enum
    severity: medium
    regulatory: true
    why: A different holding vessel type changes product-contact materials and moves the cleaning or single-use E&L burden. Hold time data collected in the SU vessel do not carry over.
    activities: [extractables_leachables, cleaning_validation, hold_time_study, equipment_qualification, risk_assessment_update]

  - id: R-EV-CLEANING
    version: 1.0.0
    title: Cleaning validation of RU reusable equipment
    match: [uo.*.study.cleaning.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    why: Reusable product-contact equipment at the RU must be shown to be cleaned to acceptable residue and microbial limits for this product.
    activities: [cleaning_validation]

  - id: R-CLEAN-WORST-CASE
    version: 1.0.0
    title: Cleaning worst-case approach
    match: [uo.*.study.cleaning.worstCase]
    comparator: evidence
    config:
      map: { matrix_worst_case: within_validated_range, dedicated_product: within_validated_range, not_defined: outside_validated_range }
    severity: medium
    why: Cleaning validation is meaningful only at a defined worst-case soil and location.
    activities: [cleaning_validation, scientific_justification]

  - id: R-CLEAN-CARRYOVER
    version: 1.0.0
    title: Cleaning carryover limits
    match: [uo.*.study.cleaning.carryover]
    comparator: evidence
    config:
      map: { health_based_limits: within_validated_range, visual_rinse_only: outside_validated_range, not_established: outside_validated_range }
    severity: high
    why: Carryover limits must be scientifically justified; visual and rinse criteria alone do not demonstrate that residues are acceptable.
    activities: [cleaning_validation, scientific_justification]

  # ---- filter validation
  - id: R-EV-BRET-CONDITIONS
    version: 1.0.0
    title: Bacterial retention test conditions cover RU worst case
    match: [uo.sterile_filtration.study.bacterial_retention.conditions]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: Bacterial retention is valid only for the pressure, temperature, flow and time tested. More demanding RU conditions are not demonstrated by the existing study.
    activities: [filter_bacterial_retention]

  - id: R-INTEGRITY-METHOD
    version: 1.0.0
    title: Filter integrity test method
    match: [uo.sterile_filtration.ipc.integrity.method]
    comparator: enum
    severity: medium
    why: Integrity test methods work on different principles and have their own specifications and wetting fluids. A different method needs its own validated specification and procedure.
    activities: [filter_integrity_validation, equipment_qualification, procedure_update, training]

  - id: R-EV-INTEGRITY-VALIDATION
    version: 1.0.0
    title: Product-wet integrity specification for RU filter
    match: [uo.sterile_filtration.study.integrity_validation.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: medium
    why: The product-wet integrity limit must be established for the RU filter and method before the test can release filtered bulk.
    activities: [filter_integrity_validation]

  # ---- container closure integrity
  - id: R-CCI-METHOD
    version: 1.0.0
    title: CCI test method
    match: [uo.capping.study.cci.method]
    comparator: enum
    severity: high
    regulatory: true
    why: Deterministic and probabilistic CCI methods detect leaks by different principles with different sensitivity. A different method is a change in principle and needs its own validation.
    activities: [cci_method_validation, cci_study, procedure_update, training]

  - id: R-CCI-SENSITIVITY
    version: 1.0.0
    title: CCI method detection limit
    match: [uo.capping.study.cci.sensitivity]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: A larger smallest detectable leak means the RU method is less sensitive than the {{validated|SU}} one, so it does not support the same integrity claim.
    activities: [cci_method_validation, cci_study, scientific_justification]

  - id: R-EV-CCI-METHOD-VALIDATION
    version: 1.0.0
    title: Validation of RU CCI method
    match: [uo.capping.study.cci_method_validation.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    why: Results of a CCI method support the integrity claim only when the method is shown fit for purpose with this container and closure.
    activities: [cci_method_validation]

  - id: R-EV-CCI-LIFECYCLE
    version: 1.0.0
    title: CCI over shelf life and distribution
    match: [uo.capping.study.cci.lifecycle]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Integrity at release does not show that the seal is kept through storage and transport. Shelf-life and distribution stress data are needed for the RU configuration.
    activities: [cci_study, stability_assessment]

  # ---- shipping validation
  - id: R-SHIP-MODES
    version: 1.0.0
    title: Lane transport modes
    match: [uo.storage_shipping.doc.shipping_lane.modes]
    comparator: set
    severity: medium
    why: Each transport mode adds its own temperature, vibration and handling exposure that the shipping qualification must represent.
    activities: [shipping_validation, risk_assessment_update]
    outcomes:
      removed_element:
        why: A transport mode used at the SU is not used at the RU. Confirm the qualification still covers the remaining modes.
        activities: [risk_assessment_update]

  - id: R-SHIP-SCOPE
    version: 1.0.0
    title: Shipping qualification scope
    match: [uo.storage_shipping.study.shipping_validation.scope]
    comparator: evidence
    config:
      map: { lane_performance_qualified: within_validated_range, operational_only: outside_validated_range, desk_based: outside_validated_range, none: outside_validated_range }
    severity: high
    why: Thermal chamber testing or a desk assessment alone does not show performance on the actual lane.
    activities: [shipping_validation]

  - id: R-SHIP-PROFILES
    version: 1.0.0
    title: Shipping seasonal profiles
    match: [uo.storage_shipping.study.shipping_validation.profiles]
    comparator: evidence
    config:
      map: { summer_and_winter: within_validated_range, single_season: outside_validated_range, not_defined: outside_validated_range }
    severity: medium
    why: Summer and winter ambient extremes set the worst-case thermal load; a qualification that covers one season does not cover the other.
    activities: [shipping_validation]

  # ---- equipment qualification
  - id: R-EQ-STATUS
    version: 1.0.0
    title: Equipment qualification status
    match: [uo.*.equip.*.qualificationStatus]
    comparator: enum
    config:
      differentAs: new_requirement
    severity: medium
    why: Equipment must be qualified for its intended use before GMP manufacture. An RU qualification status that differs from the SU (not qualified, planned or at an earlier stage) is a qualification requirement for the transfer.
    activities: [equipment_qualification, risk_assessment_update]

  - id: R-EQ-RANGE-FILLER-SPEED
    version: 1.0.0
    title: Filler qualified speed range
    match: [uo.aseptic_filling.equip.filler.qualifiedRange_speed]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.aseptic_filling.param.line_speed }
    severity: high
    why: Operational qualification supports only the speed range tested. A planned line speed outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-FILLER-VOLUME
    version: 1.0.0
    title: Filler qualified volume range
    match: [uo.aseptic_filling.equip.filler.qualifiedRange_volume]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.aseptic_filling.param.fill_volume }
    severity: high
    why: Dosing accuracy is qualified over a stated volume range. A planned fill volume outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-VESSEL
    version: 1.0.0
    title: Compounding vessel qualified working volume
    match: [uo.compounding.equip.vessel.qualifiedRange]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.compounding.param.batch_size }
    severity: medium
    why: Vessel qualification supports only the working volume range tested. A planned batch volume outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-MIXER
    version: 1.0.0
    title: Mixer qualified speed range
    match: [uo.compounding.equip.mixer.qualifiedRange]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.compounding.param.mixing_speed }
    severity: medium
    why: Mixer qualification supports only the speed range tested. A planned mixing speed outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-THAW
    version: 1.0.0
    title: Thaw system qualified temperature range
    match: [uo.ds_receipt_thaw.equip.thaw_unit.qualifiedRange]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.ds_receipt_thaw.param.thaw_temperature }
    severity: medium
    why: Thaw system qualification supports only the temperature range tested. A planned thaw temperature outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-LYO-SHELF
    version: 1.0.0
    title: Lyophilizer qualified shelf temperature range
    match: [uo.lyophilization.equip.lyophilizer.qualifiedRange_shelf_temp]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.lyophilization.param.primary_shelf_temp }
    severity: high
    why: Shelf temperature uniformity is qualified over a stated range. A planned shelf temperature outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-LYO-PRESSURE
    version: 1.0.0
    title: Lyophilizer qualified pressure range
    match: [uo.lyophilization.equip.lyophilizer.qualifiedRange_pressure]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.lyophilization.param.primary_pressure }
    severity: high
    why: Chamber pressure control is qualified over a stated range. A planned drying pressure outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-INSPECTION
    version: 1.0.0
    title: Inspection equipment qualified rate range
    match: [uo.visual_inspection.equip.inspection.qualifiedRange]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.visual_inspection.param.inspection_rate }
    severity: medium
    why: Detection performance is qualified at a stated inspection rate. A planned rate outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-LABELER
    version: 1.0.0
    title: Labeler qualified speed range
    match: [uo.labeling_packaging.equip.labeler.qualifiedRange]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.labeling_packaging.param.labeling_speed }
    severity: low
    why: Label application is qualified over a stated speed range. A planned speed outside it is not qualified.
    activities: [equipment_qualification, equipment_requalification]

  - id: R-EQ-RANGE-SHIPPER
    version: 1.0.0
    title: Shipper qualified duration
    match: [uo.storage_shipping.equip.shipper.qualifiedRange]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.storage_shipping.param.max_transit_time.max }
    severity: high
    why: The shipping configuration is qualified to hold temperature for a stated duration. A planned transit time beyond it is not qualified.
    activities: [equipment_qualification, equipment_requalification, shipping_validation]

  # ================================================================== milestone 5.5: shipping to the fill site and bulk packaging
  # Specific rules ahead of the generic fallbacks. Parameters and in-process sets that need nothing special (transport
  # temperature range, monitoring, custody controls, bulk identity labels, integrity checks) use the generic rules above.

  # ---- drug substance shipping to the fill site
  - id: R-DSI-CONFIG
    version: 1.0.0
    title: Drug substance shipping configuration
    match: [uo.ds_shipping_inbound.equip.shipper.operatingPrinciple]
    comparator: enum
    severity: high
    why: Dry shippers, passive insulated shippers, active containers and refrigerated trucks protect the drug substance by different mechanisms and for different durations. A change of configuration needs its own qualification.
    activities: [ds_lane_qualification, risk_assessment_update, procedure_update, training]

  - id: R-DSI-TRANSIT
    version: 1.0.0
    title: Drug substance maximum transit time
    match: [uo.ds_shipping_inbound.param.max_transit_time.max]
    comparator: upper_limit
    severity: high
    why: A transit time longer than the qualified duration of the shipper, or than the drug substance stability supports, is not covered by the lane qualification.
    activities: [ds_lane_qualification, stability_assessment]

  - id: R-DSI-LANE
    version: 1.0.0
    title: Drug substance shipping lane
    match: [uo.ds_shipping_inbound.doc.shipping_lane.name]
    comparator: text
    config:
      differentAs: new_requirement
    severity: medium
    why: Thermal qualification is specific to the lane (route, transit time, handling and climate). A new lane needs qualification evidence of its own.
    activities: [ds_lane_qualification, risk_assessment_update]

  - id: R-EV-DSI-LANE
    version: 1.0.0
    title: Drug substance lane qualification at RU
    match: [uo.ds_shipping_inbound.study.lane_qualification.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    why: The RU shipper and lane are not qualified for drug substance until lane qualification is available.
    activities: [ds_lane_qualification]

  - id: R-DSI-EXCURSION
    version: 1.0.0
    title: Drug substance temperature excursion allowance
    match: [uo.ds_shipping_inbound.param.excursion_allowance.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: The excursion allowance comes from drug substance stability data. A longer allowance than the supported one is not covered by those data.
    activities: [stability_assessment, risk_assessment_update]

  - id: R-DSI-EXCURSION-HANDLING
    version: 1.0.0
    title: Drug substance excursion handling
    match: [uo.ds_shipping_inbound.doc.excursion_handling.approach]
    comparator: enum
    severity: medium
    why: The decision rule for an excursion decides whether a shipment is used, assessed or rejected. A different rule changes which drug substance reaches the process and needs a procedure and training.
    activities: [risk_assessment_update, procedure_update, training]

  # ---- bulk packaging
  - id: R-BP-CONTAINER
    version: 1.0.0
    title: Bulk container type
    match: [uo.bulk_packaging.mat.bulk_container.type]
    comparator: enum
    severity: medium
    why: Trays, tubs, nests and bags protect the units differently and decide how many are handled together. A different bulk container is a design change of the pack.
    activities: [bulk_pack_verification, risk_assessment_update, procedure_update, training]

  - id: R-BP-UNITS
    version: 1.0.0
    title: Units per bulk container
    match: [uo.bulk_packaging.mat.bulk_container.unitsPerContainer]
    comparator: scale
    config:
      ratioSeverity:
        - { atLeast: 2, severity: medium }
        - { atLeast: 1, severity: low }
    severity: low
    why: More units per bulk container raise the load on the units at the bottom and change the count that is reconciled.
    activities: [bulk_pack_verification, risk_assessment_update]

  - id: R-BP-SEAL
    version: 1.0.0
    title: Bulk container seal or closure
    match: [uo.bulk_packaging.mat.bulk_container.seal]
    comparator: enum
    severity: medium
    why: The seal or closure keeps the units clean and shows tampering during hold and transport. A different seal must be shown to hold through the same conditions.
    activities: [bulk_pack_verification, risk_assessment_update, procedure_update]

  - id: R-EV-BP-PACK
    version: 1.0.0
    title: Bulk pack verification at RU
    match: [uo.bulk_packaging.study.pack_verification.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: The RU bulk container and seal have not been verified for hold and transport.
    activities: [bulk_pack_verification]

  - id: R-EV-BP-HOLD
    version: 1.0.0
    title: Bulk hold time evidence at RU
    match: [uo.bulk_packaging.study.hold_time.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Hold or stability data do not yet support the longer planned bulk hold time.
    activities: [hold_time_study, stability_assessment]

  - id: R-BP-TIME-OUT
    version: 1.0.0
    title: Maximum time out of refrigeration during bulk packing
    match: [uo.bulk_packaging.param.max_time_out_of_refrigeration.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: Product is warmed while it is packed. A longer time out of refrigeration is not supported unless stability data cover it.
    activities: [stability_assessment, hold_time_study]

  - id: R-INSP-TIME-OUT
    version: 1.0.0
    title: Maximum time out of refrigeration during visual inspection
    match: [uo.visual_inspection.param.max_time_out_of_refrigeration.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: Product is warmed during inspection. A longer time out of refrigeration is not supported unless stability data cover it.
    activities: [stability_assessment, hold_time_study]

  - id: R-TOTAL-TIME-OUT
    version: 1.0.0
    title: Total time out of refrigeration
    match: [uo.storage_shipping.param.max_total_time_out_of_refrigeration.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: The total time out of refrigeration across all steps must stay within what stability data support.
    activities: [stability_assessment, hold_time_study]

  - id: R-COLD-HOLD
    version: 1.0.0
    title: Maximum cold hold at 2 to 8 °C
    match: [uo.ds_receipt_thaw.param.max_cold_hold.max, uo.bbr_filtration.param.max_cold_hold.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: A longer cold hold of the thawed drug substance or the bioburden-reduced bulk is not supported unless hold data cover it.
    activities: [hold_time_study, stability_assessment]

  - id: R-EV-BP-TOR
    version: 1.0.0
    title: Time-out-of-refrigeration evidence for bulk packing at RU
    match: [uo.bulk_packaging.study.tor_stability.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Stability data do not yet support the longer planned time out of refrigeration during bulk packing.
    activities: [stability_assessment, hold_time_study]

  - id: R-BP-STORAGE
    version: 1.0.0
    title: Bulk storage condition
    match: [uo.bulk_packaging.mat.bulk_product.storageCondition]
    comparator: enum
    severity: high
    regulatory: true
    why: The bulk storage condition is the one supported by the stability data. A different condition is not covered by those data.
    activities: [stability_assessment, temperature_mapping, risk_assessment_update, procedure_update]

  # ---- shipping from the fill site: what is shipped and where to
  - id: R-SS-SHIPPED
    version: 1.0.0
    title: What is shipped from the fill site
    match: [uo.storage_shipping.mat.shipped_product.form]
    comparator: enum
    severity: medium
    why: Unlabelled bulk and labelled finished product need different protection, identity and traceability in transit. Bulk still has to be labelled, so a different form changes which controls travel with the product.
    activities: [shipping_validation, quality_agreement_review, risk_assessment_update, procedure_update]

  - id: R-SS-DESTINATION
    version: 1.0.0
    title: Shipping destination type
    match: [uo.storage_shipping.doc.shipping_lane.destination]
    comparator: enum
    severity: medium
    why: Shipping to a labelling and packaging site and shipping to distribution are different lanes with different receivers and controls.
    activities: [shipping_validation, quality_agreement_review, risk_assessment_update]

  # ------------------------------------------------------------------ generic fallbacks (custom and catalog items)
  # Placed last so every specific rule above wins. Custom items use keys starting with x_.
  - id: R-GEN-EQUIP-PRINCIPLE
    version: 1.0.0
    title: Equipment operating principle
    match: [uo.*.equip.*.operatingPrinciple]
    comparator: text
    severity: medium
    why: A different operating principle changes how the step performs and how it was qualified{{ and validated|}}.
    activities: [equipment_qualification, risk_assessment_update, procedure_update]

  - id: R-GEN-MAT-PRESENCE
    version: 1.0.0
    title: Material or component used
    match: [uo.*.mat.*.present]
    comparator: presence
    severity: medium
    why: Adding or removing a product-contact material or component changes the materials basis of the {{validated|current}} process.
    activities: [extractables_leachables, risk_assessment_update, procedure_update]

  - id: R-GEN-IPC-DESCRIPTION
    version: 1.0.0
    title: In-process control
    match: [uo.*.ipc.*.description]
    comparator: text
    severity: medium
    why: A different in-process control changes how the step is monitored and released.
    activities: [risk_assessment_update, procedure_update]
