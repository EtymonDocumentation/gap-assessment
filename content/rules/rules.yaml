# Comparison rules. The first rule whose match glob fits a question's binds
# path is used ("*" = one path segment), so specific rules come first.
# The comparator decides the category; the rule supplies rationale,
# implied activities, severity and whether regulatory affairs assessment is
# flagged. Regulatory wording is fixed: "Requires regulatory affairs assessment."
ruleset:
  id: gap-core-rules
  version: 1.1.0

rules:
  # ------------------------------------------------------------------ site
  - id: R-SITE-INFO
    version: 1.0.0
    title: Site identification (informational)
    match: [site.name, site.line]
    comparator: informational
    severity: none
    why: Identification only; not compared.

  - id: R-SITE-BARRIER
    version: 1.0.0
    title: Aseptic barrier technology
    match: [site.barrier]
    comparator: enum
    severity: high
    regulatory: true
    why: The barrier design is central to the contamination control strategy. A different barrier changes interventions, APS design, environmental monitoring and operator practices.
    activities: [risk_assessment_update, media_fill, environmental_monitoring_assessment, equipment_qualification, procedure_update, training]

  - id: R-SITE-GRADE
    version: 1.0.0
    title: Background cleanroom grade
    match: [site.backgroundGrade]
    comparator: enum
    severity: medium
    regulatory: true
    why: The background grade is part of the facility design basis and determines monitoring limits and gowning.
    activities: [environmental_monitoring_assessment, risk_assessment_update, procedure_update]

  - id: R-SITE-CONTAINMENT
    version: 1.0.0
    title: Containment approach
    match: [site.containment]
    comparator: enum
    severity: medium
    why: A different containment approach changes operator protection and how it is reconciled with aseptic requirements.
    activities: [risk_assessment_update, procedure_update, training]

  - id: R-SITE-BRS
    version: 1.0.0
    title: Batch record system
    match: [site.batchRecordSystem]
    comparator: enum
    severity: medium
    why: A different batch record system changes data capture, review and data integrity controls for the process.
    activities: [csv_assessment, procedure_update, training]

  # ------------------------------------------------------------------ unit operation presence
  - id: R-UO-PRESENCE
    version: 1.0.0
    title: Unit operation presence
    match: [uo.*.presence]
    comparator: presence
    severity: high
    regulatory: true
    why: Adding or removing a unit operation changes the process flow covered by the validated state.
    activities: [risk_assessment_update, ppq_coverage_assessment, procedure_update, training]

  # ================================================================== milestone 2 unit operations
  # Specific rules for the milestone 2 unit operations. They sit ahead of the generic
  # parameter, capacity, limit and in-process rules below so the first match is the specific one.

  # ---- drug substance receipt and thaw
  - id: R-DS-CONTAINER
    version: 1.0.0
    title: Drug substance container type
    match: [uo.ds_receipt_thaw.mat.ds_container.type]
    comparator: enum
    severity: high
    regulatory: true
    why: The drug substance container closure system determines freeze and thaw behaviour, extractables and leachables exposure and the stability data that support storage. A different container type is a design change.
    activities: [extractables_leachables, freeze_thaw_study, risk_assessment_update, procedure_update, training]

  - id: R-THAW-PRINCIPLE
    version: 1.0.0
    title: Thaw system operating principle
    match: [uo.ds_receipt_thaw.equip.thaw_unit.operatingPrinciple]
    comparator: enum
    severity: high
    regulatory: true
    why: The thaw method sets thaw rate, temperature gradients and cryoconcentration risk, which can affect aggregation and particles. A different method is a design change that source freeze-thaw data do not cover.
    activities: [freeze_thaw_study, product_quality_impact, equipment_qualification, engineering_run, procedure_update, training]

  - id: R-THAW-MIXING
    version: 1.0.0
    title: Post-thaw mixing method
    match: [uo.ds_receipt_thaw.equip.thaw_mixer.operatingPrinciple]
    comparator: enum
    severity: medium
    why: Thawed drug substance is stratified, so the mixing method decides homogeneity and the shear and foaming the protein sees. A different method is not covered by the source mixing evidence.
    activities: [mixing_study, product_quality_impact, equipment_qualification, procedure_update]

  - id: R-THAW-PARAM
    version: 1.0.0
    title: Thaw parameter range
    match: [uo.ds_receipt_thaw.param.thaw_temperature, uo.ds_receipt_thaw.param.thaw_duration]
    comparator: range
    severity: medium
    severityBy:
      classification: { CPP: high, KPP: medium, non_critical: low }
    regulatory: true
    why: Thaw conditions outside the source proven acceptable range are not supported by the freeze-thaw evidence for the drug substance.
    activities: [freeze_thaw_study, scientific_justification, engineering_run]
    outcomes:
      within_validated_range:
        why: The target thaw conditions lie within the source proven acceptable range. Record the target range in procedures; no additional study is implied.
        activities: [procedure_update]

  - id: R-THAW-AMBIENT-TIME
    version: 1.0.0
    title: Maximum time at ambient temperature after thaw
    match: [uo.ds_receipt_thaw.param.max_ambient_time.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: Holding thawed drug substance at ambient temperature for longer than the validated time is not supported by stability and microbial hold data.
    activities: [hold_time_study, risk_assessment_update]
    outcomes:
      within_validated_range:
        why: The planned maximum time at ambient temperature is within the validated time.

  - id: R-EV-FREEZE-THAW
    version: 1.0.0
    title: Freeze-thaw evidence for target thaw method and container
    match: [uo.ds_receipt_thaw.study.freeze_thaw.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Product quality after thaw is not demonstrated for the target thaw method and container until freeze-thaw data exist.
    activities: [freeze_thaw_study, product_quality_impact]

  - id: R-EV-THAW-HOMOGENEITY
    version: 1.0.0
    title: Post-thaw homogeneity at target
    match: [uo.ds_receipt_thaw.study.thaw_homogeneity.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Homogeneity of the thawed bulk has not been demonstrated for the target thaw and mixing method.
    activities: [mixing_study]

  # ---- stand-alone stoppering
  - id: R-STOPPERING-METHOD
    version: 1.0.0
    title: Stoppering mode or placement principle
    match: [uo.stoppering.equip.stoppering_unit.type, uo.stoppering.equip.stoppering_unit.operatingPrinciple]
    comparator: enum
    severity: high
    regulatory: true
    why: The stoppering mode and placement principle decide vent geometry, stopper seating, particle generation and the exposure the aseptic process simulation must cover. A change is a design change.
    activities: [engineering_run, media_fill, cci_study, equipment_qualification, procedure_update, training]

  - id: R-STOPPER-PREP
    version: 1.0.0
    title: Stopper preparation or siliconization
    match: [uo.stoppering.mat.stopper.type, uo.stoppering.mat.stopper.siliconization]
    comparator: enum
    severity: medium
    regulatory: true
    why: Stopper preparation and siliconization affect particulates, sterilization history, machinability, stopper sticking and protein adsorption. Existing component data cover only the source configuration.
    activities: [engineering_run, cci_study, extractables_leachables]

  - id: R-STOPPERING-OPEN-TIME
    version: 1.0.0
    title: Maximum partially stoppered time
    match: [uo.stoppering.param.max_open_time.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: A longer time with vials partially stoppered extends exposure in the aseptic zone and must be covered by the media fill and the process validation.
    activities: [media_fill, risk_assessment_update, ppq_coverage_assessment]

  - id: R-APS-OPEN-TIME-COVERAGE
    version: 1.0.0
    title: APS coverage of partially stoppered time
    match: [uo.stoppering.study.aps.coverage]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.stoppering.param.max_open_time.max }
    severity: high
    why: The aseptic process simulation must cover the longest planned time that vials are partially stoppered on the line used.
    activities: [media_fill]

  - id: R-EV-STOPPER-MACHINABILITY
    version: 1.0.0
    title: Stopper machinability and compatibility at target
    match: [uo.stoppering.study.stopper_machinability.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Stopper feeding, seating and compatibility with the product have not been demonstrated on the target stoppering unit.
    activities: [engineering_run, cci_study]

  # ---- lyophilization
  - id: R-LYO-CYCLE-PARAM
    version: 1.0.0
    title: Lyophilization cycle parameter range
    match:
      - uo.lyophilization.param.freeze_shelf_temp
      - uo.lyophilization.param.primary_shelf_temp
      - uo.lyophilization.param.primary_pressure
      - uo.lyophilization.param.secondary_shelf_temp
      - uo.lyophilization.param.secondary_time
    comparator: range
    severity: medium
    severityBy:
      classification: { CPP: high, KPP: medium, non_critical: low }
    regulatory: true
    why: Lyophilization cycle parameters determine product temperature, cake structure and residual moisture. Operating outside the source proven acceptable or validated range is not supported by the cycle development and PPQ data.
    activities: [lyo_cycle_verification, scientific_justification, engineering_run, ppq_coverage_assessment]
    outcomes:
      within_validated_range:
        why: The target cycle conditions lie within the source proven acceptable or validated range. Record the target cycle in the recipe and procedures; no additional validation is implied.
        activities: [procedure_update]

  - id: R-LYO-CYCLE-TIME
    version: 1.0.0
    title: Lyophilization total cycle time (maximum)
    match: [uo.lyophilization.param.total_cycle_time.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: A longer total cycle time extends the time vials spend in the chamber and is not supported by the validated cycle and the stability data.
    activities: [lyo_cycle_verification, hold_time_study, ppq_coverage_assessment]

  - id: R-LYO-SHELF-AREA
    version: 1.0.0
    title: Lyophilizer shelf area
    match: [uo.lyophilization.equip.lyophilizer.capacity]
    comparator: scale
    config:
      ratioSeverity:
        - { atLeast: 2, severity: high }
        - { atLeast: 1, severity: medium }
    severity: medium
    regulatory: true
    why: A different shelf area changes the maximum batch size and the heat and mass transfer of the cycle. The validated cycle cannot be assumed to perform the same way at another scale.
    activities: [lyo_cycle_verification, engineering_run, equipment_qualification, ppq_coverage_assessment]

  - id: R-LYO-LOADING
    version: 1.0.0
    title: Lyophilizer loading method
    match: [uo.lyophilization.equip.loading_system.operatingPrinciple]
    comparator: enum
    severity: high
    regulatory: true
    why: Manual and automatic loading differ in operator interventions, exposure time and vial handling, and must be represented in the aseptic process simulation. A different loading method is a design change.
    activities: [media_fill, risk_assessment_update, equipment_qualification, procedure_update, training]

  - id: R-LYO-FEATURES
    version: 1.0.0
    title: Lyophilization cycle design features
    match:
      - uo.lyophilization.equip.lyophilizer.nucleation
      - uo.lyophilization.equip.lyophilizer.closure
      - uo.lyophilization.mat.backfill_gas.type
    comparator: enum
    severity: medium
    regulatory: true
    why: Nucleation control, the closure approach and the backfill gas change ice structure, drying behaviour or the vial headspace. They are part of the cycle design that was validated.
    activities: [lyo_cycle_verification, cci_study, scientific_justification, procedure_update]

  - id: R-LYO-MOISTURE-LIMIT
    version: 1.0.0
    title: Residual moisture limit
    match: [uo.lyophilization.ipc.residual_moisture.limit]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: The residual moisture limit is tied to the stability data for the lyophilized product. A higher limit is outside the supported stability basis.
    activities: [scientific_justification, stability_assessment, risk_assessment_update]

  - id: R-EV-LYO-CYCLE
    version: 1.0.0
    title: Cycle transfer and verification on target lyophilizer
    match: [uo.lyophilization.study.cycle_verification.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: The cycle has not been shown to give the validated product temperature profile and residual moisture on the target lyophilizer or scale.
    activities: [lyo_cycle_verification, engineering_run]

  - id: R-EV-LYO-APS-LOADING
    version: 1.0.0
    title: APS coverage of lyophilizer loading
    match: [uo.lyophilization.study.aps_loading.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: The aseptic process simulation does not demonstrate the target loading method and duration until it is covered.
    activities: [media_fill]

  # ---- visual inspection
  - id: R-VI-METHOD
    version: 1.0.0
    title: Visual inspection method
    match: [uo.visual_inspection.equip.inspection.operatingPrinciple]
    comparator: enum
    severity: high
    regulatory: true
    why: Manual, semi-automated and automated inspection detect defects by different principles with different detection performance. A different method needs its own qualification and is not covered by the source one.
    activities: [avi_qualification, inspector_qualification, equipment_qualification, csv_assessment, procedure_update, training]

  - id: R-VI-DEFECT-LIBRARY
    version: 1.0.0
    title: Defect library or kit
    match: [uo.visual_inspection.mat.defect_library.type]
    comparator: enum
    severity: medium
    why: Inspector and system qualification depends on the defect set used. A different set can shift the detection performance demonstrated.
    activities: [inspector_qualification, avi_qualification, procedure_update]

  - id: R-VI-REJECT-LIMIT
    version: 1.0.0
    title: Reject rate alert limit
    match: [uo.visual_inspection.ipc.reject_rate.limit]
    comparator: upper_limit
    severity: medium
    why: A higher reject-rate alert limit lets more rejects pass without investigation, which weakens the signal for upstream process deviations.
    activities: [risk_assessment_update, procedure_update]

  - id: R-EV-VI-AVI
    version: 1.0.0
    title: Automated inspection qualification at target
    match: [uo.visual_inspection.study.avi_qualification.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Detection performance of the target automated or semi-automated inspection has not been demonstrated against a defect kit.
    activities: [avi_qualification, equipment_qualification]

  - id: R-EV-VI-INSPECTOR
    version: 1.0.0
    title: Inspector qualification at target
    match: [uo.visual_inspection.study.inspector_qualification.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Target inspectors are not qualified for routine manual inspection until qualification and requalification are in place.
    activities: [inspector_qualification, training]

  # ---- labeling and packaging
  - id: R-SERIALIZATION
    version: 1.0.0
    title: Serialization and aggregation level
    match: [uo.labeling_packaging.equip.serialization.type]
    comparator: enum
    severity: medium
    why: A different serialization or aggregation level changes code generation, data exchange and reporting for the supplied markets.
    activities: [serialization_verification, csv_assessment, procedure_update, training]

  - id: R-PACK-CONFIG
    version: 1.0.0
    title: Secondary packaging configuration
    match: [uo.labeling_packaging.mat.secondary_pack.format]
    comparator: enum
    severity: medium
    regulatory: true
    why: The secondary packaging configuration can be part of the registered presentation and changes thermal behaviour in distribution and pack-out procedures.
    activities: [shipping_validation, risk_assessment_update, procedure_update, training]

  - id: R-PACK-TIME-OUT
    version: 1.0.0
    title: Maximum time out of refrigeration during packaging
    match: [uo.labeling_packaging.param.max_time_out_of_refrigeration.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: Product is warmed during labeling and packaging. A longer time out of refrigeration is not supported unless stability data cover it.
    activities: [stability_assessment, hold_time_study]

  - id: R-EV-SERIALIZATION
    version: 1.0.0
    title: Serialization verification at target
    match: [uo.labeling_packaging.study.serialization_verification.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Serialization and aggregation have not been verified for the target level and markets.
    activities: [serialization_verification, csv_assessment]

  - id: R-EV-TIME-OUT
    version: 1.0.0
    title: Time-out-of-refrigeration evidence at target
    match: [uo.labeling_packaging.study.tor_stability.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Stability data do not yet support the longer planned time out of refrigeration.
    activities: [stability_assessment, hold_time_study]

  # ---- storage and shipping
  - id: R-STORAGE-CONDITION
    version: 1.0.0
    title: Finished-product storage condition
    match: [uo.storage_shipping.mat.drug_product.storageCondition]
    comparator: enum
    severity: high
    regulatory: true
    why: The storage condition is the one supported by the stability data and normally appears in the registered product information. A different condition is not covered by those data.
    activities: [stability_assessment, temperature_mapping, shipping_validation, risk_assessment_update, procedure_update]

  - id: R-SHIP-CONFIG
    version: 1.0.0
    title: Shipping configuration
    match: [uo.storage_shipping.equip.shipper.operatingPrinciple]
    comparator: enum
    severity: high
    why: Passive, active and refrigerated-vehicle shipments protect the product by different mechanisms and have different qualified durations. A change of configuration needs its own qualification.
    activities: [shipping_validation, risk_assessment_update, procedure_update, training]

  - id: R-SHIP-LANE
    version: 1.0.0
    title: Primary shipping lane
    match: [uo.storage_shipping.doc.shipping_lane.name]
    comparator: text
    config:
      differentAs: new_requirement
    severity: medium
    why: Thermal qualification is specific to the lane (route, transit time, handling and climate). A new lane needs qualification evidence of its own.
    activities: [shipping_validation, risk_assessment_update]

  - id: R-SHIP-TRANSIT
    version: 1.0.0
    title: Maximum transit time
    match: [uo.storage_shipping.param.max_transit_time.max]
    comparator: upper_limit
    severity: high
    why: A transit time longer than the qualified duration of the shipping configuration is not supported by the shipping qualification.
    activities: [shipping_validation, stability_assessment]

  - id: R-SHIP-EXCURSION
    version: 1.0.0
    title: Temperature excursion allowance
    match: [uo.storage_shipping.param.excursion_allowance.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: The excursion allowance comes from stability data. A longer allowance than the supported one is not covered by those data.
    activities: [stability_assessment, risk_assessment_update]

  - id: R-EV-STABILITY
    version: 1.0.0
    title: Stability support for target storage condition
    match: [uo.storage_shipping.study.stability_support.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Stability data do not yet support the target storage condition for the full shelf life.
    activities: [stability_assessment]

  - id: R-EV-SHIPPING
    version: 1.0.0
    title: Shipping qualification at target
    match: [uo.storage_shipping.study.shipping_validation.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    why: The target shipping configuration and lane are not qualified until shipping qualification is available.
    activities: [shipping_validation]

  # ------------------------------------------------------------------ scale
  - id: R-BATCH-SIZE
    version: 1.0.0
    title: Batch size
    match: [uo.compounding.param.batch_size]
    comparator: scale
    config:
      ratioSeverity:
        - { atLeast: 2, severity: high }
        - { atLeast: 1, severity: medium }
    severity: medium
    regulatory: true
    why: A batch size outside the validated range affects mixing, hold times, filter loading, filling duration and APS coverage, and is outside the scale demonstrated in PPQ.
    activities: [mixing_study, hold_time_study, filter_sizing, media_fill, engineering_run, ppq_coverage_assessment]
    outcomes:
      within_validated_range:
        why: The target batch size lies within the batch size range covered by the source validation.

  - id: R-EQUIP-CAPACITY
    version: 1.0.0
    title: Equipment capacity
    match: [uo.*.equip.*.capacity]
    comparator: scale
    config:
      ratioSeverity:
        - { atLeast: 2, severity: medium }
        - { atLeast: 1, severity: low }
    severity: low
    why: Equipment scale affects minimum and maximum working volumes, mixing and heat transfer.
    activities: [mixing_study, equipment_qualification]

  - id: R-FILTER-AREA
    version: 1.0.0
    title: Sterilizing filter area
    match: [uo.sterile_filtration.mat.sterilizing_filter.area]
    comparator: scale
    config:
      ratioSeverity:
        - { atLeast: 2, severity: medium }
        - { atLeast: 1, severity: low }
    severity: low
    why: Filter area relative to batch volume determines filter loading and filtration time.
    activities: [filter_sizing]

  # ------------------------------------------------------------------ limits
  - id: R-HOLD-TIME
    version: 1.0.0
    title: Hold time (maximum)
    match: [uo.*.param.max_hold_time.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: Holding the bulk longer than the validated time is not supported by stability and microbial hold data.
    activities: [hold_time_study]
    outcomes:
      within_validated_range:
        why: The planned maximum hold time is within the validated hold time.

  - id: R-FILL-DURATION
    version: 1.0.0
    title: Filling duration (maximum)
    match: [uo.aseptic_filling.param.max_fill_duration.max]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: A longer filling duration extends product exposure and room-temperature hold and must be covered by the APS and process validation.
    activities: [media_fill, hold_time_study, ppq_coverage_assessment]

  - id: R-BIOBURDEN-LIMIT
    version: 1.0.0
    title: Pre-filtration bioburden limit
    match: [uo.*.ipc.*.limit]
    comparator: upper_limit
    severity: high
    regulatory: true
    why: The bioburden limit must remain within the challenge level demonstrated in bacterial retention validation.
    activities: [filter_bacterial_retention, risk_assessment_update]

  # ------------------------------------------------------------------ parameters (generic; keep after specific parameter rules)
  - id: R-PARAM-RANGE
    version: 1.0.0
    title: Process parameter range
    match: [uo.*.param.*]
    comparator: range
    severity: medium
    severityBy:
      classification: { CPP: high, KPP: medium, non_critical: low }
    regulatory: true
    why: Operating outside the source PAR or validated range is not supported by existing process validation data.
    activities: [scientific_justification, engineering_run, ppq_coverage_assessment]
    outcomes:
      within_validated_range:
        why: The target operating range lies within the source PAR or validated range. Record the target range in procedures; no additional validation is implied.
        activities: [procedure_update]

  # ------------------------------------------------------------------ coverage (validated state)
  - id: R-MIXING-COVERAGE
    version: 1.0.0
    title: Mixing study coverage of target batch size
    match: [uo.compounding.study.mixing.coverage]
    comparator: coverage
    config:
      coverageSide: source
      against: { side: target, path: uo.compounding.param.batch_size }
    severity: high
    why: Homogeneity has been demonstrated only over the volumes studied; the target batch size must fall within that coverage.
    activities: [mixing_study]

  - id: R-APS-COVERAGE
    version: 1.0.0
    title: APS duration coverage on target line
    match: [uo.aseptic_filling.study.aps.coverage]
    comparator: coverage
    config:
      coverageSide: target
      against: { side: target, path: uo.aseptic_filling.param.max_fill_duration.max }
    severity: high
    why: Aseptic process simulation must cover the maximum planned filling duration on the line used.
    activities: [media_fill]

  # ------------------------------------------------------------------ equipment principle / design
  - id: R-FILL-PUMP
    version: 1.0.0
    title: Filling pump operating principle
    match: [uo.aseptic_filling.equip.filler.operatingPrinciple]
    comparator: enum
    severity: high
    regulatory: true
    why: The filling principle affects fill accuracy, shear and particle formation, and is part of the process demonstrated in PPQ. A different principle is a design change.
    activities: [engineering_run, fill_accuracy_study, product_quality_impact, comparability_assessment, equipment_qualification, ppq, procedure_update, training]

  - id: R-MIXER
    version: 1.0.0
    title: Mixer operating principle
    match: [uo.compounding.equip.mixer.operatingPrinciple]
    comparator: enum
    severity: medium
    regulatory: true
    why: A different mixing principle changes shear, foaming and homogeneity, and is not covered by the source mixing study.
    activities: [mixing_study, product_quality_impact, equipment_qualification, procedure_update]

  - id: R-VESSEL-TYPE
    version: 1.0.0
    title: Compounding vessel type
    match: [uo.compounding.equip.vessel.type]
    comparator: enum
    severity: medium
    regulatory: true
    why: A different vessel type changes product-contact materials and mixing geometry.
    activities: [mixing_study, extractables_leachables, equipment_qualification]

  - id: R-CAPPER
    version: 1.0.0
    title: Capping machine operating principle
    match: [uo.capping.equip.capper.operatingPrinciple]
    comparator: enum
    severity: high
    regulatory: true
    why: The capping mechanism determines seal force application and therefore container closure integrity.
    activities: [cci_study, rsf_study, equipment_qualification, procedure_update, training]

  - id: R-CAP-ENV
    version: 1.0.0
    title: Capping environment
    match: [uo.capping.equip.capper.type]
    comparator: enum
    severity: medium
    why: The protection of stoppered, uncrimped vials is part of the contamination control strategy.
    activities: [risk_assessment_update, environmental_monitoring_assessment, procedure_update]

  # ------------------------------------------------------------------ materials and components
  - id: R-SUA-SUPPLIER
    version: 1.0.0
    title: Single-use assembly supplier (informational)
    match: [uo.sterile_filtration.mat.sua.supplier]
    comparator: informational
    severity: none
    why: Recorded for the E&L assessment; the presence comparison and E&L question carry the gap.

  - id: R-SUA-PRESENCE
    version: 1.0.0
    title: Single-use filtration assembly
    match: [uo.sterile_filtration.mat.sua.present]
    comparator: presence
    severity: medium
    regulatory: true
    why: A single-use assembly introduces new product-contact polymers and connections that require E&L and compatibility assessment.
    activities: [extractables_leachables, filter_compatibility, procedure_update, training]
    outcomes:
      removed_element:
        why: Replacing a single-use assembly with reusable equipment introduces cleaning and sterilization requirements.
        activities: [equipment_qualification, procedure_update, training]

  - id: R-FILTER-TRAIN
    version: 1.0.0
    title: Filtration train element
    match: [uo.sterile_filtration.mat.*.present]
    comparator: presence
    severity: high
    regulatory: true
    why: The filtration train is part of the validated sterilization design; adding or removing a filter changes it.
    activities: [filter_bacterial_retention, risk_assessment_update, procedure_update]

  - id: R-FILTER-DESIGN
    version: 1.0.0
    title: Sterilizing filter design
    match:
      - uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction
      - uo.sterile_filtration.mat.sterilizing_filter.poreRating
      - uo.sterile_filtration.mat.sterilizing_filter.supplier
      - uo.sterile_filtration.mat.sterilizing_filter.partNumber
    comparator: text
    severity: high
    regulatory: true
    why: Sterilizing filter validation (bacterial retention, compatibility, extractables) is specific to the membrane and device.
    activities: [filter_bacterial_retention, filter_compatibility, extractables_leachables, procedure_update]

  - id: R-CONTAINER-FORMAT
    version: 1.0.0
    title: Primary container format
    match: [uo.aseptic_filling.mat.container.format]
    comparator: enum
    severity: high
    regulatory: true
    why: The container format is part of the registered presentation and of the validated filling, stoppering and CCI configuration.
    activities: [cci_study, equipment_qualification, media_fill, ppq]

  - id: R-COMPONENT
    version: 1.0.0
    title: Primary packaging component
    match: [uo.*.mat.*.supplier, uo.*.mat.*.partNumber]
    comparator: text
    severity: medium
    regulatory: true
    why: A different component supplier or part can change dimensions and materials, affecting machinability, CCI and E&L.
    activities: [cci_study, extractables_leachables, engineering_run]

  # ------------------------------------------------------------------ in-process controls
  - id: R-INTEGRITY-TESTS
    version: 1.0.0
    title: Filter integrity testing
    match: [uo.sterile_filtration.ipc.integrity.tests]
    comparator: set
    severity: high
    regulatory: true
    why: Filter integrity testing confirms the sterilizing filter performed as validated. Removing a test requires a documented risk assessment against EU GMP Annex 1 and other applicable expectations.
    activities: [risk_assessment_update, procedure_update, training]
    outcomes:
      new_requirement:
        severity: low
        regulatory: false
        why: An additional integrity test strengthens the control strategy; procedures and training are needed.
        activities: [procedure_update, training]

  - id: R-IPC-SET
    version: 1.0.0
    title: In-process control panel
    match: [uo.*.ipc.*.tests]
    comparator: set
    severity: medium
    regulatory: true
    why: Removing an in-process control changes the control strategy demonstrated in validation.
    activities: [risk_assessment_update, procedure_update, training]
    outcomes:
      new_requirement:
        severity: low
        regulatory: false
        why: An additional in-process control requires a method, procedure and training at the target.
        activities: [procedure_update, training]

  - id: R-IPC-FREQ
    version: 1.0.0
    title: In-process control approach
    match: [uo.*.ipc.*.frequency]
    comparator: enum
    severity: medium
    why: A different in-process control approach changes sampling, alarm handling and batch record content.
    activities: [equipment_qualification, procedure_update, training]

  # ------------------------------------------------------------------ evidence (target-side follow-ups)
  - id: R-EV-MIXING
    version: 1.0.0
    title: Mixing effectiveness at target
    match: [uo.compounding.study.mixing.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    why: Homogeneity has not been demonstrated for the target mixing configuration.
    activities: [mixing_study]

  - id: R-EV-BRET
    version: 1.0.0
    title: Bacterial retention validation for target filter
    match: [uo.sterile_filtration.study.bacterial_retention.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: Sterilizing filtration is not validated for the target filter with this product until bacterial retention is demonstrated.
    activities: [filter_bacterial_retention]

  - id: R-EV-COMPAT
    version: 1.0.0
    title: Filter compatibility for target filter
    match: [uo.sterile_filtration.study.filter_compatibility.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: medium
    why: Chemical compatibility of the target filter with the formulation is not established.
    activities: [filter_compatibility]

  - id: R-EV-EXTRACTABLES
    version: 1.0.0
    title: Extractables data for target filter
    match: [uo.sterile_filtration.study.filter_extractables.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Extractables data for the target filter are needed for the product leachables assessment.
    activities: [extractables_leachables]

  - id: R-EV-SIZING
    version: 1.0.0
    title: Filter sizing for target batch volume
    match: [uo.sterile_filtration.study.filter_sizing.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: Filter capacity for the target batch volume has not been confirmed.
    activities: [filter_sizing]

  - id: R-EV-SUA-EL
    version: 1.0.0
    title: E&L assessment for target single-use assembly
    match: [uo.sterile_filtration.study.sua_el.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Leachables from new product-contact polymers have not been assessed for this product.
    activities: [extractables_leachables]

  - id: R-EV-FILL-ACCURACY
    version: 1.0.0
    title: Fill accuracy of target pump
    match: [uo.aseptic_filling.study.fill_accuracy.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    why: Fill accuracy and precision of the target pump with this product have not been demonstrated.
    activities: [fill_accuracy_study, engineering_run]

  - id: R-EV-PUMP-IMPACT
    version: 1.0.0
    title: Product-quality impact of target pump
    match: [uo.aseptic_filling.study.pump_product_impact.status]
    comparator: evidence
    config:
      map: { no_impact: within_validated_range, impact: outside_validated_range, not_assessed: outside_validated_range }
    severity: high
    regulatory: true
    why: The effect of the target pump on product quality (shear, particles, aggregation) is not established.
    activities: [product_quality_impact, comparability_assessment]

  - id: R-EV-PPQ
    version: 1.0.0
    title: PPQ coverage of target filling principle
    match: [uo.aseptic_filling.study.ppq.status]
    comparator: evidence
    config:
      map: { covered: within_validated_range, bridging_required: outside_validated_range, not_covered: outside_validated_range }
    severity: high
    regulatory: true
    why: Existing PPQ does not demonstrate the process with the target filling principle.
    activities: [ppq]

  - id: R-EV-CCI
    version: 1.0.0
    title: CCI for target configuration
    match: [uo.capping.study.cci.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: high
    regulatory: true
    why: Container closure integrity has not been demonstrated for the target container-closure system and capping process.
    activities: [cci_study]

  - id: R-EV-RSF
    version: 1.0.0
    title: RSF–CCI correlation at target
    match: [uo.capping.study.rsf_cci_correlation.status]
    comparator: evidence
    config:
      map: { available: within_validated_range, planned: outside_validated_range, not_planned: outside_validated_range }
    severity: medium
    why: The RSF range has not been correlated with CCI on the target capping equipment.
    activities: [rsf_study]

  # ------------------------------------------------------------------ procedures
  - id: R-PROCEDURES
    version: 1.0.0
    title: Target procedures
    match: [uo.*.doc.procedures.status]
    comparator: evidence
    config:
      map: { in_place: equivalent, update_required: different_principle, new_required: new_requirement }
    severity: low
    why: Procedures and batch record instructions must reflect the target process before GMP manufacture.
    activities: [procedure_update, training]

  # ------------------------------------------------------------------ generic fallbacks (custom and catalog items)
  # Placed last so every specific rule above wins. Custom items use keys starting with x_.
  - id: R-GEN-EQUIP-PRINCIPLE
    version: 1.0.0
    title: Equipment operating principle
    match: [uo.*.equip.*.operatingPrinciple]
    comparator: text
    severity: medium
    why: A different operating principle changes how the step performs and how it was qualified and validated.
    activities: [equipment_qualification, risk_assessment_update, procedure_update]

  - id: R-GEN-MAT-PRESENCE
    version: 1.0.0
    title: Material or component used
    match: [uo.*.mat.*.present]
    comparator: presence
    severity: medium
    why: Adding or removing a product-contact material or component changes the materials basis of the validated process.
    activities: [extractables_leachables, risk_assessment_update, procedure_update]

  - id: R-GEN-IPC-DESCRIPTION
    version: 1.0.0
    title: In-process control
    match: [uo.*.ipc.*.description]
    comparator: text
    severity: medium
    why: A different in-process control changes how the step is monitored and released.
    activities: [risk_assessment_update, procedure_update]
