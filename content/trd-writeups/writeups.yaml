# TRD write-up library (shipped). One write-up per catalog unit operation and per TRD-level prose section, in neutral wording.
#
# Conventions
#  - A blank is written {{fieldKey|Fallback label}}. The key names the project or TRD value that can fill it (uo.<unit op>.<collection>.<item>.<field>,
#    scope.*, site.*) or a write-up level entry typed by the team (trd.*). An unknown value stays a visible placeholder: no defaults.
#  - A part with "optional" is a load-out the author switches on; it starts off. Nothing here is a rule.
#  - Cross-references use the section title, not a number (numbers come from the generated document).
#  - The tool never states a filing category; where a change needs one, the only wording is "Requires regulatory affairs assessment".
#  - Fictional / generic wording only: no client, product, supplier or person names.
formatVersion: 1.0.0
libraryVersion: 1.0.0
writeups:
  - id: sec_acronyms
    version: 1
    kind: section
    key: acronyms
    title: Acronyms
    parts:
      - id: p1
        kind: paragraph
        text: Common abbreviations used in this document are listed below. Add or delete entries to match the program.
      - id: b1
        kind: bullet
        text: Bioburden reduction filtration (BBRF)
      - id: b2
        kind: bullet
        text: Bulk placebo (BP)
      - id: b3
        kind: bullet
        text: Contract manufacturing organization (CMO)
      - id: b4
        kind: bullet
        text: Drug product (DP)
      - id: b5
        kind: bullet
        text: European Union (EU)
      - id: b6
        kind: bullet
        text: Formulated drug substance (FDS)
      - id: b7
        kind: bullet
        text: Good Manufacturing Practice (GMP)
      - id: b8
        kind: bullet
        text: High-efficiency particulate air (HEPA)
      - id: b9
        kind: bullet
        text: In-process control (IPC)
      - id: b10
        kind: bullet
        text: Item master number (IMN)
      - id: b11
        kind: bullet
        text: Light-emitting diode (LED)
      - id: b12
        kind: bullet
        text: Not more than (NMT)
      - id: b13
        kind: bullet
        text: Pre-use, post-sterilization integrity test (PUPSIT)
      - id: b14
        kind: bullet
        text: Process performance qualification (PPQ)
      - id: b15
        kind: bullet
        text: Quality control (QC)
      - id: b16
        kind: bullet
        text: Receiving unit (RU)
      - id: b17
        kind: bullet
        text: Restricted access barrier system (RABS)
      - id: b18
        kind: bullet
        text: Sending unit (SU)
      - id: b19
        kind: bullet
        text: Sterile filtration (SF)
      - id: b20
        kind: bullet
        text: Technical requirements document (TRD)
      - id: b21
        kind: bullet
        text: Time out of refrigeration (TOR)
      - id: b22
        kind: bullet
        text: Ultraviolet (UV)
      - id: b23
        kind: bullet
        text: United States Pharmacopeia (USP)
      - id: b24
        kind: bullet
        text: Water for injection (WFI)
      - id: b25
        kind: bullet
        text: Weight to volume (w/v)
      - id: b26
        kind: bullet
        text: Weight to weight (w/w)
  - id: sec_introduction
    version: 1
    kind: section
    key: introduction
    title: Introduction
    parts:
      - id: p1
        kind: paragraph
        text: >-
          The technology transfer takes place between the sending unit ({{site.sendingName|Sending unit name}},
          {{trd.sendingSiteLocation|Sending unit location}}) and the receiving unit ({{site.name|Receiving unit name}},
          {{trd.receivingSiteLocation|Receiving unit location}}).
  - id: sec_purpose
    version: 1
    kind: section
    key: purpose
    title: Purpose
    autoAdd: false
    parts:
      - id: p1
        kind: paragraph
        text: >-
          This technical requirements document summarizes the technical, in-process analytical and microbial testing requirements
          for transferring the configuration described here from the sending unit to the receiving unit.
  - id: sec_scope
    version: 2
    kind: section
    key: scope
    title: Scope
    autoAdd: false
    parts:
      - id: p1
        kind: paragraph
        text: >-
          This document covers {{scope.program|Program or product}}, a {{scope.dosage_form|Dosage form}}
          {{scope.modality|Modality}} product presented in
          {{uo.aseptic_filling.mat.container.format|Container format or size ~a}}, with a withdrawable or expellable volume of
          {{trd.scope.withdrawableVolume|Withdrawable volume}}, filled at {{site.name|Receiving unit name}} from formulated drug
          substance item {{trd.scope.dsItemNumber|Drug substance item number}}. Product item number: {{trd.scope.dpItemNumber|Drug
          product item number}}.
      - id: unlabeled
        kind: paragraph
        text: The filled units are supplied unlabeled.
        optional:
          condition: include if the filled units are supplied unlabeled
  - id: sec_batch_size
    version: 2
    kind: section
    key: batch_size
    title: Batch size
    parts:
      - id: p1
        kind: paragraph
        text: >-
          The batch size for this bulk drug product program is {{uo.compounding.param.batch_size.setPoint|Batch size
          (mass, volume or number of units, with the unit)}}.
      - id: dilution
        kind: paragraph
        text: >-
          For a program with dilution, the batch size stated above is the size after dilution.
          {{trd.batchSize.drugSubstanceLotMixingStatement|State how drug substance lots may be combined or not combined}}.
        optional:
          condition: include for programs with dilution
  - id: sec_general_attributes
    version: 1
    kind: section
    key: general_attributes
    title: Drug substance and bulk placebo general attributes
    parts:
      - id: p1
        kind: paragraph
        text: >-
          The general attributes of the formulated drug substance and the bulk placebo are given in
          {{trd.generalAttributes.sourceDocument|Document that states the general attributes}}.
  - id: sec_formulation_precautions
    version: 2
    kind: section
    key: formulation_precautions
    title: Formulation and manufacturing precautions
    parts:
      - id: p1
        kind: paragraph
        text: >-
          The material must be protected from light during storage. Where a risk of light exposure in storage is identified by a
          technical assessment or by light mapping, the sending unit and the receiving unit agree the measures that reduce it.
          Measures to protect from light may include, but are not limited to, the following.
      - id: b1
        kind: bullet
        text: >-
          Lights switched off in the storage room when nobody is present (for example motion-sensor lighting or a manual
          switch-off rule).
      - id: b2
        kind: bullet
        text: >-
          Dark or opaque covering (for example a tarpaulin or film) over the material in storage when the lights must stay on in
          the area.
      - id: b3
        kind: bullet
        text: Opaque packaging materials.
      - id: b4
        kind: bullet
        text: Lower emission of ultraviolet radiation by using darker-coloured lamps or LED lamps.
      - id: post_ppq
        kind: bullet
        text: >-
          Refer to the product-specific light exposure assessment ({{trd.lightExposure.assessmentReference|Light exposure
          assessment reference}}).
        optional:
          condition: include in a TRD issued after process performance qualification
      - id: additional
        kind: bullet
        text: '{{trd.formulationPrecautions.additional|Additional precautions}}'
        optional:
          condition: include to add further precautions
      # A sentence after the list, not a list item: the temperature is a manufacturing condition, not a way to protect from light.
      - id: temperature
        kind: paragraph
        text: >-
          Manufacturing takes place at {{trd.formulationPrecautions.manufacturingTemperature|Temperature range, controlled room
          temperature, or temperature-controlled room}}.
        optional:
          condition: include to state the manufacturing temperature condition
  - id: sec_dilution_buffer
    version: 3
    kind: section
    key: dilution_buffer
    title: Dilution buffer
    appliesWhen: >-
      include only when dilution is performed at the receiving unit (otherwise mark not applicable and state where dilution is
      performed)
    parts:
      - id: p1
        kind: paragraph
        text: >-
          This section describes the buffer used to dilute the formulated drug substance and the excipient solutions prepared
          ahead of it. The detailed preparation of the buffer is described under the buffer preparation unit operation.
      - id: excipient_assessment
        kind: subsection
        title: Excipient assessment
        text: ''
      - id: excipient_assessment_p2
        kind: paragraph
        text: >-
          To support the evaluation of every excipient needed for buffer preparation, the sending unit works with the responsible
          counterpart at the receiving unit to carry out an excipient assessment before production when dilution is performed at
          the receiving unit, as set out in {{trd.dilutionBuffer.assessmentProcedure|Procedure or agreement that governs the
          assessment}}.
      - id: excipient_assessment_p3
        kind: paragraph
        text: The approved excipient assessment is {{trd.dilutionBuffer.assessmentDocument|Excipient assessment document reference}}.
      - id: excipient_solution
        kind: subsection
        title: Excipient solution for the dilution buffer
        text: ''
      - id: excipient_solution_p4
        kind: paragraph
        text: >-
          To support formulation of the required buffer, the receiving unit {{trd.dilutionBuffer.preDilutionNeeded|will / will
          not}} need to prepare a solution of one or more excipients before adding them to the buffer. The table lists any
          excipients that must be mixed into a solution before the buffer (diluent) is added.
      - id: excipient_solution_table
        kind: table
        text: ''
        columns:
          - Component
          - Material name
          - Composition (% w/w or % w/v)
          - Calculated quantity for the target total solution amount
      - id: excipient_solution_n1
        kind: note
        text: >-
          This calculation is for an estimated batch. The receiving unit is free to change the amounts to fit its manufacturing
          constraints, as long as the same ratios (the formula) are followed. Mix with a gentle vortex until the excipient has
          visibly dissolved. Avoid splashing and foaming.
      - id: formulation
        kind: subsection
        title: Dilution buffer (diluent) formulation
        text: ''
      - id: formulation_p5
        kind: paragraph
        text: >-
          To formulate the required buffer, the receiving unit adds each component below within
          {{trd.dilutionBuffer.additionTolerance|Tolerance range}} of the target weight, in the order shown.
      - id: formulation_table
        kind: table
        text: ''
        columns:
          - Component
          - Material name
          - Composition (g/kg, g/L or other unit)
          - Calculated quantity for the target buffer amount
      - id: formulation_n2
        kind: note
        text: >-
          Every excipient must be visibly dissolved before the next manufacturing step starts.
      - id: formulation_n3
        kind: note
        text: >-
          This calculation is for an estimated batch. The receiving unit is free to change the amounts to fit its manufacturing
          constraints, as long as the same ratios (the formula) are followed. Mix with a gentle vortex until the excipient has
          visibly dissolved. Avoid splashing and foaming.
    notApplicable:
      condition: >-
        include only when dilution is performed at the receiving unit (otherwise mark not applicable and state where dilution is
        performed)
      text: 'Not applicable: dilution is performed at {{trd.dilutionBuffer.dilutionSite|Site where dilution is performed}}.'
