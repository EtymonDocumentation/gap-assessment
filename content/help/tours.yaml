# The short guided tour of each main page (opened by the Help (?) button; shown once, by itself, the first time a page is opened in a browser).
#
# Rules for every step (a unit test checks the mechanical ones):
#  - anchor: the id of a real element on the page, written in the page source as data-tour="<id>" (or tour="<id>" on the Tabs component).
#    A step whose element is not on screen (an empty list, the phone layout) is skipped by the app, so a tour is never wrong about what is there.
#  - At least 3 steps per tour (no fixed upper limit; steps whose element is not on the open tab are skipped). A short title and one or two plain sentences. No filled-in values, no decision made for the reader.
#  - Same words as the app and the documents. The tool never decides a filing category, and a document is approved in the company's
#    own document control (the tool is a drafting aid).
version: 1
tours:
  - id: home
    path: /
    title: Tour of the Home page
    steps:
      - anchor: home-start
        title: Start here
        text: Start a new project with this button. It begins empty, and nothing is filled in for you. Under it, More ways to start holds one document on its own, a fictional demo, or a document you already have.
      - anchor: stage-chip
        title: Project stage
        text: Which batches the receiving site will make next (Engineering, Clinical, PPQ or Commercial). It changes the wording of your documents, and each change is saved as a version (the chip beside it, such as v2, opens the version history). Your own text is never changed.
      - anchor: home-next
        title: Next step
        text: The tool suggests what to do next. Every document is optional, so you can skip a step and come back to it later.
      - anchor: home-chain
        title: Your documents
        text: One card for each document, with its state and a button to open or start it. The documents run in a chain, gap assessment, TRD, sampling plan, batch record. Each can use the one before it, but none needs it.
      - anchor: home-projects
        title: Your projects
        text: Your saved projects, newest first. Open one with its Open button; Rename, Copy and Delete are under the three dots beside it.

  - id: gap
    path: /gap
    title: Tour of the gap assessment
    steps:
      - anchor: gap-intro
        title: What it does
        text: The gap assessment compares the sending and the receiving unit and lists every difference. Anything not yet known is marked TBD and stays visible as an open item.
      - anchor: gap-next
        title: Where to go next
        text: This button takes you to the next thing to do in your project. Without a project it takes you to Home, where you start or open one.
      - anchor: gap-started
        title: Getting started
        text: The steps in order. Each one ticks itself when your project gets there, so there is nothing to tick by hand. Every step after the document is optional.

  - id: interview
    path: /interview
    title: Tour of the interview
    steps:
      - anchor: interview-progress
        title: Your progress
        text: This shows how many questions you have answered. You can leave and come back at any time. Your answers are kept.
      - anchor: interview-question
        title: One question at a time
        text: Each question asks about the sending unit (SU), the receiving unit (RU), or both. Answer what you know.
      - anchor: interview-why
        title: Why is this asked?
        text: Open this to see why the tool asks the question and where the answer is used.
      - anchor: interview-tbd
        title: Not known yet?
        text: Choose TBD (to be decided). It is saved as an open item, with an optional owner and due date. The tool never fills in an answer for you.
      - anchor: interview-more
        title: More
        text: Open More for the progress map (jump to any section; a section that still has a TBD is not counted as done until you settle it), the entry order and your saved answers. It starts closed.

  - id: risk
    path: /risk
    title: Tour of the risk assessment
    steps:
      - anchor: page-head
        title: What this page is
        text: A risk assessment lists what could go wrong in the process, scores each item with a method your team chooses, and records the actions that follow.
      - anchor: risk-list
        title: Your assessments
        text: The assessments of this project are listed here. Open one to work on it.
      - anchor: risk-new
        title: Start an assessment
        text: Give it a title and create it. You choose the scoring method yourself. None is chosen for you.
      - anchor: risk-tabs
        title: The steps
        text: Method, Items, Actions and Document. Work through them in order or jump to any tab. A line under the tabs says what each one is for.
      - anchor: page-export
        title: Download a draft
        text: Export downloads the draft as Word or HTML for review. The tool is a drafting aid, so the document is approved in your company's own document control.

  - id: trd
    path: /trd
    title: Tour of the TRD
    steps:
      - anchor: page-head
        title: What this page is
        text: The TRD (technical requirements document) states the process, its steps and its parameters, each with a source.
      - anchor: trd-new
        title: Start a TRD
        text: Give it a title and choose how it starts. It can be blank, from this project, from a seed file, from an uploaded file, or by answering questions. Nothing is added unless you choose it.
      - anchor: trd-interview
        title: The Interview tab
        text: Answer plain questions and the TRD fills itself in. Anything you do not know stays open. It sits beside Details, Process, Descriptions, Open items and Document.
      - anchor: trd-one-at-a-time
        title: One question at a time
        text: Use the switch Show one question at a time to see a single question with Back and Next. Turn it off to see the whole list again.
      - anchor: page-export
        title: Download a draft
        text: Export downloads the draft as Word or HTML for review. The tool is a drafting aid, so the document is approved in your company's own document control.

  - id: sampling
    path: /sampling
    title: Tour of the sampling plan
    steps:
      - anchor: page-head
        title: What this page is
        text: A sampling plan says where and when to sample in the PPQ (process performance qualification) batches.
      - anchor: plan-new
        title: Start a plan
        text: Give the plan a title and create it. The number of batches and the sample sizes are your decisions.
      - anchor: plan-tabs
        title: Plan sections
        text: Overview, Interview, Design review and Subsections. Switching tabs never loses anything you entered.
      - anchor: plan-points
        title: Sampling points
        text: Each row is a place in the process where a sample is taken. Add one, select a row to edit it, and open the question marks for help.
      - anchor: page-export
        title: Download a draft
        text: Export downloads the draft as Word or HTML for review. The tool is a drafting aid, so the document is approved in your company's own document control.

  - id: mbr
    path: /mbr
    title: Tour of the batch record
    steps:
      - anchor: page-head
        title: What this page is
        text: A batch record (MBR) is the step-by-step instruction for making one batch.
      - anchor: mbr-new
        title: Start a batch record
        text: It can start from a TRD, from a sampling plan, or from neither. You choose. Nothing is added unless you tick it.
      - anchor: mbr-tabs
        title: Three views
        text: Edit is where you write the record. Process view draws it as an equipment train. Document gives the Word or HTML draft.
      - anchor: mbr-sections
        title: Sections and ready-made steps
        text: Add sections and ready-made steps, fill in the rows, and clear the open items. Everything stays visible until you settle it.
      - anchor: mbr-excipients
        title: Excipients used
        text: An optional list of the excipients the excipient assessment links to this record's TRD. Nothing is added unless you tick it, and a row only changes when you press Update.
      - anchor: mbr-view-tab
        title: Process view
        text: Open this tab to follow the fluid step by step. It is a picture of the record, not a second place to edit. Use it to spot gaps before review.

  - id: excipient
    path: /excipient
    title: Tour of the excipient assessment
    steps:
      - anchor: page-head
        title: What this page is
        text: An excipient is any ingredient of the product that is not the active substance. This assessment compares each one between the sending and the receiving site.
      - anchor: excipient-starts
        title: Start an assessment
        text: Start blank, start from the library, or answer questions. Nothing is filled in for you, and anything you do not know stays open.
      - anchor: excipient-tabs
        title: Five steps
        text: Excipients, Questions, Specifications, Open items and Document. You can open any of them at any time, in any order.
      - anchor: excipient-lines
        title: Your excipients
        text: Add each excipient by name. The table shows what is still open for each one, and one click opens its page.
      - anchor: excipient-one-at-a-time
        title: One question at a time
        text: On the Questions tab you can see all the questions, or one at a time. A question you cannot answer yet can stay open.
      - anchor: excipient-specs
        title: Specifications compared
        text: Pick a test and enter the limit at each site. The tool shows Same, Different or Only at one site, and the counts are worked out for you.

