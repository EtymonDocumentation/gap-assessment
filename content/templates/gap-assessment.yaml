# Fixed wording for the generated gap assessment document.
# Placeholders: {program} {modality} {dosageForm} {presentation} {transferType}
# {markets} {sourceSite} {targetSite} {sourceStage} {targetStage} {date}. Unknown values appear as written
# by the engine (for example "Unknown — to be confirmed", or "[not established]" for a program stage);
# nothing is invented.
#
# Stage-aware wording: {{validated wording|other wording}}. The first variant is used only when the source
# program stage is established as commercial (process validated); every other case, including an unanswered
# stage, uses the second. Quote a value that holds a marker if it would otherwise start with a brace.
templates:
  id: gap-assessment-document
  version: 1.3.0

document:
  title: "Gap assessment: {program} — {sourceSite} to {targetSite}"
  banner: Proof of concept. Not validated. Not for GMP use.
  purpose: >-
    This document compares the {{validated|current}} manufacturing process for {program} at
    {sourceSite} (source) with the planned process at {targetSite} (target). It
    identifies differences, classifies each difference, lists the activities
    {{implied before the target process can be considered validated|implied by the differences for the target program stage}}, and records
    information that is still missing. It is a draft generated from structured
    interview answers and must be reviewed and approved before use.
  scope: >-
    Product: {program} ({modality}; {dosageForm}; {presentation}). Transfer type:
    {transferType}. Program stage: source {sourceStage}; target {targetStage}.
    Intended markets: {markets}. The assessment covers the unit
    operations listed below for both sites. Unit operations outside this list are
    not assessed in this version.
  sourceSummaryIntro: >-
    The source process {{as validated|as it currently stands}}, as recorded in the interview. Each value shows
    its source and verification state. Values marked "Unknown — to be confirmed" or
    "Not established" are open information items.
  targetSummaryIntro: >-
    The planned target process, as recorded in the interview. Values marked "same as
    source" were asserted by the responder to match the source and follow the source
    value.
  differencesIntro: >-
    Every recorded attribute was compared between source and target using the
    versioned comparison rules listed under References. Differences are grouped by
    unit operation. Attributes found equivalent are counted but not listed individually.
  gapTableIntro: >-
    One row per difference or information gap. The rule identifier and version show
    which comparison rule produced the classification. Severity reflects the rule
    unless adjusted, in which case the adjustment and its justification are shown.
  activitiesIntro: >-
    Validation and data activities implied by the differences above, with the gaps
    that drive each, most severe first. Where a study provides evidence for an
    activity, its source and target status are shown, and the readiness column
    summarises the target status: evidence available, planned, not planned,
    bridging or action required, or information required (the status is unknown or
    not established). Activities whose gaps are closed or accepted in the register
    remain listed with that status. The list is a starting point for the transfer
    plan; it does not replace a documented risk assessment.
  equipmentQualificationIntro: >-
    Qualification status of the equipment at each site, and the range the target
    equipment is qualified for compared with the range the target process needs.
    Unknown or missing values are shown as such; none is assumed. Related gaps are
    the differences recorded for the same equipment.
  openItemsIntro: >-
    Information that is unknown or not established. Each item must be resolved before
    the related comparison can be completed. Until then the comparison is classified
    as "Information required".
  riskIntro: >-
    Gaps ranked by severity (high, medium, low), then by unit operation sequence.
    Ranking is by rule severity only; no likelihood or detectability scoring is applied.
  referencesIntro: >-
    Documents cited by the responders, interview sessions, and the versions of the
    content (catalog, question bank, comparison rules, templates) used to generate
    this draft. All document identifiers in the demonstration project are fictional.
  approvalIntro: >-
    Approval placeholders. This proof-of-concept tool does not capture electronic
    signatures and responder names are free text; the document is not attributable
    in a GMP sense.
  approvalRoles:
    - Author (MSAT)
    - Process owner, target site
    - Quality assurance
    - Regulatory affairs
  regulatoryStatement: >-
    Rows marked "Requires regulatory affairs assessment" may affect registered
    information. This tool does not determine the regulatory filing category of any
    change; that decision belongs to regulatory affairs.
  verificationStatement: >-
    Every value is shown as Unverified, Verified (by name, role and date) or
    Verification withdrawn. A verification is withdrawn automatically when the
    verified value or its status changes, including a target value that follows
    the source ("same as source") when the source value changes. See the
    Verification status section.
  verificationStatusIntro: >-
    Counts of the entries behind this document by verification state, for each
    section and side. "Not verifiable" means the entry is Unknown or not
    established, so there is no value to confirm yet. A verification covers the
    value and status at the time it was given; a later change withdraws it.
  identityStatement: >-
    Responder and verifier names and roles are free text typed into the tool.
    There is no login, authentication or electronic signature, so these identities
    are not attributable in a GMP sense. Where the verifier is the same person as
    the recorder, the entry is marked "same person as recorder"; that is a
    self-check, not an independent second check.
  sourceRegisterIntro: >-
    Every source held in the project register, with the entries that cite it. A
    source that no entry cites is shown as unused. Removing a source from the
    register returns every entry left without a source to "Not established"; the
    removed value is kept only in the change log.
  changeLogSummaryIntro: >-
    Number of recorded changes by type. The full change log, with who, when, and
    the values before and after each change, is available as a CSV export from the
    tool.
  changeLogReviewNote: >-
    Revisions issued and reviewer comments are not counted here. They are listed in
    Appendix C (Revision history) and Appendix D (Reviewer comments), and they appear
    in the full change log, so that issuing a revision or adding a comment does not
    change the content it refers to.
  revisionHistoryIntro: >-
    Revisions of this document recorded in the tool, oldest first. Each revision keeps
    a fingerprint of the document content at the time it was recorded, so the tool can
    show whether the content has changed since the latest revision. The Revision line
    at the top of the document says so.
  revisionStatement: >-
    A revision records that a draft of this document was saved or issued for review, by
    whom, when and why. Names are free text typed into the tool and the tool has no
    electronic signature, so a revision is not an approval and does not make the
    document controlled or approved for use.
  reviewerCommentsIntro: >-
    Comments recorded by reviewers, each tied to a section of this document and, where
    given, to one gap. A comment stays open until someone records how it was resolved,
    and a resolved comment can be reopened. Every response is listed with the person who
    gave it and the date. Names are free text typed into the tool, so comments are not
    attributable in a GMP sense.
