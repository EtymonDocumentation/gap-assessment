# The PRE-RECORDED "AI reading" of the example finished gap assessment (apps/web/public/examples/example-finished-gap-assessment.docx,
# made by packages/docx/src/example-gap.ts). Nothing here is live: no AI runs, no network call is made. The items were written in advance
# for this one fictional file, to show how an AI reader could propose gap items with the passage each one came from.
#
# Rules for every item (packages/docx/test/ai3-example.test.ts checks them):
#  - One item = one gap item = one question of the catalogue = one card on the review screen.
#  - question: the id of a catalogue question. source / target / shared: the answer for that unit, in the question's own words (the
#    label of a choice, or a number with its unit). Nothing is converted, defaulted or rated: what the passage does not say is left out
#    and stays "Not established" for the person.
#  - quotes: copied word for word from the example file. where: in words. why: one short plain line.
#  - Only items the fixed rules did NOT find (no overlap, no override).
#  - reject: true marks an item a careful reviewer should REJECT (kept for the tests and the walkthrough, never shown as an answer).
# A suggestion is never an answer: the person accepts or rejects each item.
catalog:
  id: ai-reading-example-gap-assessment
  version: 1.0.0

