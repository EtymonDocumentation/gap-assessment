# The PRE-RECORDED "AI reading" of the example finished TRD (apps/web/public/examples/example-finished-trd.docx, made by
# packages/docx/src/example-trd.ts). Nothing here is live: no AI runs, no network call is made. The suggestions were written in
# advance for this one fictional file, to show how an AI reader could propose values with the passage each one came from.
#
# Rules for every entry (packages/docx/test/ai1-example.test.ts checks them):
#  - field: a field id of the catalogue; it must be one the fixed rules did NOT find in the example file (no overlap, no override).
#  - value: in the field's own format (a number for a limit part, the unit text for a unit); it must appear in the quote.
#    Units are never converted: the unit is the one the passage states.
#  - quote: copied word for word from the example file.
#  - where: in words, so a person finds the passage; the review screen also focuses it in the document pane.
#  - why: one short plain line.
#  - reject: true marks a suggestion a careful reviewer should REJECT (kept for the tests and the walkthrough, never shown as an answer).
# A suggestion is never an answer: the person accepts or rejects each one.
catalog:
  id: ai-reading-example-trd
  version: 1.0.0

