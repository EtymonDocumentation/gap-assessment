# Catalog: unit operations, option lists, activities and categories.
# Editable without code changes. Bump catalog.version on any change.
#
# Stage-aware wording: a text may contain {{validated wording|other wording}}. The first variant is used only when the
# source program stage is established as commercial (process validated); every other case, including a stage that is
# not answered yet, uses the second. Quote any value that holds a marker when it sits inside a { } mapping.
catalog:
  id: fill-finish-catalog
  version: 1.7.0

# Stage groups of the Scope step: the broad stages of the fill-finish process, in process order. Every unit operation is in
# exactly one group (a content test checks it), so the Scope step can show them all and a group tick covers them all.
stageGroups:
  - key: drug_substance_in
    label: Drug substance in
    description: Shipping the drug substance to the fill site, then receiving and thawing it.
    unitOperations: [ds_shipping_inbound, ds_receipt_thaw]
  - key: formulation
    label: Formulation
    description: Buffer preparation, and pooling, compounding and dilution of the formulated bulk.
    unitOperations: [buffer_prep, compounding]
  - key: filtration
    label: Filtration
    description: Bioburden reduction and sterile filtration, including filter integrity testing.
    unitOperations: [bbr_filtration, sterile_filtration]
  - key: filling_closing
    label: Filling and closing
    description: Aseptic filling, stoppering, lyophilization and capping.
    unitOperations: [aseptic_filling, stoppering, lyophilization, capping]
  - key: inspection_packaging
    label: Inspection and packaging
    description: Visual inspection, bulk packaging, and labelling and secondary packaging.
    unitOperations: [visual_inspection, bulk_packaging, labeling_packaging]
  - key: shipping_out
    label: Shipping out
    description: Storage and shipping of the finished product from the fill site.
    unitOperations: [storage_shipping]

unitOperations:
  - key: ds_shipping_inbound
    label: Drug substance shipping to the fill site
    sequence: 5
    milestone: 5
    description: Transport of drug substance (frozen or liquid) from the drug substance site to the fill site, before receipt. Always part of the process; receipt and thaw follow it.
    topics:
      - { key: shipper, label: Shipper and configuration, description: "The shipper, its configuration and its qualification status." }
      - { key: transit, label: Transit time and temperature control, description: "Maximum transit time, transport temperature range and how the temperature is monitored." }
      - { key: lane, label: Lane qualification, description: "The shipping lane and the evidence that it is qualified." }
      - { key: custody, label: Chain of custody and excursions, description: "Custody records, the excursion allowance and how an excursion is handled." }
      - { key: procedures, label: Procedures, description: "Shipping and receipt procedures for the fill site." }
    items:
      - { coll: param, key: max_transit_time, label: Maximum transit time }
      - { coll: param, key: transport_temperature, label: Transport temperature }
      - { coll: param, key: excursion_allowance, label: Temperature excursion allowance }
      - { coll: equip, key: shipper, label: Drug substance shipping configuration }
      - { coll: ipc, key: transport_monitoring, label: Transport temperature monitoring }
      - { coll: ipc, key: custody, label: Chain of custody controls }
      - { coll: study, key: lane_qualification, label: Drug substance lane qualification }
      - { coll: doc, key: shipping_lane, label: Drug substance shipping lane }
      - { coll: doc, key: excursion_handling, label: Excursion handling }
      - { coll: doc, key: procedures, label: Drug substance shipping procedures }
  - key: ds_receipt_thaw
    label: Drug substance receipt and thaw
    sequence: 10
    milestone: 2
    description: Receipt, storage and (where frozen) thawing of drug substance before compounding.
    items:
      - { coll: param, key: storage_temperature, label: Drug substance storage temperature }
      - { coll: param, key: thaw_temperature, label: Thaw temperature }
      - { coll: param, key: thaw_duration, label: Thaw duration }
      - { coll: param, key: max_ambient_time, label: Maximum time at ambient temperature after thaw }
      - { coll: equip, key: thaw_unit, label: Thaw system }
      - { coll: equip, key: thaw_mixer, label: Post-thaw mixing }
      - { coll: equip, key: ds_storage, label: Drug substance storage unit }
      - { coll: mat, key: ds_container, label: Drug substance container }
      - { coll: mat, key: transfer_bag, label: Single-use transfer bag }
      - { coll: study, key: freeze_thaw, label: Freeze-thaw and thaw study }
      - { coll: study, key: thaw_homogeneity, label: Post-thaw homogeneity study }
      - { coll: doc, key: procedures, label: Receipt and thaw procedures }
  - key: buffer_prep
    label: Buffer preparation
    sequence: 15
    milestone: 4
    description: Preparation, thaw or receipt of the buffer or diluent used to dilute or formulate the product. Applies only when the program involves dilution.
    applicableWhen: { isTrue: scope.dilution }
    items:
      - { coll: param, key: batch_volume, label: Buffer batch volume }
      - { coll: param, key: mixing_speed, label: Buffer mixing speed }
      - { coll: param, key: mixing_time, label: Buffer mixing time }
      - { coll: param, key: max_hold_time, label: Buffer hold time }
      - { coll: param, key: storage_temperature, label: Buffer storage temperature }
      - { coll: param, key: thaw_temperature, label: Buffer thaw temperature }
      - { coll: param, key: thaw_duration, label: Buffer thaw duration }
      - { coll: equip, key: dispensing, label: Raw material dispensing and weighing }
      - { coll: equip, key: prep_vessel, label: Buffer preparation vessel }
      - { coll: equip, key: prep_mixer, label: Buffer mixer }
      - { coll: equip, key: thaw_unit, label: Buffer thaw system }
      - { coll: equip, key: thaw_mixer, label: Post-thaw buffer mixing }
      - { coll: mat, key: buffer, label: Buffer }
      - { coll: mat, key: buffer_bbr_filter, label: Buffer bioburden-reduction filter }
      - { coll: ipc, key: panel, label: Buffer in-process controls }
      - { coll: ipc, key: bioburden, label: Buffer pre-filtration bioburden }
      - { coll: ipc, key: integrity, label: Buffer BBR filter integrity testing }
      - { coll: study, key: hold_time, label: Buffer hold time study }
      - { coll: study, key: cleaning, label: Cleaning validation (buffer preparation equipment) }
      - { coll: doc, key: procedures, label: Buffer preparation procedures }
  - key: compounding
    label: Pooling, compounding and dilution
    sequence: 20
    milestone: 1
    description: Pooling of drug substance containers, dilution and formulation to the final bulk.
    items:
      - { coll: param, key: batch_size, label: Batch size (formulated bulk) }
      - { coll: param, key: mixing_speed, label: Mixing speed }
      - { coll: param, key: mixing_time, label: Mixing time }
      - { coll: param, key: temperature, label: Compounding temperature }
      - { coll: param, key: max_hold_time, label: Formulated bulk hold time }
      - { coll: param, key: target_concentration, label: Target protein concentration after dilution }
      - { coll: equip, key: vessel, label: Compounding vessel }
      - { coll: equip, key: mixer, label: Mixer }
      - { coll: mat, key: diluent, label: Buffer or diluent }
      - { coll: ipc, key: panel, label: Compounding in-process controls }
      - { coll: study, key: mixing, label: Mixing study }
      - { coll: study, key: hold_time, label: Formulated bulk hold time study }
      - { coll: study, key: cleaning, label: Cleaning validation (compounding equipment) }
      - { coll: doc, key: procedures, label: Compounding procedures }
  - key: bbr_filtration
    label: Bioburden reduction (BBR) filtration
    sequence: 25
    milestone: 4
    description: Bioburden-reduction filtration of the formulated bulk ahead of the sterilizing-grade filter. Some processes have no BBR step.
    items:
      - { coll: param, key: differential_pressure, label: BBR filtration differential pressure }
      - { coll: param, key: max_filtration_time, label: BBR filtration duration }
      - { coll: mat, key: bbr_filter, label: Bioburden-reduction filter }
      - { coll: ipc, key: integrity, label: BBR filter integrity testing }
      - { coll: ipc, key: bioburden, label: Pre-filtration bioburden (BBR inlet) }
      - { coll: study, key: bbr_validation, label: BBR filter validation }
      - { coll: doc, key: procedures, label: BBR filtration procedures }
  - key: sterile_filtration
    label: Sterile filtration
    sequence: 30
    milestone: 1
    description: Sterilizing-grade filtration of the formulated bulk, including redundant filtration and integrity testing.
    items:
      - { coll: param, key: differential_pressure, label: Filtration differential pressure }
      - { coll: param, key: max_filtration_time, label: Filtration duration }
      - { coll: mat, key: redundant_filter, label: Redundant sterilizing filter }
      - { coll: mat, key: sterilizing_filter, label: Sterilizing-grade filter }
      - { coll: mat, key: sua, label: Single-use filtration assembly }
      - { coll: equip, key: integrity_tester, label: Filter integrity tester }
      - { coll: ipc, key: integrity, label: Filter integrity testing }
      - { coll: ipc, key: pupsit, label: Pre-use post-sterilization integrity test (PUPSIT) }
      - { coll: ipc, key: bioburden, label: Bioburden before the sterilizing filter }
      - { coll: study, key: bacterial_retention, label: Bacterial retention validation }
      - { coll: study, key: filter_compatibility, label: Filter compatibility }
      - { coll: study, key: filter_extractables, label: Filter extractables }
      - { coll: study, key: sua_el, label: Single-use assembly E&L }
      - { coll: study, key: filter_sizing, label: Filter sizing }
      - { coll: study, key: integrity_validation, label: Integrity test validation (product-wet specification) }
      - { coll: study, key: pupsit_assembly, label: PUPSIT assembly qualification }
      - { coll: doc, key: pupsit_risk_assessment, label: PUPSIT risk assessment }
      - { coll: doc, key: procedures, label: Filtration procedures }
  - key: aseptic_filling
    label: Aseptic filling and stoppering
    sequence: 40
    milestone: 1
    description: Aseptic filling of the sterile bulk into the primary container and stopper placement.
    items:
      - { coll: param, key: fill_volume, label: Fill volume }
      - { coll: param, key: line_speed, label: Filling line speed }
      - { coll: param, key: max_fill_duration, label: Filling duration }
      - { coll: param, key: max_filtered_hold, label: Filtered (sterile) bulk hold time }
      - { coll: param, key: max_interventions, label: Maximum interventions per batch }
      - { coll: param, key: stopper_position, label: Plunger stopper position (depth from the reference) }
      - { coll: param, key: max_headspace, label: Headspace or air bubble size }
      - { coll: equip, key: filler, label: Filling machine }
      - { coll: equip, key: stopper_placement_unit, label: Plunger stopper placement unit }
      - { coll: equip, key: bulk_vessel, label: Sterile bulk holding vessel }
      - { coll: mat, key: container, label: Primary container }
      - { coll: mat, key: stopper, label: Stopper }
      - { coll: ipc, key: fill_check, label: Fill weight check }
      - { coll: ipc, key: stopper_position_check, label: Plunger stopper position check }
      - { coll: study, key: fill_accuracy, label: Fill accuracy study }
      - { coll: study, key: pump_product_impact, label: Pump product-quality impact assessment }
      - { coll: study, key: ppq, label: Process performance qualification }
      - { coll: study, key: aps, label: Aseptic process simulation (media fill) }
      - { coll: study, key: filtered_hold, label: Filtered bulk hold time study }
      - { coll: study, key: cleaning, label: Cleaning validation (filling equipment) }
      - { coll: study, key: container_el, label: Container closure E&L }
      - { coll: study, key: stopper_position_study, label: Plunger stopper position capability and device fit study }
      - { coll: doc, key: procedures, label: Filling procedures }
  - key: stoppering
    label: Stoppering (stand-alone)
    sequence: 45
    milestone: 2
    description: Stopper placement where performed as a separate operation (for example, partial stoppering before lyophilization).
    applicableWhen: { eq: [scope.dosage_form, lyophilized] }
    items:
      - { coll: param, key: max_open_time, label: Maximum time vials remain partially stoppered }
      - { coll: equip, key: stoppering_unit, label: Stoppering unit }
      - { coll: mat, key: stopper, label: Stopper (stand-alone stoppering) }
      - { coll: ipc, key: placement_check, label: Stopper placement check }
      - { coll: study, key: aps, label: Aseptic process simulation (media fill) }
      - { coll: study, key: stopper_machinability, label: Stopper machinability and compatibility }
      - { coll: doc, key: procedures, label: Stoppering procedures }
  - key: lyophilization
    label: Lyophilization
    sequence: 50
    milestone: 2
    description: Freeze-drying, including loading, cycle and stoppering under vacuum.
    applicableWhen: { eq: [scope.dosage_form, lyophilized] }
    items:
      - { coll: param, key: freeze_shelf_temp, label: Freezing shelf temperature }
      - { coll: param, key: primary_shelf_temp, label: Primary drying shelf temperature }
      - { coll: param, key: primary_pressure, label: Primary drying chamber pressure }
      - { coll: param, key: secondary_shelf_temp, label: Secondary drying shelf temperature }
      - { coll: param, key: secondary_time, label: Secondary drying time }
      - { coll: param, key: total_cycle_time, label: Total cycle time }
      - { coll: equip, key: lyophilizer, label: Lyophilizer }
      - { coll: equip, key: loading_system, label: Loading system }
      - { coll: mat, key: backfill_gas, label: Backfill gas }
      - { coll: ipc, key: residual_moisture, label: Residual moisture }
      - { coll: ipc, key: cycle_monitoring, label: Cycle monitoring }
      - { coll: study, key: cycle_verification, label: Lyophilization cycle verification }
      - { coll: study, key: aps_loading, label: APS coverage of lyophilizer loading }
      - { coll: doc, key: procedures, label: Lyophilization procedures }
  - key: capping
    label: Capping and crimping
    sequence: 60
    milestone: 1
    description: Application and crimping of the aluminium seal over the stopper.
    applicableWhen: { eq: [scope.presentation, vial] }
    items:
      - { coll: param, key: rsf, label: Residual seal force }
      - { coll: equip, key: capper, label: Capping machine }
      - { coll: mat, key: seal, label: Aluminium seal }
      - { coll: ipc, key: panel, label: Capping in-process controls }
      - { coll: study, key: cci, label: Container closure integrity }
      - { coll: study, key: rsf_cci_correlation, label: RSF–CCI correlation }
      - { coll: study, key: cci_method_validation, label: CCI test method validation }
      - { coll: doc, key: procedures, label: Capping procedures }
  - key: visual_inspection
    label: Visual inspection
    sequence: 70
    milestone: 2
    description: 100% visual inspection (manual, semi-automated or automated) and AQL.
    items:
      - { coll: param, key: inspection_rate, label: Inspection rate }
      - { coll: equip, key: inspection, label: Inspection method }
      - { coll: mat, key: defect_library, label: Defect library or kit }
      - { coll: ipc, key: aql, label: AQL sampling }
      - { coll: ipc, key: reject_rate, label: Reject rate monitoring }
      - { coll: ipc, key: defects, label: Defect classes inspected }
      - { coll: study, key: avi_qualification, label: Automated inspection qualification }
      - { coll: study, key: inspector_qualification, label: Inspector qualification }
      - { coll: doc, key: procedures, label: Inspection procedures }
  - key: bulk_packaging
    label: Bulk packaging
    sequence: 75
    milestone: 5
    description: Packing of the inspected containers into trays, tubs, nests or bags for hold and transport to labelling and packaging. Always part of the process, because unpackaged product cannot be labelled.
    topics:
      - { key: pack, label: Pack and container, description: "Bulk container type, units per container, seal or closure and bulk identity labels." }
      - { key: hold, label: Hold and temperature, description: "Bulk hold time, time out of refrigeration during packing and bulk storage." }
      - { key: checks, label: Counts and checks, description: "Reconciliation of inspected and packed units, container integrity and the check of the packed bulk." }
      - { key: procedures, label: Procedures, description: "Bulk packaging procedures." }
    items:
      - { coll: param, key: max_hold_time, label: Bulk hold time }
      - { coll: param, key: max_time_out_of_refrigeration, label: Maximum time out of refrigeration during bulk packing }
      - { coll: mat, key: bulk_container, label: Bulk container }
      - { coll: mat, key: bulk_product, label: Packed bulk product }
      - { coll: ipc, key: bulk_identity, label: Bulk container identity labelling }
      - { coll: ipc, key: bulk_reconciliation, label: Reconciliation of inspected and packed units }
      - { coll: ipc, key: container_integrity, label: Bulk container integrity check }
      - { coll: ipc, key: bulk_aql, label: Check of the packed bulk }
      - { coll: study, key: pack_verification, label: Bulk pack verification }
      - { coll: study, key: hold_time, label: Bulk hold time evidence }
      - { coll: study, key: tor_stability, label: Time-out-of-refrigeration evidence (bulk packing) }
      - { coll: doc, key: procedures, label: Bulk packaging procedures }
  - key: labeling_packaging
    label: Labeling and packaging
    sequence: 80
    milestone: 2
    description: Labeling, serialization and secondary packaging. Hidden for a side when labelling and secondary packaging are done at another site (site.labellingLocation).
    hiddenWhen: { eq: [site.labellingLocation, another_site] }
    items:
      - { coll: param, key: labeling_speed, label: Labeling speed }
      - { coll: param, key: max_time_out_of_refrigeration, label: Maximum time out of refrigeration during packaging }
      - { coll: equip, key: labeler, label: Labeling machine }
      - { coll: equip, key: serialization, label: Serialization and aggregation }
      - { coll: mat, key: secondary_pack, label: Secondary packaging }
      - { coll: ipc, key: label_reconciliation, label: Label reconciliation }
      - { coll: ipc, key: label_checks, label: Label and print checks }
      - { coll: study, key: serialization_verification, label: Serialization verification }
      - { coll: study, key: tor_stability, label: Time-out-of-refrigeration evidence }
      - { coll: doc, key: procedures, label: Labeling and packaging procedures }
  - key: storage_shipping
    label: Storage and shipping from the fill site
    sequence: 90
    milestone: 2
    description: Storage of the filled product at the fill site and shipping it away, either as unlabelled bulk to a labelling and packaging site or as labelled finished product to distribution. Holds the transport topics (shipper, lane qualification, temperature monitoring, transit time) for both cases.
    topics:
      - { key: storage, label: Storage at the fill site, description: "Storage condition, storage equipment and monitoring." }
      - { key: shipped, label: What is shipped and where to, description: "Unlabelled bulk or labelled finished product, and the destination." }
      - { key: transport, label: Transport and lane qualification, description: "Shipper, lane, transit time, excursions, temperature monitoring and the evidence that the lane is qualified." }
      - { key: procedures, label: Procedures, description: "Storage and shipping procedures." }
    items:
      - { coll: mat, key: shipped_product, label: What is shipped }
      - { coll: param, key: max_transit_time, label: Maximum transit time }
      - { coll: param, key: excursion_allowance, label: Temperature excursion allowance }
      - { coll: equip, key: storage_unit, label: Storage equipment }
      - { coll: equip, key: shipper, label: Shipping configuration }
      - { coll: mat, key: drug_product, label: Finished product storage }
      - { coll: ipc, key: storage_monitoring, label: Storage temperature monitoring }
      - { coll: ipc, key: shipping_monitoring, label: Shipping temperature monitoring }
      - { coll: study, key: shipping_validation, label: Shipping lane qualification }
      - { coll: study, key: stability_support, label: Stability support for storage condition }
      - { coll: doc, key: shipping_lane, label: Primary shipping lane }
      - { coll: doc, key: procedures, label: Storage and shipping procedures }

