activities:
  - { key: information_gathering, label: Information gathering, description: Establish the missing source or target information before the comparison can be completed. }
  - { key: risk_assessment_update, label: Risk assessment update, description: Update the process or contamination control risk assessment for the change. }
  - { key: engineering_run, label: Engineering run, description: Non-GMP run at the target to confirm equipment and process performance before PPQ. }
  - { key: scientific_justification, label: Scientific justification or characterization, description: Document a scientific rationale or perform characterization work to support the target range. }
  - { key: comparability_assessment, label: Comparability assessment, description: Assess product comparability between source and target processes. }
  - { key: ppq, label: Process performance qualification, description: PPQ at the target covering the changed element. }
  - { key: ppq_coverage_assessment, label: PPQ coverage assessment, description: Determine whether existing PPQ data cover the target condition or whether additional PPQ is needed. }
  - { key: mixing_study, label: Mixing study, description: Demonstrate homogeneity at the target batch volume and mixing configuration. }
  - { key: hold_time_study, label: Hold time study, description: Establish or extend the validated hold time for the target condition. }
  - { key: filter_bacterial_retention, label: Filter validation (bacterial retention), description: Bacterial retention validation for the target filter with product under worst-case conditions. }
  - { key: filter_compatibility, label: Filter compatibility study, description: Chemical compatibility of the target filter with the product. }
  - { key: extractables_leachables, label: Extractables and leachables assessment, description: E&L assessment of the target product-contact materials. }
  - { key: filter_sizing, label: Filter sizing confirmation, description: Confirm filter area and throughput for the target batch volume. }
  - { key: fill_accuracy_study, label: Fill accuracy study, description: Demonstrate fill accuracy and precision of the target filling system with product or a justified surrogate. }
  - { key: product_quality_impact, label: Product-quality impact assessment, description: "Assess shear and other stress effects of the target equipment on product quality (for example, subvisible particles, aggregation)." }
  - { key: media_fill, label: Aseptic process simulation (media fill), description: "Media fill covering the target line, duration, container format and interventions." }
  - { key: equipment_qualification, label: Equipment qualification, description: IQ/OQ/PQ of target equipment. }
  - { key: cci_study, label: Container closure integrity study, description: "CCI demonstration for the target container, closure, seal and capping process." }
  - { key: rsf_study, label: Residual seal force study, description: Establish the RSF range for the target capping equipment and correlate it with CCI. }
  - { key: environmental_monitoring_assessment, label: Environmental monitoring assessment, description: Assess the environmental monitoring programme for the target barrier and room classification. }
  - { key: csv_assessment, label: Computerized system assessment, description: Assess validation status and data flows of the target computerized systems. }
  - { key: procedure_update, label: Procedure update, description: Create or update procedures and batch record instructions at the target. }
  - { key: training, label: Training, description: Train target personnel on the changed or new procedures. }
  - { key: freeze_thaw_study, label: Freeze-thaw and thaw study, description: "Demonstrate that the target container, freezer and thaw method give acceptable product quality (for example, no aggregation or concentration gradient) across the validated freeze-thaw conditions." }
  - { key: lyo_cycle_verification, label: Lyophilization cycle verification, description: "Run and verify the lyophilization cycle at the target (shelf mapping, product temperature, residual moisture, cake appearance) to show the cycle performs as validated." }
  - { key: avi_qualification, label: Automated inspection qualification, description: "Qualify the automated inspection system against a defect kit (detection probability compared with manual inspection, for example a Knapp-style study) and set the rejection criteria." }
  - { key: inspector_qualification, label: Inspector qualification, description: "Qualify and periodically requalify manual inspectors against the defect library, with documented acceptance criteria." }
  - { key: shipping_validation, label: Shipping validation, description: "Qualify the shipping configuration and lane (thermal performance over the worst-case transit time and seasonal profiles)." }
  - { key: serialization_verification, label: Serialization verification, description: "Verify serialization and aggregation (code quality, data transfer and reporting) for the target markets." }
  - { key: stability_assessment, label: Stability assessment, description: "Assess whether available stability data support the target storage condition, time out of refrigeration or excursion allowance." }
  - { key: temperature_mapping, label: Temperature mapping, description: Map and qualify storage areas and monitoring points for the target storage condition. }

categories:
  - { key: equivalent, label: Equivalent, description: Source and target are the same. }
  - { key: within_validated_range, label: Within validated range, description: "Target differs but lies within the source PAR or validated range, or is covered by existing validation." }
  - { key: outside_validated_range, label: Outside validated range, description: "Target lies outside the source PAR or validated range, or is not covered by existing validation." }
  - { key: different_principle, label: Different operating principle or design, description: "Equipment, component or design differs in kind rather than in value." }
  - { key: scale_change, label: Scale change, description: Batch size or equipment capacity differs. }
  - { key: new_requirement, label: New requirement, description: "Present at target, absent from source." }
  - { key: removed_element, label: Removed element, description: "Present at source, absent from target." }
  - { key: information_required, label: Information required, description: The source or target value is unknown or not established. }
