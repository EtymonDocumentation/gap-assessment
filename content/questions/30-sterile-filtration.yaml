questions:
  - id: filt.presence
    section: uo.sterile_filtration
    prompt: Is sterile filtration of the bulk performed at this site?
    label: Sterile filtration performed
    why: Establishes whether the unit operation exists at each site.
    sides: paired
    binds: uo.sterile_filtration.presence
    input: { type: yes_no }

  - id: filt.prefilter
    section: uo.sterile_filtration
    prompt: Is a bioburden-reduction filter used upstream of the sterilizing filter?
    label: Bioburden-reduction filter used
    why: A bioburden-reduction filter protects the sterilizing filter and is part of the {{validated|current}} filtration train.
    sides: paired
    binds: uo.sterile_filtration.mat.prefilter.present
    input: { type: yes_no }

  - id: filt.redundant
    section: uo.sterile_filtration
    prompt: Is a redundant (second, in-series) sterilizing-grade filter used?
    label: Redundant sterilizing filter used
    why: Redundant filtration is a risk control in the {{validated|current}} design; removing or adding it changes the filtration train and its validation.
    sides: paired
    binds: uo.sterile_filtration.mat.redundant_filter.present
    input: { type: yes_no }

  - id: filt.membrane
    section: uo.sterile_filtration
    prompt: Sterilizing filter membrane material
    label: Sterilizing filter membrane
    why: Membrane chemistry affects protein adsorption, extractables and bacterial retention; validation is membrane-specific.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction
    input: { type: choice, optionsFrom: membrane }

  - id: filt.pore
    section: uo.sterile_filtration
    prompt: Sterilizing filter pore rating
    label: Sterilizing filter pore rating
    why: Pore rating is part of the {{validated|current}} filter design and is tied to the bacterial retention claim.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.poreRating
    input: { type: choice, optionsFrom: poreRating }

  - id: filt.supplier
    section: uo.sterile_filtration
    prompt: Sterilizing filter supplier
    label: Sterilizing filter supplier
    why: Filter validation data are specific to the supplier's membrane and device; a supplier change is a design change.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.supplier
    input: { type: text, placeholder: e.g. Filter Vendor A (fictional) }

  - id: filt.part
    section: uo.sterile_filtration
    prompt: Sterilizing filter part number or device format
    label: Sterilizing filter part number
    why: Device format and part number identify the {{validated|current}} filter; a different device may need bridging validation.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.partNumber
    input: { type: text, placeholder: e.g. FLT-0001-DEMO }

  - id: filt.bret
    section: uo.sterile_filtration
    parent: filt.part
    prompt: Does existing bacterial retention validation cover the target filter with this product under the target process conditions?
    label: Bacterial retention coverage (target filter)
    why: Bacterial retention must be demonstrated for the specific filter, product and worst-case process conditions.
    triggerNote: Asked because the target sterilizing filter differs from the source.
    sides: target
    binds: uo.sterile_filtration.study.bacterial_retention.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen: &filterChanged
      any:
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction }
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.poreRating }
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.supplier }
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.partNumber }

  - id: filt.compat
    section: uo.sterile_filtration
    parent: filt.part
    prompt: Does existing chemical compatibility data cover the target filter with this product?
    label: Filter compatibility coverage (target filter)
    why: Compatibility of the filter with the formulation must be shown for the specific membrane and device.
    triggerNote: Asked because the target sterilizing filter differs from the source.
    sides: target
    binds: uo.sterile_filtration.study.filter_compatibility.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen: *filterChanged

  - id: filt.extractables
    section: uo.sterile_filtration
    parent: filt.part
    prompt: Are extractables data available for the target filter under the target process conditions?
    label: Filter extractables data (target filter)
    why: Extractables profiles differ between membranes and devices and feed the product leachables assessment.
    triggerNote: Asked because the target sterilizing filter differs from the source.
    sides: target
    binds: uo.sterile_filtration.study.filter_extractables.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: *filterChanged

  - id: filt.area
    section: uo.sterile_filtration
    prompt: Effective filtration area of the sterilizing filter
    label: Sterilizing filter area
    why: Filter area relative to batch volume affects throughput, filtration time and the risk of filter blockage.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.area
    input: { type: quantity, units: ["cm²", "m²"] }

  - id: filt.sizing
    section: uo.sterile_filtration
    parent: filt.area
    prompt: Has filter sizing (throughput or Vmax) been confirmed for the target batch volume?
    label: Filter sizing for target batch volume
    why: A larger batch can exceed the {{validated|demonstrated}} filter loading; sizing must be confirmed for the target volume and filter area.
    triggerNote: Asked because the target batch size is larger than the source.
    sides: target
    binds: uo.sterile_filtration.study.filter_sizing.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: { increased: uo.compounding.param.batch_size.setPoint }

  - id: filt.sua
    section: uo.sterile_filtration
    prompt: Is a single-use filtration or transfer assembly (bags, tubing, capsule filter) used?
    label: Single-use filtration assembly used
    why: Single-use assemblies introduce new product-contact materials that require extractables/leachables and compatibility assessment.
    sides: paired
    binds: uo.sterile_filtration.mat.sua.present
    input: { type: yes_no }

  - id: filt.sua_supplier
    section: uo.sterile_filtration
    parent: filt.sua
    prompt: Single-use assembly supplier
    label: Single-use assembly supplier
    why: E&L data and assembly qualification are supplier- and design-specific.
    sides: target
    binds: uo.sterile_filtration.mat.sua.supplier
    input: { type: text, placeholder: e.g. SU Vendor B (fictional) }
    showWhen: { isTrue: target.uo.sterile_filtration.mat.sua.present }

  - id: filt.sua_el
    section: uo.sterile_filtration
    parent: filt.sua
    prompt: Is an extractables/leachables assessment available for the target single-use assembly in contact with this product?
    label: Single-use assembly E&L assessment
    why: New product-contact polymers can introduce leachables; an E&L assessment is expected before use in GMP manufacture.
    triggerNote: Asked because a single-use assembly is new at the target.
    sides: target
    binds: uo.sterile_filtration.study.sua_el.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen:
      all:
        - { isTrue: target.uo.sterile_filtration.mat.sua.present }
        - { not: { isTrue: source.uo.sterile_filtration.mat.sua.present } }
        - { answered: source.uo.sterile_filtration.mat.sua.present }

  - id: filt.pressure
    section: uo.sterile_filtration
    prompt: Filtration differential pressure
    label: Filtration differential pressure
    why: Differential pressure is a {{validated|tested}} condition of the bacterial retention study; operating above it is outside the {{validated|demonstrated}} range.
    sides: paired
    binds: uo.sterile_filtration.param.differential_pressure
    input: { type: parameter, units: [bar, mbar, kPa, psi] }

  - id: filt.integrity
    section: uo.sterile_filtration
    prompt: Which filter integrity tests are performed?
    label: Filter integrity tests
    why: Integrity testing confirms the sterilizing filter performed as {{validated|intended}}; EU GMP Annex 1 sets expectations for pre-use post-sterilization testing.
    sides: paired
    binds: uo.sterile_filtration.ipc.integrity.tests
    input: { type: multi_choice, optionsFrom: integrityTests }

  - id: filt.bioburden_limit
    section: uo.sterile_filtration
    prompt: Pre-filtration bioburden limit
    label: Pre-filtration bioburden limit
    why: The bioburden limit is tied to the bacterial retention challenge level; a higher target limit is outside the {{validated|demonstrated}} basis.
    sides: paired
    binds: uo.sterile_filtration.ipc.bioburden.limit
    input: { type: quantity, units: [CFU/100 mL, CFU/mL] }

  # ================================================================== milestone 3: validation studies
  # ---- filter validation (extension of bacterial retention)
  - id: filt.bret_conditions
    section: uo.sterile_filtration
    prompt: Do the test conditions of the bacterial retention study (differential pressure, temperature, flow and filtration time) cover the target worst case?
    label: Bacterial retention test conditions (target)
    why: Bacterial retention is demonstrated under worst-case conditions of the process. A higher pressure, larger volume or longer filtration time at the target can fall outside the conditions tested.
    triggerNote: Asked because the target filter, differential pressure or batch size differs from the source.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.bacterial_retention.conditions
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen:
      any:
        - *filterChanged
        - { increased: uo.sterile_filtration.param.differential_pressure.setPoint }
        - { increased: uo.compounding.param.batch_size.setPoint }

  - id: filt.integrity_method
    section: uo.sterile_filtration
    prompt: Filter integrity test method
    label: Filter integrity test method
    why: Bubble point, diffusive flow, water intrusion and pressure hold are different principles with their own specifications and wetting fluid. A change of method needs its own validated specification.
    tags: [m3]
    sides: paired
    binds: uo.sterile_filtration.ipc.integrity.method
    input: { type: choice, optionsFrom: integrityMethod }

  - id: filt.integrity_validation
    section: uo.sterile_filtration
    parent: filt.integrity_method
    prompt: Has the product-wet integrity test specification been established for the target filter and test method with this product?
    label: Product-wet integrity specification (target)
    why: The integrity limit for the product-wet filter can differ from the water-wet limit because of product surface tension and viscosity. It must be established with the target filter and method.
    triggerNote: Asked because the target filter or integrity test method differs from the source.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.integrity_validation.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen:
      any:
        - *filterChanged
        - { changed: uo.sterile_filtration.ipc.integrity.method }

  # ---- extractables and leachables (single-use assembly)
  - id: filt.sua_el_source
    section: uo.sterile_filtration
    parent: filt.sua_el
    prompt: What is the source of the extractables and leachables data for the target single-use assembly?
    label: Single-use assembly E&L data source
    why: Supplier extractables data describe model solvents and generic conditions. Product-specific conditions (formulation, temperature, contact time and surface area) decide whether a leachables risk remains.
    triggerNote: Asked because a single-use assembly is new at the target.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.sua_el.dataSource
    input: { type: choice, optionsFrom: elDataSource }
    showWhen: &suaNew
      all:
        - { isTrue: target.uo.sterile_filtration.mat.sua.present }
        - { not: { isTrue: source.uo.sterile_filtration.mat.sua.present } }
        - { answered: source.uo.sterile_filtration.mat.sua.present }

  - id: filt.sua_el_risk
    section: uo.sterile_filtration
    parent: filt.sua_el
    prompt: What is the outcome of the leachables risk assessment for the target single-use assembly with this product?
    label: Single-use assembly leachables risk outcome
    why: A toxicological assessment compares worst-case leachables with the safety threshold for the route of administration. A leachable above the threshold needs a product-specific study or a mitigation.
    triggerNote: Asked because a single-use assembly is new at the target.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.sua_el.riskOutcome
    input: { type: choice, optionsFrom: elRisk }
    showWhen: *suaNew

  # ---- equipment qualification
  - id: filt.tester_qual
    section: uo.sterile_filtration
    prompt: Qualification status of the filter integrity tester
    label: Integrity tester qualification status
    why: The automated integrity tester produces the result that releases the filtered bulk. It must be qualified and calibrated before GMP use.
    tags: [m3]
    sides: paired
    sameAsSource: false
    binds: uo.sterile_filtration.equip.integrity_tester.qualificationStatus
    input: { type: choice, optionsFrom: equipQualification }

  - id: filt.procedures
    section: uo.sterile_filtration
    prompt: Status of target procedures for filtration
    label: Target filtration procedures
    why: Filtration and integrity-test procedures must reflect the target filter train and equipment.
    sides: target
    binds: uo.sterile_filtration.doc.procedures.status
    input: { type: choice, optionsFrom: procedureStatus }
