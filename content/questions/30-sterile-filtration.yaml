questions:
  - id: filt.presence
    section: uo.sterile_filtration
    prompt: Is sterile (sterilizing-grade) filtration of the bulk performed at this site?
    label: Sterile filtration performed
    why: Establishes whether the unit operation exists at each site.
    sides: paired
    binds: uo.sterile_filtration.presence
    input: { type: yes_no }

  - id: filt.redundant
    section: uo.sterile_filtration
    prompt: Is a redundant (second, in-series) sterilizing-grade filter used?
    label: Redundant sterilizing filter used
    why: Redundant filtration is a risk control in the {{validated|current}} design; removing or adding it changes the filtration train and its validation.
    sides: paired
    binds: uo.sterile_filtration.mat.redundant_filter.present
    input: { type: yes_no }

  - id: filt.membrane
    section: uo.sterile_filtration
    prompt: Sterilizing filter membrane material
    label: Sterilizing filter membrane
    why: Membrane chemistry affects protein adsorption, extractables and bacterial retention; validation is membrane-specific.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction
    input: { type: choice, optionsFrom: membrane }

  - id: filt.pore
    section: uo.sterile_filtration
    prompt: Sterilizing filter pore rating
    label: Sterilizing filter pore rating
    why: Pore rating is part of the {{validated|current}} filter design and is tied to the bacterial retention claim.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.poreRating
    input: { type: choice, optionsFrom: poreRating }

  - id: filt.supplier
    section: uo.sterile_filtration
    prompt: Sterilizing filter supplier
    label: Sterilizing filter supplier
    why: Filter validation data are specific to the supplier's membrane and device; a supplier change is a design change.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.supplier
    input: { type: text, placeholder: e.g. Filter Vendor A (fictional) }

  - id: filt.part
    section: uo.sterile_filtration
    prompt: Sterilizing filter part number or device format
    label: Sterilizing filter part number
    why: Device format and part number identify the {{validated|current}} filter; a different device may need bridging validation.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.partNumber
    input: { type: text, placeholder: e.g. FLT-0001-DEMO }

  - id: filt.bret
    section: uo.sterile_filtration
    parent: filt.part
    prompt: Does existing bacterial retention validation cover the RU filter with this product under the RU process conditions?
    label: Bacterial retention coverage (RU filter)
    why: Bacterial retention must be demonstrated for the specific filter, product and worst-case process conditions.
    triggerNote: Asked because the RU sterilizing filter differs from the SU.
    sides: target
    binds: uo.sterile_filtration.study.bacterial_retention.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen: &filterChanged
      any:
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.materialOfConstruction }
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.poreRating }
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.supplier }
        - { changed: uo.sterile_filtration.mat.sterilizing_filter.partNumber }

  - id: filt.compat
    section: uo.sterile_filtration
    parent: filt.part
    prompt: Does existing chemical compatibility data cover the RU filter with this product?
    label: Filter compatibility coverage (RU filter)
    why: Compatibility of the filter with the formulation must be shown for the specific membrane and device.
    triggerNote: Asked because the RU sterilizing filter differs from the SU.
    sides: target
    binds: uo.sterile_filtration.study.filter_compatibility.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen: *filterChanged

  - id: filt.extractables
    section: uo.sterile_filtration
    parent: filt.part
    prompt: Are extractables data available for the RU filter under the RU process conditions?
    label: Filter extractables data (RU filter)
    why: Extractables profiles differ between membranes and devices and feed the product leachables assessment.
    triggerNote: Asked because the RU sterilizing filter differs from the SU.
    sides: target
    binds: uo.sterile_filtration.study.filter_extractables.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: *filterChanged

  - id: filt.area
    section: uo.sterile_filtration
    prompt: Effective filtration area of the sterilizing filter
    label: Sterilizing filter area
    why: Filter area relative to batch volume affects throughput, filtration time and the risk of filter blockage.
    sides: paired
    binds: uo.sterile_filtration.mat.sterilizing_filter.area
    input: { type: quantity, units: ["cm²", "m²"] }

  - id: filt.sizing
    section: uo.sterile_filtration
    parent: filt.area
    prompt: Has filter sizing (throughput or Vmax) been confirmed for the RU batch volume?
    label: Filter sizing for RU batch volume
    why: A larger batch can exceed the {{validated|demonstrated}} filter loading; sizing must be confirmed for the RU volume and filter area.
    triggerNote: Asked because the RU batch size is larger than the SU.
    sides: target
    binds: uo.sterile_filtration.study.filter_sizing.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: { increased: uo.compounding.param.batch_size.setPoint }

  - id: filt.sua
    section: uo.sterile_filtration
    prompt: Is a single-use filtration or transfer assembly (bags, tubing, capsule filter) used?
    label: Single-use filtration assembly used
    why: Single-use assemblies introduce new product-contact materials that require extractables/leachables and compatibility assessment.
    sides: paired
    binds: uo.sterile_filtration.mat.sua.present
    input: { type: yes_no }

  - id: filt.sua_supplier
    section: uo.sterile_filtration
    parent: filt.sua
    prompt: Single-use assembly supplier
    label: Single-use assembly supplier
    why: E&L data and assembly qualification are supplier- and design-specific.
    sides: target
    binds: uo.sterile_filtration.mat.sua.supplier
    input: { type: text, placeholder: e.g. SU Vendor B (fictional) }
    showWhen: { isTrue: target.uo.sterile_filtration.mat.sua.present }

  - id: filt.sua_el
    section: uo.sterile_filtration
    parent: filt.sua
    prompt: Is an extractables/leachables assessment available for the RU single-use assembly in contact with this product?
    label: Single-use assembly E&L assessment
    why: New product-contact polymers can introduce leachables; an E&L assessment is expected before use in GMP manufacture.
    triggerNote: Asked because a single-use assembly is new at the RU.
    sides: target
    binds: uo.sterile_filtration.study.sua_el.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen:
      all:
        - { isTrue: target.uo.sterile_filtration.mat.sua.present }
        - { not: { isTrue: source.uo.sterile_filtration.mat.sua.present } }
        - { answered: source.uo.sterile_filtration.mat.sua.present }

  - id: filt.pressure
    section: uo.sterile_filtration
    prompt: Filtration differential pressure
    label: Filtration differential pressure
    why: Differential pressure is a {{validated|tested}} condition of the bacterial retention study; operating above it is outside the {{validated|demonstrated}} range.
    sides: paired
    binds: uo.sterile_filtration.param.differential_pressure
    input: { type: parameter, units: [bar, mbar, kPa, psi] }

  - id: filt.integrity
    section: uo.sterile_filtration
    prompt: Which filter integrity tests are performed?
    label: Filter integrity tests
    why: Integrity testing confirms the sterilizing filter performed as {{validated|intended}}; the pre-use post-sterilization test (PUPSIT) is asked separately below.
    sides: paired
    binds: uo.sterile_filtration.ipc.integrity.tests
    input: { type: multi_choice, optionsFrom: integrityTests }

  - id: filt.bioburden_limit
    section: uo.sterile_filtration
    prompt: Bioburden limit of the bulk before the sterilizing filter
    label: Bioburden limit before the sterilizing filter
    why: The bioburden limit before the sterilizing filter is tied to the bacterial retention challenge level; a higher RU limit is outside the {{validated|demonstrated}} basis. Where a BBR filter is used, its inlet limit is asked in the BBR filtration section.
    sides: paired
    binds: uo.sterile_filtration.ipc.bioburden.limit
    input: { type: quantity, units: [CFU/100 mL, CFU/mL] }

  # ---- PUPSIT (pre-use post-sterilization integrity test)
  - id: filt.pupsit
    section: uo.sterile_filtration
    prompt: Is a pre-use post-sterilization integrity test (PUPSIT) performed on the sterilizing filter?
    label: PUPSIT performed
    why: EU GMP Annex 1 (2022), point 8.87, expects the integrity of the sterilized filter assembly to be verified before use, and PUPSIT is the usual way to detect a filter damaged or blocked during sterilization or assembly. Not performing it needs a documented risk assessment. Answers are compared between SU and RU.
    sides: paired
    binds: uo.sterile_filtration.ipc.pupsit.status
    input: { type: choice, optionsFrom: pupsitStatus }

  - id: filt.pupsit_method
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: PUPSIT test method
    label: PUPSIT test method
    why: Bubble point, diffusive flow, water intrusion and pressure hold work on different principles and have their own specifications. A change of PUPSIT method needs its own validated specification.
    triggerNote: Asked because PUPSIT is performed at this site.
    sides: paired
    binds: uo.sterile_filtration.ipc.pupsit.method
    input: { type: choice, optionsFrom: integrityMethod }
    showWhen: &pupsitDone { eq: [uo.sterile_filtration.ipc.pupsit.status, performed] }

  - id: filt.pupsit_fluid
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: Which fluid is used to wet the filter for PUPSIT?
    label: PUPSIT wetting fluid
    why: The wetting fluid decides the integrity test limit, the flush volume and the contact of the product with the filter before filtration. A different fluid needs its own specification.
    triggerNote: Asked because PUPSIT is performed at this site.
    sides: paired
    binds: uo.sterile_filtration.ipc.pupsit.wettingFluid
    input: { type: choice, optionsFrom: pupsitFluid }
    showWhen: *pupsitDone

  - id: filt.pupsit_downstream
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: How is the sterile downstream side protected during PUPSIT?
    label: PUPSIT downstream protection
    why: PUPSIT is run with the upstream side wet and the downstream side open to the test. A manual connection on the sterile side can compromise the sterile boundary, so the approach is part of the contamination control strategy.
    triggerNote: Asked because PUPSIT is performed at this site.
    sides: paired
    binds: uo.sterile_filtration.ipc.pupsit.downstreamProtection
    input: { type: choice, optionsFrom: pupsitDownstream }
    showWhen: *pupsitDone

  - id: filt.pupsit_assembly
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: Is the RU PUPSIT assembly design qualified and shown not to compromise the sterile boundary?
    label: PUPSIT assembly qualification (RU)
    why: The PUPSIT assembly (tubing, waste or drain bag, connections) sits on the sterile side. Its design must be qualified, and its effect on the sterile boundary shown, before it is used in GMP manufacture.
    triggerNote: Asked because PUPSIT is performed at the RU.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.pupsit_assembly.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: { eq: [target.uo.sterile_filtration.ipc.pupsit.status, performed] }

  - id: filt.pupsit_flush
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: Are the PUPSIT flush or wetting volume and its effect on the product (dilution, yield, discard volume) defined?
    label: PUPSIT flush volume and product effect (RU)
    why: Wetting the filter for PUPSIT leaves fluid in the filter that mixes with or displaces the product. The volume and its effect on dilution, yield and discard must be defined for the RU process.
    triggerNote: Asked because PUPSIT is performed at the RU.
    sides: target
    binds: uo.sterile_filtration.ipc.pupsit.flushVolume
    input: { type: choice, optionsFrom: pupsitFlush }
    showWhen: { eq: [target.uo.sterile_filtration.ipc.pupsit.status, performed] }

  - id: filt.pupsit_basis
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: What is the basis of the justification for not performing PUPSIT?
    label: PUPSIT justification basis
    why: A decision not to perform PUPSIT must rest on a documented risk assessment. The basis shows what evidence supports it; the tool does not judge whether it is sufficient.
    triggerNote: Asked because PUPSIT is not performed at this site and a justification is recorded.
    sides: paired
    binds: uo.sterile_filtration.ipc.pupsit.justificationBasis
    input: { type: multi_choice, optionsFrom: pupsitJustification }
    showWhen: { eq: [uo.sterile_filtration.ipc.pupsit.status, not_performed_justified] }

  - id: filt.pupsit_ra
    section: uo.sterile_filtration
    parent: filt.pupsit
    prompt: What is the status of the RU risk assessment document that justifies not performing PUPSIT?
    label: PUPSIT risk assessment status (RU)
    why: The justification is only as good as its documented risk assessment. A draft or missing document leaves the justification open.
    triggerNote: Asked because PUPSIT is not performed at the RU and a justification is recorded.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.doc.pupsit_risk_assessment.status
    input: { type: choice, optionsFrom: riskAssessmentStatus }
    showWhen: { eq: [target.uo.sterile_filtration.ipc.pupsit.status, not_performed_justified] }

  # ================================================================== milestone 3: validation studies
  # ---- filter validation (extension of bacterial retention)
  - id: filt.bret_conditions
    section: uo.sterile_filtration
    prompt: Do the test conditions of the bacterial retention study (differential pressure, temperature, flow and filtration time) cover the RU worst case?
    label: Bacterial retention test conditions (RU)
    why: Bacterial retention is demonstrated under worst-case conditions of the process. A higher pressure, larger volume or longer filtration time at the RU can fall outside the conditions tested.
    triggerNote: Asked because the RU filter, differential pressure or batch size differs from the SU.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.bacterial_retention.conditions
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen:
      any:
        - *filterChanged
        - { increased: uo.sterile_filtration.param.differential_pressure.setPoint }
        - { increased: uo.compounding.param.batch_size.setPoint }

  - id: filt.integrity_method
    section: uo.sterile_filtration
    prompt: Filter integrity test method
    label: Filter integrity test method
    why: Bubble point, diffusive flow, water intrusion and pressure hold are different principles with their own specifications and wetting fluid. A change of method needs its own validated specification.
    tags: [m3]
    sides: paired
    binds: uo.sterile_filtration.ipc.integrity.method
    input: { type: choice, optionsFrom: integrityMethod }

  - id: filt.integrity_validation
    section: uo.sterile_filtration
    parent: filt.integrity_method
    prompt: Has the product-wet integrity test specification been established for the RU filter and test method with this product?
    label: Product-wet integrity specification (RU)
    why: The integrity limit for the product-wet filter can differ from the water-wet limit because of product surface tension and viscosity. It must be established with the RU filter and method.
    triggerNote: Asked because the RU filter or integrity test method differs from the SU.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.integrity_validation.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen:
      any:
        - *filterChanged
        - { changed: uo.sterile_filtration.ipc.integrity.method }

  # ---- extractables and leachables (single-use assembly)
  - id: filt.sua_el_source
    section: uo.sterile_filtration
    parent: filt.sua_el
    prompt: What is the source of the extractables and leachables data for the RU single-use assembly?
    label: Single-use assembly E&L data source
    why: Supplier extractables data describe model solvents and generic conditions. Product-specific conditions (formulation, temperature, contact time and surface area) decide whether a leachables risk remains.
    triggerNote: Asked because a single-use assembly is new at the RU.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.sua_el.dataSource
    input: { type: choice, optionsFrom: elDataSource }
    showWhen: &suaNew
      all:
        - { isTrue: target.uo.sterile_filtration.mat.sua.present }
        - { not: { isTrue: source.uo.sterile_filtration.mat.sua.present } }
        - { answered: source.uo.sterile_filtration.mat.sua.present }

  - id: filt.sua_el_risk
    section: uo.sterile_filtration
    parent: filt.sua_el
    prompt: What is the outcome of the leachables risk assessment for the RU single-use assembly with this product?
    label: Single-use assembly leachables risk outcome
    why: A toxicological assessment compares worst-case leachables with the safety threshold for the route of administration. A leachable above the threshold needs a product-specific study or a mitigation.
    triggerNote: Asked because a single-use assembly is new at the RU.
    tags: [m3]
    sides: target
    binds: uo.sterile_filtration.study.sua_el.riskOutcome
    input: { type: choice, optionsFrom: elRisk }
    showWhen: *suaNew

  # ---- equipment qualification
  - id: filt.tester_qual
    section: uo.sterile_filtration
    prompt: Qualification status of the filter integrity tester
    label: Integrity tester qualification status
    why: The automated integrity tester produces the result that releases the filtered bulk. It must be qualified and calibrated before GMP use.
    tags: [m3]
    sides: paired
    sameAsSource: false
    binds: uo.sterile_filtration.equip.integrity_tester.qualificationStatus
    input: { type: choice, optionsFrom: equipQualification }

  - id: filt.procedures
    section: uo.sterile_filtration
    prompt: Status of RU procedures for filtration
    label: RU filtration procedures
    why: Filtration and integrity-test procedures must reflect the RU filter train and equipment.
    sides: target
    binds: uo.sterile_filtration.doc.procedures.status
    input: { type: choice, optionsFrom: procedureStatus }
