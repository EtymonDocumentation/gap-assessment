questions:
  - id: cap.presence
    section: uo.capping
    prompt: Is capping and crimping performed at this site?
    label: Capping performed
    why: Establishes whether the unit operation exists at each site.
    sides: paired
    binds: uo.capping.presence
    input: { type: yes_no }

  - id: cap.principle
    section: uo.capping
    prompt: Capping machine operating principle
    label: Capping principle
    why: The capping mechanism determines how seal force is applied and therefore container closure integrity; a change is a design change.
    sides: paired
    binds: uo.capping.equip.capper.operatingPrinciple
    input: { type: choice, optionsFrom: cappingPrinciple }

  - id: cap.seal
    section: uo.capping
    prompt: Aluminium seal supplier and part number
    label: Aluminium seal
    why: Seal dimensions and material affect crimp quality and CCI for the container-closure system.
    sides: paired
    binds: uo.capping.mat.seal.partNumber
    input: { type: text, placeholder: "e.g. Seal Vendor E, SEAL-20-DEMO" }

  - id: cap.cci
    section: uo.capping
    parent: cap.principle
    prompt: Is container closure integrity demonstrated for the target container, stopper, seal and capping process?
    label: CCI for target configuration
    why: CCI is specific to the container-closure combination and the capping process; changes to either require CCI evidence.
    triggerNote: Asked because the capping equipment, seal or stopper differs from the source.
    sides: target
    binds: uo.capping.study.cci.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: &closureChanged
      any:
        - { changed: uo.capping.equip.capper.operatingPrinciple }
        - { changed: uo.capping.mat.seal.partNumber }
        - { changed: uo.aseptic_filling.mat.stopper.partNumber }

  - id: cap.rsf_correlation
    section: uo.capping
    parent: cap.principle
    prompt: Has the residual seal force range been correlated with CCI for the target capping equipment?
    label: RSF–CCI correlation (target)
    why: An RSF range is meaningful only when correlated with CCI on the equipment that applies the seal.
    triggerNote: Asked because the capping equipment, seal or stopper differs from the source.
    sides: target
    binds: uo.capping.study.rsf_cci_correlation.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen: *closureChanged

  - id: cap.rsf
    section: uo.capping
    prompt: Residual seal force (RSF)
    label: Residual seal force
    why: RSF is an indicator of crimp quality and CCI; the target range is compared with the source {{validated|demonstrated}} range.
    sides: paired
    binds: uo.capping.param.rsf
    input: { type: parameter, units: [N, lbf] }

  - id: cap.environment
    section: uo.capping
    prompt: Capping environment
    label: Capping environment
    why: EU GMP Annex 1 sets expectations for protecting stoppered vials until crimped; the capping environment is part of the contamination control strategy.
    sides: paired
    binds: uo.capping.equip.capper.type
    input: { type: choice, optionsFrom: cappingEnvironment }

  - id: cap.ipc
    section: uo.capping
    prompt: Which in-process controls are performed at capping?
    label: Capping in-process controls
    why: Crimp inspection and RSF testing detect defective seals; removing a control changes the control strategy.
    sides: paired
    binds: uo.capping.ipc.panel.tests
    input: { type: multi_choice, optionsFrom: capIpc }

  # ================================================================== milestone 3: validation studies
  # ---- container closure integrity (CCI)
  - id: cap.cci_method
    section: uo.capping
    prompt: Container closure integrity test method used for validation and routine testing
    label: CCI test method
    why: Deterministic physical methods (helium leak, HVLD, vacuum or pressure decay) and probabilistic methods (dye or microbial ingress) detect leaks by different principles and with different sensitivity. A change of method is a change in principle.
    tags: [m3]
    sides: paired
    binds: uo.capping.study.cci.method
    input: { type: choice, optionsFrom: cciMethod }

  - id: cap.cci_sensitivity
    section: uo.capping
    prompt: Smallest leak size the CCI test method reliably detects (limit of detection)
    label: CCI method detection limit
    why: The method must be sensitive enough for the maximum allowable leakage limit of the product. A less sensitive method at the target (a larger smallest detectable leak) does not support the same integrity claim.
    help: Enter the {{validated|demonstrated}} leak size in micrometres (equivalent hole diameter).
    tags: [m3]
    sideLabels: { source: "{{Validated|Demonstrated}} detection limit", target: Target method detection limit }
    sides: paired
    binds: uo.capping.study.cci.sensitivity
    input: { type: quantity, units: [µm, mm] }

  - id: cap.cci_method_validation
    section: uo.capping
    parent: cap.cci_method
    prompt: Has the target CCI test method been validated for this container and closure (sensitivity, positive and negative controls, repeatability)?
    label: CCI method validation (target)
    why: A CCI method must be shown fit for purpose with this container-closure system before its results can support the integrity claim.
    triggerNote: Asked because the CCI test method differs from the source.
    tags: [m3]
    sides: target
    binds: uo.capping.study.cci_method_validation.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen: { changed: uo.capping.study.cci.method }

  - id: cap.cci_lifecycle
    section: uo.capping
    prompt: Is CCI demonstrated over shelf life and after shipping and storage stress (for example temperature cycling or vibration) for the target configuration?
    label: CCI over shelf life and distribution (target)
    why: Integrity at release does not show that the closure keeps its seal through storage temperature change and transport. Frozen or active-container shipping and a new container or seal can change that stress.
    triggerNote: Asked because the container format, capping method or shipping configuration differs from the source.
    tags: [m3]
    sides: target
    binds: uo.capping.study.cci.lifecycle
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen:
      any:
        - { changed: uo.aseptic_filling.mat.container.format }
        - { changed: uo.capping.study.cci.method }
        - { changed: uo.storage_shipping.equip.shipper.operatingPrinciple }
        - { changed: uo.capping.equip.capper.operatingPrinciple }

  # ---- equipment qualification
  - id: cap.capper_qual
    section: uo.capping
    prompt: Qualification status of the capping machine
    label: Capper qualification status
    why: Equipment used for GMP manufacture must be qualified. A target capper that is not yet qualified, or is only planned, is a qualification requirement for the transfer.
    tags: [m3]
    sides: paired
    sameAsSource: false
    binds: uo.capping.equip.capper.qualificationStatus
    input: { type: choice, optionsFrom: equipQualification }

  - id: cap.procedures
    section: uo.capping
    prompt: Status of target procedures for capping
    label: Target capping procedures
    why: Capping set-up and inspection procedures must reflect the target equipment.
    sides: target
    binds: uo.capping.doc.procedures.status
    input: { type: choice, optionsFrom: procedureStatus }
