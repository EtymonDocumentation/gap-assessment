questions:
  - id: comp.presence
    section: uo.compounding
    prompt: Is pooling, compounding or dilution performed at this site?
    label: Compounding performed
    why: Establishes whether the unit operation exists at each site. A step present at only one site is a new or removed element.
    sides: paired
    binds: uo.compounding.presence
    input: { type: yes_no }

  - id: comp.batch_size
    section: uo.compounding
    prompt: Batch size (formulated bulk volume)
    label: Batch size
    why: Batch size drives mixing, hold time, filter sizing and filling duration. A change outside the {{validated|demonstrated}} batch size range is a scale change for the {{validated|current}} state.
    help: SU — nominal batch size and the batch size range covered by PPQ. RU — planned nominal batch size and planned range.
    sides: paired
    binds: uo.compounding.param.batch_size
    input:
      type: parameter
      units: [L, mL]
      sourceFields: [setPoint, par, rangeBasis]
      targetFields: [setPoint, nor]

  - id: comp.mixing_coverage
    section: uo.compounding
    parent: comp.batch_size
    prompt: What batch volume range does the SU mixing study cover?
    label: Mixing study coverage
    why: Homogeneity is demonstrated only over the volumes studied. A larger batch may need a new or extended mixing study.
    triggerNote: Asked because the RU batch size is larger than the SU.
    sides: source
    binds: uo.compounding.study.mixing.coverage
    input: { type: range, units: [L, mL] }
    showWhen: { increased: uo.compounding.param.batch_size.setPoint }

  - id: comp.hold_time
    section: uo.compounding
    parent: comp.batch_size
    prompt: Maximum hold time of the formulated bulk before filtration
    label: Bulk hold time (maximum)
    why: Larger batches usually take longer to compound and filter. The RU maximum must stay within the {{validated|demonstrated}} hold time, or a hold time study is needed.
    triggerNote: Asked because the RU batch size is larger than the SU, or because compounding is new at the RU.
    sideLabels: { source: "{{Validated|Demonstrated}} maximum hold time", target: Planned maximum hold time }
    sides: paired
    binds: uo.compounding.param.max_hold_time.max
    input: { type: quantity, units: [h, min, d] }
    showWhen:
      any:
        - { increased: uo.compounding.param.batch_size.setPoint }
        # Compounding with no SU counterpart has no demonstrated hold time, so the planned maximum is asked for there too.
        - all:
            - { isTrue: target.uo.compounding.presence }
            - { answered: source.uo.compounding.presence }
            - { not: { isTrue: source.uo.compounding.presence } }

  - id: comp.vessel_type
    section: uo.compounding
    prompt: Compounding vessel type
    label: Vessel type
    why: Vessel material and construction affect product contact, mixing behaviour and cleaning or single-use E&L requirements.
    sides: paired
    binds: uo.compounding.equip.vessel.type
    input: { type: choice, optionsFrom: vesselType }

  - id: comp.vessel_capacity
    section: uo.compounding
    prompt: Compounding vessel working capacity
    label: Vessel working capacity
    why: Vessel capacity relative to batch volume affects mixing efficiency, minimum stir volume and heat transfer.
    sides: paired
    binds: uo.compounding.equip.vessel.capacity
    input: { type: quantity, units: [L, mL] }

  - id: comp.mixer
    section: uo.compounding
    prompt: Mixer operating principle
    label: Mixer principle
    why: Mixing principle determines shear, foaming and homogeneity; a change is a design change rather than a parameter adjustment.
    sides: paired
    binds: uo.compounding.equip.mixer.operatingPrinciple
    input: { type: choice, optionsFrom: mixerPrinciple }

  - id: comp.mixing_demonstrated
    section: uo.compounding
    parent: comp.mixer
    prompt: Has mixing effectiveness (homogeneity) been demonstrated for the RU vessel and mixer at the planned batch volume?
    label: RU mixing effectiveness data
    why: SU mixing data do not transfer to a different mixer or vessel design; homogeneity must be demonstrated for the RU configuration.
    triggerNote: Asked because the RU mixer or vessel differs from the SU.
    sides: target
    binds: uo.compounding.study.mixing.status
    input: { type: choice, optionsFrom: evidenceAvailability }
    showWhen:
      any:
        - { changed: uo.compounding.equip.mixer.operatingPrinciple }
        - { changed: uo.compounding.equip.vessel.type }

  - id: comp.mixing_speed
    section: uo.compounding
    prompt: Mixing speed
    label: Mixing speed
    why: Mixing speed affects homogeneity and shear stress on the protein. The RU operating range is compared with the SU proven acceptable range.
    sides: paired
    binds: uo.compounding.param.mixing_speed
    input: { type: parameter, units: [rpm] }

  - id: comp.mixing_time
    section: uo.compounding
    prompt: Mixing time
    label: Mixing time
    why: Mixing time must be sufficient for homogeneity without excessive exposure to shear or air-liquid interface.
    sides: paired
    binds: uo.compounding.param.mixing_time
    input: { type: parameter, units: [min, h] }

  - id: comp.temperature
    section: uo.compounding
    prompt: Compounding temperature
    label: Compounding temperature
    why: Product temperature during compounding affects stability; the RU range is compared with the SU {{validated|demonstrated}} range.
    sides: paired
    binds: uo.compounding.param.temperature
    input: { type: parameter, units: ["°C"] }

  - id: comp.ipc
    section: uo.compounding
    prompt: Which in-process controls are performed on the formulated bulk?
    label: Compounding in-process controls
    why: In-process controls confirm the bulk meets requirements before filtration. Removing a control, or adding one, changes the control strategy.
    sides: paired
    binds: uo.compounding.ipc.panel.tests
    input: { type: multi_choice, optionsFrom: compoundingIpc }

  # ---- dilution only (shown when scope.dilution is yes)
  - id: comp.diluent
    section: uo.compounding
    prompt: Which buffer or diluent is used to dilute or formulate the product?
    label: Buffer or diluent used
    why: The buffer or diluent composition decides the final formulation and its compatibility with the product. A different buffer is a formulation change that needs regulatory affairs assessment.
    triggerNote: Asked because the program involves dilution or formulation with a buffer.
    sides: paired
    binds: uo.compounding.mat.diluent.description
    input: { type: text, placeholder: e.g. Formulation buffer FB-1 (fictional) }
    showWhen: &dilution { isTrue: scope.dilution }

  - id: comp.diluent_volume
    section: uo.compounding
    prompt: Buffer or diluent volume added per batch
    label: Buffer or diluent volume
    why: The volume of buffer added, with the drug substance volume, sets the dilution ratio. A change in volume changes the final concentration and the batch size.
    triggerNote: Asked because the program involves dilution or formulation with a buffer.
    sides: paired
    binds: uo.compounding.mat.diluent.volume
    input: { type: quantity, units: [L, mL] }
    showWhen: *dilution

  - id: comp.target_conc
    section: uo.compounding
    prompt: Target protein concentration after dilution
    label: Target concentration after dilution
    why: The target concentration is the outcome of the dilution (the dilution ratio). The RU operating range is compared with the SU proven acceptable range.
    triggerNote: Asked because the program involves dilution or formulation with a buffer.
    sides: paired
    binds: uo.compounding.param.target_concentration
    input: { type: parameter, units: [mg/mL, g/L] }
    showWhen: *dilution

  # ================================================================== milestone 3: validation studies
  # ---- hold time study (formulated bulk)
  - id: comp.hold_cov
    section: uo.compounding
    parent: comp.hold_time
    prompt: What maximum hold duration do the hold time study data cover at the RU conditions (vessel, temperature, container)?
    label: Bulk hold study coverage (RU)
    why: Hold-time data are specific to the vessel, temperature and product conditions studied. The longest planned hold must be covered by that study.
    triggerNote: Asked because the planned maximum hold time is longer than the SU.
    tags: [m3]
    sides: target
    binds: uo.compounding.study.hold_time.coverage
    input: { type: quantity, units: [h, min, d] }
    showWhen: &holdIncreased { increased: uo.compounding.param.max_hold_time.max }

  - id: comp.hold_basis
    section: uo.compounding
    parent: comp.hold_time
    prompt: What endpoints does the hold time study use to support the planned hold?
    label: Bulk hold study basis
    why: A hold time claim needs chemical, physical (for example particles and aggregation) and microbial evidence. A study with only some endpoints supports only part of the claim.
    triggerNote: Asked because the planned maximum hold time is longer than the SU.
    tags: [m3]
    sides: target
    binds: uo.compounding.study.hold_time.basis
    input: { type: choice, optionsFrom: holdBasis }
    showWhen: *holdIncreased

  # ---- cleaning validation (reusable vessel)
  - id: comp.cleaning
    section: uo.compounding
    prompt: Is cleaning validation complete for the RU reusable compounding vessel and product-contact parts?
    label: Cleaning validation coverage (compounding equipment)
    why: A reusable stainless or glass vessel at the RU must have validated cleaning for this product (limits, worst-case location, hold times) before GMP use.
    triggerNote: Asked because the RU compounding vessel is reusable (stainless steel or glass).
    tags: [m3]
    sides: target
    binds: uo.compounding.study.cleaning.status
    input: { type: choice, optionsFrom: validationCoverage }
    showWhen: { in: [target.uo.compounding.equip.vessel.type, [stainless_tank, glass]] }

  # ---- equipment qualification
  - id: comp.vessel_qual
    section: uo.compounding
    prompt: Qualification status of the compounding vessel
    label: Vessel qualification status
    why: Equipment used for GMP manufacture must be qualified. An RU vessel that is not yet qualified, or is only planned, is a qualification requirement for the transfer.
    tags: [m3]
    sides: paired
    sameAsSource: false
    binds: uo.compounding.equip.vessel.qualificationStatus
    input: { type: choice, optionsFrom: equipQualification }

  - id: comp.vessel_range
    section: uo.compounding
    parent: comp.vessel_qual
    prompt: Qualified working volume range of the RU compounding vessel
    label: Vessel qualified working volume
    why: Qualification (for example mixing and temperature uniformity) covers a stated working volume range. A planned batch volume outside that range is not supported by the qualification.
    triggerNote: Asked because the RU vessel is qualified or has a qualification planned.
    tags: [m3]
    sides: target
    binds: uo.compounding.equip.vessel.qualifiedRange
    input: { type: range, units: [L, mL] }
    showWhen: { in: [target.uo.compounding.equip.vessel.qualificationStatus, [planned, iq_complete, oq_complete, pq_complete, requalification_due]] }

  - id: comp.mixer_qual
    section: uo.compounding
    prompt: Qualification status of the mixer
    label: Mixer qualification status
    why: Equipment used for GMP manufacture must be qualified. An RU mixer that is not yet qualified, or is only planned, is a qualification requirement for the transfer.
    tags: [m3]
    sides: paired
    sameAsSource: false
    binds: uo.compounding.equip.mixer.qualificationStatus
    input: { type: choice, optionsFrom: equipQualification }

  - id: comp.mixer_range
    section: uo.compounding
    parent: comp.mixer_qual
    prompt: Qualified speed range of the RU mixer
    label: Mixer qualified speed range
    why: Mixer qualification covers a defined speed range. Planned mixing speeds outside that range are not supported by the qualification.
    triggerNote: Asked because the RU mixer is qualified or has a qualification planned.
    tags: [m3]
    sides: target
    binds: uo.compounding.equip.mixer.qualifiedRange
    input: { type: range, units: [rpm] }
    showWhen: { in: [target.uo.compounding.equip.mixer.qualificationStatus, [planned, iq_complete, oq_complete, pq_complete, requalification_due]] }

  - id: comp.procedures
    section: uo.compounding
    prompt: Status of RU procedures for compounding
    label: RU compounding procedures
    why: Procedures and batch record instructions must reflect the RU equipment and parameters before GMP manufacture.
    sides: target
    binds: uo.compounding.doc.procedures.status
    input: { type: choice, optionsFrom: procedureStatus }
