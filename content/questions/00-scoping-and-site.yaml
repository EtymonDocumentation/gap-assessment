# Question bank: header, sections, scoping and site questions.
# Paths: scope.<key> (shared), site.<field>, uo.<uo>.<field>, uo.<uo>.<collection>.<item>.<field>
# "Unknown / to be confirmed" is added to every question by the engine.
bank:
  id: gap-core
  version: 1.5.0

sections:
  - { id: scoping, title: Scoping, kind: scoping, order: 0, intro: These answers decide which unit operations and questions apply. They are shared by SU and RU. }
  - { id: site, title: Site and facility, kind: site, order: 5, intro: "Facility, aseptic barrier and systems at the SU and RU." }
  - { id: uo.ds_shipping_inbound, title: Drug substance shipping to the fill site, kind: uo, uo: ds_shipping_inbound, order: 8, intro: "Shipping of drug substance (frozen or liquid) to the fill site. Receipt and thaw follow it." }
  - { id: uo.ds_receipt_thaw, title: Drug substance receipt and thaw, kind: uo, uo: ds_receipt_thaw, order: 10 }
  - { id: uo.buffer_prep, title: Buffer preparation, kind: uo, uo: buffer_prep, order: 15, intro: "Shown only when the program involves dilution or formulation with a buffer or diluent." }
  - { id: uo.compounding, title: "Pooling, compounding and dilution", kind: uo, uo: compounding, order: 20 }
  - { id: uo.bbr_filtration, title: Bioburden reduction (BBR) filtration, kind: uo, uo: bbr_filtration, order: 25 }
  - { id: uo.sterile_filtration, title: Sterile filtration, kind: uo, uo: sterile_filtration, order: 30 }
  - { id: uo.aseptic_filling, title: Aseptic filling and stoppering, kind: uo, uo: aseptic_filling, order: 40 }
  - { id: uo.stoppering, title: Stoppering (stand-alone), kind: uo, uo: stoppering, order: 45 }
  - { id: uo.lyophilization, title: Lyophilization, kind: uo, uo: lyophilization, order: 50 }
  - { id: uo.capping, title: Capping and crimping, kind: uo, uo: capping, order: 60 }
  - { id: uo.visual_inspection, title: Visual inspection, kind: uo, uo: visual_inspection, order: 70 }
  - { id: uo.bulk_packaging, title: Bulk packaging, kind: uo, uo: bulk_packaging, order: 75, intro: "Packing of the inspected containers into bulk containers before labelling. Shipping the packed bulk away is covered in Storage and shipping from the fill site." }
  - { id: uo.labeling_packaging, title: Labeling and packaging, kind: uo, uo: labeling_packaging, order: 80 }
  - { id: uo.storage_shipping, title: Storage and shipping from the fill site, kind: uo, uo: storage_shipping, order: 90 }

questions:
  # ------------------------------------------------------------------ scoping
  - id: scope.program
    section: scoping
    prompt: Program or product code
    label: Program
    why: Identifies the program in the assessment title and references. Use a fictional code in this proof of concept.
    sides: shared
    binds: scope.program
    input: { type: text, placeholder: e.g. ARX-217 }

  - id: scope.modality
    section: scoping
    prompt: What is the product modality?
    label: Modality
    why: Modality affects sensitivity to shear, containment needs and which studies are expected for the transfer.
    sides: shared
    binds: scope.modality
    input: { type: choice, optionsFrom: modality }

  - id: scope.dosage_form
    section: scoping
    prompt: What is the dosage form?
    label: Dosage form
    why: The dosage form decides whether lyophilization and stand-alone stoppering apply (lyophilized product) and which filling and closure questions are relevant.
    sides: shared
    binds: scope.dosage_form
    input: { type: choice, optionsFrom: dosageForm }

  - id: scope.presentation
    section: scoping
    prompt: What is the primary container presentation?
    label: Presentation
    why: Capping and crimping apply only to vials; syringes and cartridges follow different closure steps.
    sides: shared
    binds: scope.presentation
    input: { type: choice, optionsFrom: presentation }

  - id: scope.ds_state
    section: scoping
    prompt: In what physical state is the drug substance received?
    label: Drug substance state
    why: Frozen drug substance adds thaw equipment, thaw parameters, post-thaw mixing and freeze-thaw evidence questions to the receipt and thaw section. Liquid (refrigerated) drug substance skips them.
    sides: shared
    binds: scope.ds_state
    input: { type: choice, optionsFrom: dsState }

  - id: scope.dilution
    section: scoping
    prompt: Does the program involve dilution or formulation with a buffer or diluent?
    label: Dilution or formulation with a buffer
    why: A yes adds the Buffer preparation section and the dilution questions in compounding (target concentration, buffer or diluent used). A no hides them, and they are left out of progress and of the gap assessment. Nothing is assumed. An unanswered question is listed as an open item.
    sides: shared
    binds: scope.dilution
    input: { type: yes_no }

  - id: scope.containment
    section: scoping
    prompt: Does the product require containment (high potency or cytotoxic)?
    label: Containment
    why: Containment requirements add questions on the barrier and operator protection approach at each site.
    sides: shared
    binds: scope.containment
    input: { type: choice, optionsFrom: containment }

  - id: scope.markets
    section: scoping
    prompt: Which markets does the product supply?
    label: Markets
    why: Markets are recorded for regulatory affairs. The tool does not determine filing categories.
    sides: shared
    binds: scope.markets
    input: { type: multi_choice, optionsFrom: markets }

  - id: scope.transfer_type
    section: scoping
    prompt: What type of transfer is this?
    label: Transfer type
    why: A site-to-site transfer changes facility, systems and procedures; a scale change on the same line does not, so those questions are skipped.
    sides: shared
    binds: scope.transfer_type
    input: { type: choice, optionsFrom: transferType }

  # ------------------------------------------------------------------ site
  - id: site.name
    section: site
    prompt: Site name
    why: Identifies the SU and RU sites in the assessment. Use fictional names in this proof of concept.
    sides: paired
    sameAsSource: false
    binds: site.name
    input: { type: text, placeholder: e.g. Site North (fictional) }

  - id: site.line
    section: site
    prompt: Filling line
    why: "Identifies the line whose {{validated|current}} state (equipment, APS, qualification) applies."
    sides: paired
    binds: site.line
    input: { type: text, placeholder: e.g. Line 2 }

  - id: site.stage
    section: site
    prompt: Program stage at this site
    label: Program stage
    why: >-
      The stage decides what evidence the SU can offer and what the RU is expected to show. A commercial
      (process validated) SU has PPQ and validation to leverage; a clinical (GMP, not process validated) SU
      or a development SU does not, so the document then says "SU range" and "current state" instead of
      "validated". It also sets the validation expectations for the RU (PPQ, phase-appropriate or
      engineering runs). Nothing is assumed: an unanswered stage is listed as an open item.
    sides: paired
    sameAsSource: false
    binds: site.programStage
    input: { type: choice, optionsFrom: programStage }

  - id: site.labelling_location
    section: site
    prompt: Where is labelling and secondary packaging done?
    label: Labelling and secondary packaging location
    why: >-
      Many products leave the filling site as unlabelled packed bulk and are labelled and packaged at another site. If so,
      the labelling and packaging questions are out of scope for that side, and the document says where they happen. Nothing
      is assumed: an unanswered or unknown location is listed as an open item, and the labelling questions stay visible
      until the location is known.
    sides: paired
    sameAsSource: false
    binds: site.labellingLocation
    input: { type: choice, optionsFrom: labellingLocation }

  - id: site.labelling_site
    section: site
    parent: site.labelling_location
    prompt: Which site does the labelling and secondary packaging?
    label: Site that does the labelling
    why: The document states which site carries labelling and secondary packaging, so a reader knows where those controls are held and which quality agreement covers them.
    triggerNote: Asked because labelling and secondary packaging are done at another site.
    sides: paired
    sameAsSource: false
    binds: site.labellingSite
    input: { type: text, placeholder: e.g. Packaging Site East (fictional) }
    showWhen: { eq: [site.labellingLocation, another_site] }

  - id: site.barrier
    section: site
    prompt: Aseptic barrier technology at the filling line
    label: Barrier technology
    why: The barrier type determines the contamination control strategy, intervention design and how the APS is built; a change is a design change.
    sides: paired
    binds: site.barrier
    input: { type: choice, optionsFrom: fillingBarrier }
    showWhen: { not: { eq: [scope.transfer_type, scale_change] } }

  - id: site.background_grade
    section: site
    prompt: Background cleanroom grade around the Grade A filling zone
    label: Background grade
    why: Background classification is part of the facility design assessed under EU GMP Annex 1 and affects monitoring and gowning.
    sides: paired
    binds: site.backgroundGrade
    input: { type: choice, optionsFrom: backgroundGrade }
    showWhen: { not: { eq: [scope.transfer_type, scale_change] } }

  - id: site.containment
    section: site
    prompt: Containment approach for operator protection
    label: Containment approach
    why: High-potency products need operator protection that must remain compatible with aseptic conditions at the RU.
    triggerNote: Asked because the product requires containment.
    sides: paired
    binds: site.containment
    input: { type: choice, optionsFrom: containmentApproach }
    showWhen: { eq: [scope.containment, high_potency] }

  - id: site.batch_record
    section: site
    prompt: Batch record system
    label: Batch record system
    why: A change in batch record system affects computerized system validation, data integrity controls and the MBR.
    sides: paired
    binds: site.batchRecordSystem
    input: { type: choice, optionsFrom: batchRecordSystem }
    showWhen: { not: { eq: [scope.transfer_type, scale_change] } }
