# Step-blocks library for the master batch record (MBR module). Generic building blocks, one or more per unit operation, written in
# neutral wording. They are OFFERS: nothing is added to a batch record unless the author ticks it, and every text can be edited in the
# record. A parameter row only names which TRD value it pulls (the values come from the TRD record, never from this file).
# Placeholders in curly braces, {like this}, stand for entries only the CMO can make; they stay visible until the CMO fills them in.
# Editing a block on the site makes a new version (the earlier text is kept); this shipped file is not changed by the site.
formatVersion: "1.1.0"
blocks:
  - id: inbound_shipment_check
    version: 1
    title: Inbound shipment check
    unitOps: [ds_shipping_inbound]
    steps:
      - "Record the shipment identification and the date and time of arrival: {shipment ID}, {arrival date and time}."
      - "Check the seal of the shipping container and record its condition: {seal number}, {seal condition}."
      - "Read out the transport temperature record, attach it to this record and note the lowest and highest reading: {logger ID}, {lowest reading}, {highest reading}."
      - "Record the time from dispatch to arrival: {transit time}."
    params:
      - { key: transport_temperature, label: Transport temperature, collection: param, itemKey: transport_temperature, field: setPoint }
      - { key: transport_temperature_range, label: Transport temperature range, collection: param, itemKey: transport_temperature, field: nor }
      - { key: excursion_allowance, label: Temperature excursion allowance, collection: param, itemKey: excursion_allowance, field: max }
    timeLimits:
      - { key: transit_time, label: Maximum transit time, collection: param, itemKey: max_transit_time, field: max }
    sampleTypes: []
    cmoFields: [Shipment ID, Logger ID, Seal number, Signature and date]

  - id: shipment_monitoring_custody
    version: 1
    title: Transport monitoring and custody check
    unitOps: [ds_shipping_inbound]
    steps:
      - "Check the chain of custody of the shipment against the controls shown in the table below and record the result: {custody form number}, {custody check result}."
      - "Check the transport temperature monitoring against the monitoring shown in the table below and record where the monitoring record is kept: {monitoring record reference}."
    params:
      - { key: transport_monitoring, label: Transport temperature monitoring, collection: ipc, itemKey: transport_monitoring, field: tests }
      - { key: custody, label: Chain of custody controls, collection: ipc, itemKey: custody, field: tests }
    timeLimits: []
    sampleTypes: []
    cmoFields: [Custody form number, Monitoring record reference, Signature and date]

  - id: receipt_and_thaw
    version: 2
    title: Drug substance receipt and thaw check
    unitOps: [ds_receipt_thaw]
    steps:
      - "Record the drug substance lot and the identification of each container: {lot number}, {container IDs}."
      - "Inspect each container on receipt and record its condition: {condition}."
      - "Store the containers until thaw at the condition shown in the table below and record the storage location: {storage location}."
      - "Thaw the containers in the equipment {thaw equipment ID} at the temperature and for the duration shown in the table below, and record the start and end of the thaw: {start}, {end}."
      - "Record the temperature reading at the end of the thaw: {reading}."
      - "Record the time the thawed drug substance spends at ambient temperature and the time it is placed in cold storage and taken out for the next step: {ambient start}, {ambient end}, {cold storage start}, {cold storage end}."
    params:
      - { key: storage_temperature, label: Drug substance storage temperature, collection: param, itemKey: storage_temperature, field: setPoint }
      - { key: storage_temperature_range, label: Drug substance storage temperature range, collection: param, itemKey: storage_temperature, field: nor }
      - { key: thaw_temperature, label: Thaw temperature, collection: param, itemKey: thaw_temperature, field: setPoint }
      - { key: thaw_temperature_range, label: Thaw temperature range, collection: param, itemKey: thaw_temperature, field: nor }
      - { key: thaw_duration, label: Thaw duration, collection: param, itemKey: thaw_duration, field: setPoint }
      - { key: thaw_duration_range, label: Thaw duration range, collection: param, itemKey: thaw_duration, field: nor }
    timeLimits:
      - { key: ambient_time, label: Maximum time at ambient temperature after thaw, collection: param, itemKey: max_ambient_time, field: max }
      - { key: cold_hold, label: Maximum hold of the thawed drug substance in cold storage, collection: param, itemKey: max_cold_hold, field: max }
    sampleTypes: []
    cmoFields: [Drug substance lot number, Container IDs, Thaw equipment ID, Calibration status of the temperature probe, Cold storage unit ID, Signature and date]
    history:
      - version: 1
        title: Drug substance receipt and thaw check
        unitOps: [ds_receipt_thaw]
        steps:
          - "Record the drug substance lot and the identification of each container: {lot number}, {container IDs}."
          - "Inspect each container on receipt and record its condition: {condition}."
          - "Store the containers until thaw at the condition shown in the table below and record the storage location: {storage location}."
          - "Thaw the containers in the equipment {thaw equipment ID} and record the start and end of the thaw: {start}, {end}."
          - "Record the temperature reading at the end of the thaw: {reading}."
        params:
          - { key: storage_temperature, label: Drug substance storage temperature, collection: param, itemKey: storage_temperature, field: setPoint }
          - { key: storage_temperature_range, label: Drug substance storage temperature range, collection: param, itemKey: storage_temperature, field: nor }
        timeLimits: []
        sampleTypes: []
        cmoFields: [Drug substance lot number, Container IDs, Thaw equipment ID, Calibration status of the temperature probe, Signature and date]

  - id: buffer_preparation
    version: 2
    title: Buffer preparation
    unitOps: [buffer_prep]
    steps:
      - "Check the line clearance of the preparation area and record it: {line clearance form number}."
      - "Weigh or measure each component of the buffer and record the amounts: {component}, {lot number}, {weight or volume}."
      - "Mix at the speed and for the time shown in the table below until all components are dissolved. Record the start and end of mixing and the mixer settings: {start}, {end}, {mixer settings}."
      - "Take the in-process samples listed in the table below and record the results: {sampling time}, {results}."
      - "Filter the buffer through the bioburden-reduction filter and run the filter integrity test as described in the table below. Record the filter identification, the start and end of filtration and the test results: {filter lot}, {start}, {end}, {integrity result}."
      - "Record the buffer volume and the storage vessel, and the time the buffer is placed in hold and the time it is taken for use: {volume}, {vessel ID}, {hold start}, {hold end}."
    params:
      - { key: batch_volume, label: Buffer batch volume, collection: param, itemKey: batch_volume, field: setPoint }
      - { key: batch_volume_range, label: Buffer batch volume range, collection: param, itemKey: batch_volume, field: nor }
      - { key: mixing_speed, label: Buffer mixing speed, collection: param, itemKey: mixing_speed, field: setPoint }
      - { key: mixing_speed_range, label: Buffer mixing speed range, collection: param, itemKey: mixing_speed, field: nor }
      - { key: mixing_time, label: Buffer mixing time, collection: param, itemKey: mixing_time, field: setPoint }
      - { key: mixing_time_range, label: Buffer mixing time range, collection: param, itemKey: mixing_time, field: nor }
      - { key: buffer_controls, label: Buffer in-process controls, collection: ipc, itemKey: panel, field: tests }
      - { key: bioburden, label: Buffer pre-filtration bioburden, collection: ipc, itemKey: bioburden, field: limit }
      - { key: integrity, label: Buffer filter integrity testing approach, collection: ipc, itemKey: integrity, field: approach }
    timeLimits:
      - { key: buffer_hold, label: Buffer hold time, collection: param, itemKey: max_hold_time, field: max }
    sampleTypes: []
    cmoFields: [Component lot numbers, Weights and volumes, Balance ID, Mixer ID and settings, Filter lot and ID, Vessel ID, Signature and date]
    history:
      - version: 1
        title: Buffer preparation
        unitOps: [buffer_prep]
        steps:
          - "Check the line clearance of the preparation area and record it: {line clearance form number}."
          - "Weigh or measure each component of the buffer and record the amounts: {component}, {lot number}, {weight or volume}."
          - "Mix for the time needed to dissolve all components and record the start and end: {start}, {end}."
          - "Record the buffer volume and the storage vessel: {volume}, {vessel ID}."
        params: []
        timeLimits: []
        sampleTypes: []
        cmoFields: [Component lot numbers, Weights and volumes, Balance ID, Vessel ID, Signature and date]

  - id: pooling_with_weights
    version: 1
    title: Pooling of drug substance containers
    unitOps: [compounding]
    steps:
      - "Check the line clearance of the compounding area and record it: {line clearance form number}."
      - "Weigh each thawed container before pooling and record the gross and net weights: {container ID}, {gross weight}, {net weight}."
      - "Pool the contents into the compounding vessel {vessel ID} and record the total pooled weight: {total weight}."
      - "Record the density of the pool and the volume calculated from it: {density}, {calculated volume}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Container IDs, Gross and net weights, Balance ID and calibration status, Vessel ID, Density, Signature and date]

  - id: dilution_and_mixing
    version: 1
    title: Dilution and mixing
    unitOps: [compounding]
    steps:
      - "Add the buffer or diluent to the pool to reach the batch size shown in the table below and record the amount: {buffer lot}, {amount}."
      - "Mix at the speed and for the time shown in the table below. Record the start and end of mixing and the mixer settings: {start}, {end}, {mixer settings}."
      - "Record the temperature of the bulk during mixing: {temperature reading}."
      - "Take the in-process samples listed in the sample table of this section and record the time: {sampling time}."
      - "Record the final weight and volume of the formulated bulk: {final weight}, {final volume}."
    params:
      - { key: batch_size, label: Batch size (formulated bulk), collection: param, itemKey: batch_size, field: setPoint }
      - { key: batch_size_range, label: Batch size range, collection: param, itemKey: batch_size, field: nor }
      - { key: mixing_speed, label: Mixing speed, collection: param, itemKey: mixing_speed, field: setPoint }
      - { key: mixing_speed_range, label: Mixing speed range, collection: param, itemKey: mixing_speed, field: nor }
      - { key: mixing_time, label: Mixing time, collection: param, itemKey: mixing_time, field: setPoint }
      - { key: mixing_time_range, label: Mixing time range, collection: param, itemKey: mixing_time, field: nor }
      - { key: temperature, label: Compounding temperature, collection: param, itemKey: temperature, field: setPoint }
      - { key: temperature_range, label: Compounding temperature range, collection: param, itemKey: temperature, field: nor }
      - { key: target_concentration, label: Target protein concentration after dilution, collection: param, itemKey: target_concentration, field: setPoint }
      - { key: target_concentration_range, label: Target protein concentration range, collection: param, itemKey: target_concentration, field: nor }
    timeLimits:
      - { key: bulk_hold, label: Formulated bulk hold time, collection: param, itemKey: max_hold_time, field: max }
    sampleTypes: []
    cmoFields: [Buffer lot numbers, Amounts added, Mixer ID and settings, Temperature probe ID and calibration status, Final weight and volume, Signature and date]

  - id: bbr_filtration_run
    version: 2
    title: Bioburden reduction filtration
    unitOps: [bbr_filtration]
    steps:
      - "Assemble the filter and the bulk transfer path as described in {form or SOP number} and record the filter identification: {filter lot}, {filter ID}."
      - "Record the differential pressure at the start of the filtration and at its end: {pressure at start}, {pressure at end}."
      - "Filter the formulated bulk and record the start and end of the filtration: {start}, {end}."
      - "Record the weight of the filtrate: {filtrate weight}."
      - "Record the time the filtrate is placed in cold storage and the time it is taken for sterile filtration: {cold storage start}, {cold storage end}."
    params:
      - { key: differential_pressure, label: Filtration differential pressure, collection: param, itemKey: differential_pressure, field: setPoint }
      - { key: differential_pressure_range, label: Filtration differential pressure range, collection: param, itemKey: differential_pressure, field: nor }
      - { key: integrity, label: Filter integrity testing approach, collection: ipc, itemKey: integrity, field: approach }
      - { key: bioburden, label: Bioburden before the filter, collection: ipc, itemKey: bioburden, field: limit }
    timeLimits:
      - { key: filtration_time, label: Filtration duration, collection: param, itemKey: max_filtration_time, field: setPoint }
      - { key: cold_hold, label: Maximum hold of the bioburden-reduced bulk in cold storage, collection: param, itemKey: max_cold_hold, field: max }
    sampleTypes: []
    cmoFields: [Filter lot and ID, Pressure gauge ID and calibration status, Pressure readings, Filtrate weight, Cold storage unit ID, Signature and date]
    history:
      - version: 1
        title: Bioburden reduction filtration
        unitOps: [bbr_filtration]
        steps:
          - "Assemble the filter and the bulk transfer path as described in {form or SOP number} and record the filter identification: {filter lot}, {filter ID}."
          - "Record the differential pressure at the start of the filtration and at its end: {pressure at start}, {pressure at end}."
          - "Filter the formulated bulk and record the start and end of the filtration: {start}, {end}."
          - "Record the weight of the filtrate: {filtrate weight}."
        params:
          - { key: differential_pressure, label: Filtration differential pressure, collection: param, itemKey: differential_pressure, field: setPoint }
          - { key: differential_pressure_range, label: Filtration differential pressure range, collection: param, itemKey: differential_pressure, field: nor }
          - { key: integrity, label: Filter integrity testing approach, collection: ipc, itemKey: integrity, field: approach }
          - { key: bioburden, label: Bioburden before the filter, collection: ipc, itemKey: bioburden, field: limit }
        timeLimits:
          - { key: filtration_time, label: Filtration duration, collection: param, itemKey: max_filtration_time, field: setPoint }
        sampleTypes: []
        cmoFields: [Filter lot and ID, Pressure gauge ID and calibration status, Pressure readings, Filtrate weight, Signature and date]

  - id: sterile_filtration_run
    version: 2
    title: Sterile filtration
    unitOps: [sterile_filtration]
    steps:
      - "Assemble the sterilizing-grade filter and the sterile transfer path as described in {form or SOP number}. Record the filter identification: {filter lot}, {filter ID}."
      - "Run the filter integrity test before use and record the result: {pre-use result}."
      - "Filter the formulated bulk into the sterile bulk vessel. Record the start and end of the filtration and the differential pressure at both times: {start}, {end}, {pressure at start}, {pressure at end}."
      - "Run the filter integrity test after use and record the result: {post-use result}."
      - "Record the weight of the sterile bulk: {sterile bulk weight}."
    params:
      - { key: differential_pressure, label: Filtration differential pressure, collection: param, itemKey: differential_pressure, field: setPoint }
      - { key: differential_pressure_range, label: Filtration differential pressure range, collection: param, itemKey: differential_pressure, field: nor }
      - { key: bioburden, label: Bioburden before the sterilizing filter, collection: ipc, itemKey: bioburden, field: limit }
    timeLimits:
      - { key: filtration_time, label: Filtration duration, collection: param, itemKey: max_filtration_time, field: setPoint }
    sampleTypes: []
    cmoFields: [Filter lot and ID, Sterile bulk vessel ID, Pressure gauge ID and calibration status, Pressure readings, Sterile bulk weight, Signature and date]
    history:
      - version: 1
        title: Sterile filtration
        unitOps: [sterile_filtration]
        steps:
          - "Assemble the sterilizing-grade filter and the sterile transfer path as described in {form or SOP number}. Record the filter identification: {filter lot}, {filter ID}."
          - "Run the filter integrity test before use as described in the filter integrity block and record the result: {pre-use result}."
          - "Filter the formulated bulk into the sterile holding vessel. Record the start and end of the filtration and the differential pressure at both times: {start}, {end}, {pressure at start}, {pressure at end}."
          - "Run the filter integrity test after use and record the result: {post-use result}."
          - "Record the weight of the sterile bulk: {sterile bulk weight}."
        params:
          - { key: differential_pressure, label: Filtration differential pressure, collection: param, itemKey: differential_pressure, field: setPoint }
          - { key: differential_pressure_range, label: Filtration differential pressure range, collection: param, itemKey: differential_pressure, field: nor }
          - { key: bioburden, label: Bioburden before the sterilizing filter, collection: ipc, itemKey: bioburden, field: limit }
        timeLimits: []
        sampleTypes: []
        cmoFields: [Filter lot and ID, Holding vessel ID, Pressure gauge ID and calibration status, Pressure readings, Sterile bulk weight, Signature and date]

  - id: filter_integrity_test
    version: 1
    title: Filter integrity test (before and after use)
    unitOps: [sterile_filtration, bbr_filtration]
    steps:
      - "Wet the filter as described in {form or SOP number} and record the wetting fluid and the time: {wetting fluid}, {time}."
      - "Run the integrity test before use (and, where the process includes it, before sterilization of the assembly) and record the reading against the filter specification: {reading}, {specification}."
      - "Run the integrity test after use and record the reading against the filter specification: {reading}, {specification}."
      - "Attach the printout of each test to this record: {tester ID}."
    params:
      - { key: integrity_tests, label: Filter integrity testing, collection: ipc, itemKey: integrity, field: tests }
      - { key: integrity_method, label: Filter integrity test method, collection: ipc, itemKey: integrity, field: method }
      - { key: pupsit, label: Pre-use post-sterilization integrity test (PUPSIT), collection: ipc, itemKey: pupsit, field: status }
    timeLimits: []
    sampleTypes: []
    cmoFields: [Integrity tester ID and calibration status, Filter specification values, Test results, Printouts, Signature and date]

  - id: line_preparation
    version: 1
    title: Isolator and filling line preparation
    unitOps: [aseptic_filling]
    steps:
      - "Record that the isolator or filling area is in the state described in {form or SOP number}: {state check form number}."
      - "Record the identification of the sterile parts, containers and closures brought into the filling area: {part IDs}, {lot numbers}."
      - "Record the start of the filling setup and the operators present: {start}, {operators}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Isolator or room ID, Line clearance form number, Container and closure lots, Operators, Signature and date]

  - id: syringe_nest_debagging
    version: 1
    title: Nest and tub debagging and line setup (prefilled syringes)
    unitOps: [aseptic_filling]
    steps:
      - "Record the identification of the nested syringe barrels (tubs) and of the plunger stoppers brought to the line: {barrel lot}, {tub count}, {plunger stopper lot}."
      - "Remove the outer bags of the tubs as described in {form or SOP number} and record the time and the operators: {debagging start}, {operators}."
      - "Transfer the tubs into the isolator through the transfer port and record the transfer method and the time: {transfer method}, {transfer time}."
      - "Open the tubs inside the isolator and record any tub or nest with a damaged seal or a damaged barrel: {damaged tubs or nests}."
      - "Load the plunger stoppers into the stopper feeder and record the number loaded: {stoppers loaded}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Barrel lot, Number of tubs, Plunger stopper lot, Transfer port ID, Damaged tubs or nests, Operators, Signature and date]

  - id: filling_run
    version: 1
    title: Filling
    unitOps: [aseptic_filling]
    steps:
      - "Set the filling machine to the values shown in the table below and record the settings: {machine settings}."
      - "Start the filling and record the start time and the first filled unit: {start}, {first unit}."
      - "Check the fill at the frequency shown in the table below and record each reading: {check time}, {reading}."
      - "Record the interventions made during the run: {intervention list}."
      - "Record the end of filling and the number of units filled: {end}, {units filled}."
    params:
      - { key: fill_volume, label: Fill volume, collection: param, itemKey: fill_volume, field: setPoint }
      - { key: fill_volume_range, label: Fill volume range, collection: param, itemKey: fill_volume, field: nor }
      - { key: line_speed, label: Filling line speed, collection: param, itemKey: line_speed, field: setPoint }
      - { key: line_speed_range, label: Filling line speed range, collection: param, itemKey: line_speed, field: nor }
      - { key: max_interventions, label: Interventions per batch, collection: param, itemKey: max_interventions, field: max }
      - { key: fill_check, label: Fill weight check frequency, collection: ipc, itemKey: fill_check, field: frequency }
    timeLimits:
      - { key: fill_duration, label: Filling duration, collection: param, itemKey: max_fill_duration, field: max }
    sampleTypes: []
    cmoFields: [Filling machine ID, Balance ID and calibration status, Alarm values, Fill weights, Units filled, Signature and date]

  - id: stopper_position_check
    version: 1
    title: Stopper position check
    unitOps: [aseptic_filling, stoppering]
    steps:
      - "Take the stopper position check units at the frequency stated by the CMO procedure and record each reading: {check time}, {reading}."
      - "Compare each reading with the position limit and record the result: {limit}, {result}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Measuring device ID and calibration status, Readings, Signature and date]

  - id: plunger_stopper_placement
    version: 1
    title: Plunger stopper placement and position check (prefilled syringes)
    unitOps: [aseptic_filling, stoppering]
    steps:
      - "Set the stopper placement unit as described in {form or SOP number}. Record the vacuum level set for placement and the other placement settings: {vacuum level}, {placement settings}."
      - "Check the placement unit before filling starts and record the result: {set-up check result}."
      - "Take the position check syringes at the points shown in the table below. Measure the stopper position from the top of the barrel flange to the back of the stopper and record each reading against the position shown there: {check time}, {reading}."
      - "Check the headspace or air bubble size against the value in the table below and record each reading: {reading}."
      - "Record the syringes rejected by the in-line position check and the stoppers found out of position: {rejected syringes}, {out of position}."
    params:
      - { key: stopper_position, label: Plunger stopper position (depth from the reference), collection: param, itemKey: stopper_position, field: setPoint }
      - { key: stopper_position_range, label: Plunger stopper position range, collection: param, itemKey: stopper_position, field: nor }
      - { key: headspace, label: Headspace or air bubble size, collection: param, itemKey: max_headspace, field: setPoint }
      - { key: position_checks, label: Plunger stopper position checks, collection: ipc, itemKey: stopper_position_check, field: tests }
    timeLimits: []
    sampleTypes: []
    cmoFields: [Placement unit ID, Vacuum level, Measuring device ID and calibration status, Readings, Rejected syringes, Signature and date]

  - id: filtered_hold
    version: 1
    title: Filtered bulk hold
    unitOps: [aseptic_filling]
    steps:
      - "Record the time the sterile bulk is placed in the holding vessel and the time filling starts: {hold start}, {filling start}."
      - "Record the holding conditions during the hold: {holding conditions}."
      - "Record the elapsed hold time at the start and at the end of filling: {hold at start of filling}, {hold at end of filling}."
    params: []
    timeLimits:
      - { key: filtered_hold, label: Filtered bulk hold time, collection: param, itemKey: max_filtered_hold, field: max }
    sampleTypes: []
    cmoFields: [Holding vessel ID, Times, Holding conditions, Signature and date]

  - id: needle_clog_check
    version: 1
    title: Filling needle check
    unitOps: [aseptic_filling]
    steps:
      - "Check the filling needles or nozzles for blockage at the points described in {form or SOP number} and record the result: {check time}, {result}."
      - "If a blockage is found, record the action taken and the units affected: {action}, {units affected}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Check times, Results, Actions taken, Signature and date]

  - id: lyophilization_cycle
    version: 1
    title: Lyophilization cycle
    unitOps: [lyophilization]
    steps:
      - "Load the freeze dryer and record the loading start and end: {start}, {end}, {dryer ID}."
      - "Start the cycle recipe {recipe number} and attach the cycle record to this record."
      - "Record the end of the cycle and the stoppering result: {end}, {stoppering result}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Freeze dryer ID, Recipe number, Cycle record, Signature and date]

  - id: capping_run
    version: 1
    title: Capping and crimping
    unitOps: [capping]
    steps:
      - "Set the capping machine as described in {form or SOP number} and record the settings: {machine settings}."
      - "Record the start and end of capping and the number of units capped: {start}, {end}, {units capped}."
      - "Check the seal of units taken at the frequency stated by the CMO procedure and record the results: {check time}, {result}."
    params:
      - { key: rsf, label: Residual seal force, collection: param, itemKey: rsf, field: setPoint }
      - { key: rsf_range, label: Residual seal force range, collection: param, itemKey: rsf, field: nor }
    timeLimits: []
    sampleTypes: []
    cmoFields: [Capping machine ID, Cap lot, Units capped, Results, Signature and date]

  - id: visual_inspection_run
    version: 2
    title: Visual inspection
    unitOps: [visual_inspection]
    steps:
      - "Record the inspection method and the inspector identification: {method}, {inspector IDs}."
      - "Record the time the units leave refrigerated storage for inspection: {out time}."
      - "Inspect all units at the rate shown in the table below, for the defect classes shown there. Record the start and end of inspection: {start}, {end}."
      - "Record the number of accepted and rejected units and the defects found: {accepted}, {rejected}, {defects found}."
      - "Apply the sampling check to the accepted units and record the result: {sample size}, {result}."
      - "Record the time the units return to refrigerated storage: {return time}."
    params:
      - { key: inspection_rate, label: Inspection rate, collection: param, itemKey: inspection_rate, field: setPoint }
      - { key: inspection_rate_range, label: Inspection rate range, collection: param, itemKey: inspection_rate, field: nor }
      - { key: defect_classes, label: Defect classes inspected, collection: ipc, itemKey: defects, field: tests }
      - { key: aql, label: Sampling check of accepted units, collection: ipc, itemKey: aql, field: frequency }
      - { key: reject_rate, label: Reject rate monitoring, collection: ipc, itemKey: reject_rate, field: limit }
    timeLimits:
      - { key: out_of_refrigeration, label: Maximum time out of refrigeration during inspection, collection: param, itemKey: max_time_out_of_refrigeration, field: max }
