  - id: time_out_of_refrigeration_total
    version: 3
    title: Total time out of refrigeration
    unitOps: [storage_shipping]
    steps:
      - "The total is tracked for each portion of the batch separately (portions are defined before filling) and counts from the start of filling of that portion until its units are back in refrigerated storage. For each portion and each stage listed under the critical limit in the table below, copy the time the units leave refrigerated storage and the time they return from the records of that stage, and the time spent out of refrigeration in that stage. The out and return times include the handling before and after the work of the stage: {portion ID}, {out time}, {return time}, {stage time}."
      - "Add up the recorded stage times of each portion and record the total against the critical limit shown in the table below. The total is the sum of the recorded times, never an estimate: {portion ID}, {total time}."
    params: []
    timeLimits:
      - { key: total_out_of_refrigeration, label: Maximum total time out of refrigeration, collection: param, itemKey: max_total_time_out_of_refrigeration, field: max }
    sampleTypes: []
    note: The stages are the targets under the critical limit. Their times add up to the total, which is compared with the critical limit for information only. Time out of refrigeration is tracked per portion, so one slow portion does not count against the others. Stage targets include the handling time of the stage.
    cmoFields: [Portion IDs, Times out of and back in refrigerated storage per stage, Stage times, Total time per portion, Signature and date]
