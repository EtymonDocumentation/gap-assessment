  - id: bbr_filtration_run
    version: 3
    title: Bioburden reduction filtration
    unitOps: [bbr_filtration]
    steps:
      - "Assemble the filter and the bulk transfer path as described in {form or SOP number} and record the filter identification: {filter lot}, {filter ID}."
      - "Wet the filter as described in {form or SOP number} and run the integrity test before use. Record the wetting fluid, the time, the reading and the filter specification: {wetting fluid}, {time}, {pre-use reading}, {specification}, {pre-use result}."
      - "Record the time the formulated bulk is taken from its hold to this filtration (the end of the formulated bulk hold) and the hold time: {hold end}, {hold time}."
      - "Take the bioburden sample before the filter as set out in the table below and record the time, the volume and the sample number: {sampling time}, {sample volume}, {sample number}."
      - "Filter the formulated bulk and record the start and end of the filtration and the differential pressure at both times: {start}, {end}, {pressure at start}, {pressure at end}."
      - "Run the integrity test after use and record the reading against the filter specification: {post-use reading}, {specification}, {post-use result}."
      - "Record the weight of the filtrate: {filtrate weight}."
      - "Place the filtrate in the holding container (bag) and record its identification and lot, the time it is placed in cold storage (the start of the hold) and the cold storage unit: {holding bag ID}, {holding bag lot}, {cold storage start}, {cold storage unit ID}."
      - "Record the time the filtrate is taken out of cold storage for sterile filtration (the end of the hold) and the hold time: {cold storage end}, {hold time}."
    params:
      - { key: differential_pressure, label: Filtration differential pressure, collection: param, itemKey: differential_pressure, field: setPoint }
      - { key: differential_pressure_range, label: Filtration differential pressure range, collection: param, itemKey: differential_pressure, field: nor }
      - { key: expected_duration, label: Expected filtration duration, collection: param, itemKey: max_filtration_time, field: setPoint }
      - { key: integrity, label: Filter integrity testing approach, collection: ipc, itemKey: integrity, field: approach }
      - { key: bioburden, label: Bioburden before the filter, collection: ipc, itemKey: bioburden, field: limit }
    timeLimits:
      - { key: filtration_time, label: Maximum filtration duration, collection: param, itemKey: max_filtration_time, field: nor }
      - { key: cold_hold, label: Maximum hold of the bioburden-reduced bulk in cold storage, collection: param, itemKey: max_cold_hold, field: max }
    sampleTypes: []
    sampleSlots:
