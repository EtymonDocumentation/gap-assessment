# Step-blocks library for the master batch record (MBR module). Generic building blocks, one or more per unit operation, written in
# neutral wording. They are OFFERS: nothing is added to a batch record unless the author ticks it, and every text can be edited in the
# record. A parameter row only names which TRD value it pulls (the values come from the TRD record, never from this file).
# Placeholders in curly braces, {like this}, stand for entries only the CMO can make; they stay visible until the CMO fills them in.
# Editing a block on the site makes a new version (the earlier text is kept); this shipped file is not changed by the site.
formatVersion: "1.3.0"
blocks:
  - id: inbound_shipment_check
    version: 2
    title: Inbound shipment check
    unitOps: [ds_shipping_inbound]
    steps:
      - "Record the shipment identification and the date and time of arrival: {shipment ID}, {arrival date and time}."
      - "Check the seal of the shipping container and record its condition: {seal number}, {seal condition}."
      - "Read out the transport temperature record, attach it to this record and note the lowest and highest reading: {logger ID}, {lowest reading}, {highest reading}."
      - "Calculate from the temperature record the total time the shipment was outside the transport temperature range and compare it with the excursion allowance shown in the table below: {excursion start}, {excursion end}, {time outside the range}, {result against the allowance}."
      - "Record the time from dispatch to arrival: {transit time}."
    params:
      - { key: transport_temperature, label: Transport temperature, collection: param, itemKey: transport_temperature, field: setPoint }
      - { key: transport_temperature_range, label: Transport temperature range, collection: param, itemKey: transport_temperature, field: nor }
      - { key: excursion_allowance, label: Temperature excursion allowance, collection: param, itemKey: excursion_allowance, field: max }
    timeLimits:
      - { key: transit_time, label: Maximum transit time, collection: param, itemKey: max_transit_time, field: max }
    sampleTypes: []
    cmoFields: [Shipment ID, Logger ID, Seal number, Time outside the range, Signature and date]
    history:
      - version: 1
        title: Inbound shipment check
        unitOps: [ds_shipping_inbound]
        steps:
          - "Record the shipment identification and the date and time of arrival: {shipment ID}, {arrival date and time}."
          - "Check the seal of the shipping container and record its condition: {seal number}, {seal condition}."
          - "Read out the transport temperature record, attach it to this record and note the lowest and highest reading: {logger ID}, {lowest reading}, {highest reading}."
          - "Record the time from dispatch to arrival: {transit time}."
        params:
          - { key: transport_temperature, label: Transport temperature, collection: param, itemKey: transport_temperature, field: setPoint }
          - { key: transport_temperature_range, label: Transport temperature range, collection: param, itemKey: transport_temperature, field: nor }
          - { key: excursion_allowance, label: Temperature excursion allowance, collection: param, itemKey: excursion_allowance, field: max }
        timeLimits:
          - { key: transit_time, label: Maximum transit time, collection: param, itemKey: max_transit_time, field: max }
        sampleTypes: []
        cmoFields: [Shipment ID, Logger ID, Seal number, Signature and date]

  - id: shipment_monitoring_custody
    version: 1
    title: Transport monitoring and custody check
    unitOps: [ds_shipping_inbound]
    steps:
      - "Check the chain of custody of the shipment against the controls shown in the table below and record the result: {custody form number}, {custody check result}."
      - "Check the transport temperature monitoring against the monitoring shown in the table below and record where the monitoring record is kept: {monitoring record reference}."
    params:
      - { key: transport_monitoring, label: Transport temperature monitoring, collection: ipc, itemKey: transport_monitoring, field: tests }
      - { key: custody, label: Chain of custody controls, collection: ipc, itemKey: custody, field: tests }
    timeLimits: []
    sampleTypes: []
    cmoFields: [Custody form number, Monitoring record reference, Signature and date]

  - id: receipt_and_thaw
    version: 3
    title: Drug substance receipt and thaw check
    unitOps: [ds_receipt_thaw]
    steps:
      - "Record the drug substance lot and the identification of each container: {lot number}, {container IDs}."
      - "Inspect each container on receipt and record its condition: {condition}."
      - "Store the containers until thaw at the condition shown in the table below and record the storage location: {storage location}."
      - "Thaw the containers in the equipment {thaw equipment ID} at the temperature and for the duration shown in the table below. If the thaw unit takes fewer containers than the batch needs, thaw them in loads and record the containers, the start and the end of the thaw of each load: {load}, {container IDs}, {start}, {end}."
      - "Record the temperature reading at the end of the thaw: {reading}."
      - "Record the time the ambient clock starts. It starts at the end of the thaw, the time recorded for the end of the thaw above. The thaw is its own controlled step with its own duration limit and does not count towards the ambient time limit: {ambient clock start}."
      - "Record the time the thawed drug substance is placed in cold storage (the start of the cold hold), the cold storage unit and the ambient time used up to this point. The cold hold ends, and the ambient clock runs again, when the containers are taken out for pooling (recorded in the pooling section): {ambient time used}, {cold storage start}, {cold storage unit ID}."
    params:
      - { key: storage_temperature, label: Drug substance storage temperature, collection: param, itemKey: storage_temperature, field: setPoint }
      - { key: storage_temperature_range, label: Drug substance storage temperature range, collection: param, itemKey: storage_temperature, field: nor }
      - { key: thaw_temperature, label: Thaw temperature, collection: param, itemKey: thaw_temperature, field: setPoint }
      - { key: thaw_temperature_range, label: Thaw temperature range, collection: param, itemKey: thaw_temperature, field: nor }
      - { key: thaw_duration, label: Thaw duration, collection: param, itemKey: thaw_duration, field: setPoint }
      - { key: thaw_duration_range, label: Thaw duration range, collection: param, itemKey: thaw_duration, field: nor }
    timeLimits:
      - { key: ambient_time, label: Maximum time at ambient temperature after thaw, collection: param, itemKey: max_ambient_time, field: max }
      - { key: cold_hold, label: Maximum hold of the thawed drug substance in cold storage, collection: param, itemKey: max_cold_hold, field: max }
    sampleTypes: []
    cmoFields: [Drug substance lot number, Container IDs, Thaw equipment ID, Calibration status of the temperature probe, Cold storage unit ID, Ambient clock start, Signature and date]
    history:
      - version: 1
        title: Drug substance receipt and thaw check
        unitOps: [ds_receipt_thaw]
        steps:
          - "Record the drug substance lot and the identification of each container: {lot number}, {container IDs}."
          - "Inspect each container on receipt and record its condition: {condition}."
          - "Store the containers until thaw at the condition shown in the table below and record the storage location: {storage location}."
          - "Thaw the containers in the equipment {thaw equipment ID} and record the start and end of the thaw: {start}, {end}."
          - "Record the temperature reading at the end of the thaw: {reading}."
        params:
          - { key: storage_temperature, label: Drug substance storage temperature, collection: param, itemKey: storage_temperature, field: setPoint }
          - { key: storage_temperature_range, label: Drug substance storage temperature range, collection: param, itemKey: storage_temperature, field: nor }
        timeLimits: []
        sampleTypes: []
        cmoFields: [Drug substance lot number, Container IDs, Thaw equipment ID, Calibration status of the temperature probe, Signature and date]
      - version: 2
        title: Drug substance receipt and thaw check
        unitOps: [ds_receipt_thaw]
        steps:
          - "Record the drug substance lot and the identification of each container: {lot number}, {container IDs}."
          - "Inspect each container on receipt and record its condition: {condition}."
          - "Store the containers until thaw at the condition shown in the table below and record the storage location: {storage location}."
          - "Thaw the containers in the equipment {thaw equipment ID} at the temperature and for the duration shown in the table below, and record the start and end of the thaw: {start}, {end}."
          - "Record the temperature reading at the end of the thaw: {reading}."
          - "Record the time the thawed drug substance spends at ambient temperature and the time it is placed in cold storage and taken out for the next step: {ambient start}, {ambient end}, {cold storage start}, {cold storage end}."
        params:
          - { key: storage_temperature, label: Drug substance storage temperature, collection: param, itemKey: storage_temperature, field: setPoint }
          - { key: storage_temperature_range, label: Drug substance storage temperature range, collection: param, itemKey: storage_temperature, field: nor }
          - { key: thaw_temperature, label: Thaw temperature, collection: param, itemKey: thaw_temperature, field: setPoint }
          - { key: thaw_temperature_range, label: Thaw temperature range, collection: param, itemKey: thaw_temperature, field: nor }
          - { key: thaw_duration, label: Thaw duration, collection: param, itemKey: thaw_duration, field: setPoint }
          - { key: thaw_duration_range, label: Thaw duration range, collection: param, itemKey: thaw_duration, field: nor }
        timeLimits:
          - { key: ambient_time, label: Maximum time at ambient temperature after thaw, collection: param, itemKey: max_ambient_time, field: max }
          - { key: cold_hold, label: Maximum hold of the thawed drug substance in cold storage, collection: param, itemKey: max_cold_hold, field: max }
        sampleTypes: []
        cmoFields: [Drug substance lot number, Container IDs, Thaw equipment ID, Calibration status of the temperature probe, Cold storage unit ID, Signature and date]

  - id: buffer_preparation
    version: 3
    title: Buffer preparation
    unitOps: [buffer_prep]
    steps:
      - "Check the line clearance of the preparation area and record it: {line clearance form number}."
      - "State the buffer batch size for this record and calculate the amount of each component from the TRD formulation table: amount = ratio in the TRD table x buffer batch size. Check the buffer batch size against the range shown in the table below. Write the working next to each result: {buffer batch size}, {component}, {ratio from the TRD}, {calculated amount}."
      - "Weigh or measure each component of the buffer to the calculated amount, within the addition tolerance of the TRD, and record the amounts: {component}, {lot number}, {weight or volume}."
      - "Mix at the speed and for the time shown in the table below until all components are dissolved. Record the start and end of mixing and the mixer settings: {start}, {end}, {mixer settings}."
      - "Take the in-process samples listed in the table below and record the results: {sampling time}, {results}."
      - "Filter the buffer through the bioburden-reduction filter and run the filter integrity test as described in the table below. Record the filter identification, the start and end of filtration and the test results: {filter lot}, {start}, {end}, {integrity result}."
      - "Record the buffer volume and the storage vessel, and the time the buffer is placed in hold and the time it is taken for use: {volume}, {vessel ID}, {hold start}, {hold end}."
    params:
      - { key: batch_volume, label: Buffer batch volume, collection: param, itemKey: batch_volume, field: setPoint }
      - { key: batch_volume_range, label: Buffer batch volume range, collection: param, itemKey: batch_volume, field: nor }
      - { key: mixing_speed, label: Buffer mixing speed, collection: param, itemKey: mixing_speed, field: setPoint }
      - { key: mixing_speed_range, label: Buffer mixing speed range, collection: param, itemKey: mixing_speed, field: nor }
      - { key: mixing_time, label: Buffer mixing time, collection: param, itemKey: mixing_time, field: setPoint }
      - { key: mixing_time_range, label: Buffer mixing time range, collection: param, itemKey: mixing_time, field: nor }
      - { key: buffer_controls, label: Buffer in-process controls, collection: ipc, itemKey: panel, field: tests }
      - { key: bioburden, label: Buffer pre-filtration bioburden, collection: ipc, itemKey: bioburden, field: limit }
      - { key: integrity, label: Buffer filter integrity testing approach, collection: ipc, itemKey: integrity, field: approach }
    timeLimits:
      - { key: buffer_hold, label: Buffer hold time, collection: param, itemKey: max_hold_time, field: max }
    sampleTypes: []
    cmoFields: [Component lot numbers, Weights and volumes, Balance ID, Mixer ID and settings, Filter lot and ID, Vessel ID, Signature and date]
    history:
      - version: 1
        title: Buffer preparation
        unitOps: [buffer_prep]
        steps:
          - "Check the line clearance of the preparation area and record it: {line clearance form number}."
          - "Weigh or measure each component of the buffer and record the amounts: {component}, {lot number}, {weight or volume}."
          - "Mix for the time needed to dissolve all components and record the start and end: {start}, {end}."
          - "Record the buffer volume and the storage vessel: {volume}, {vessel ID}."
        params: []
        timeLimits: []
        sampleTypes: []
        cmoFields: [Component lot numbers, Weights and volumes, Balance ID, Vessel ID, Signature and date]
      - version: 2
        title: Buffer preparation
        unitOps: [buffer_prep]
        steps:
          - "Check the line clearance of the preparation area and record it: {line clearance form number}."
          - "Weigh or measure each component of the buffer and record the amounts: {component}, {lot number}, {weight or volume}."
          - "Mix at the speed and for the time shown in the table below until all components are dissolved. Record the start and end of mixing and the mixer settings: {start}, {end}, {mixer settings}."
          - "Take the in-process samples listed in the table below and record the results: {sampling time}, {results}."
          - "Filter the buffer through the bioburden-reduction filter and run the filter integrity test as described in the table below. Record the filter identification, the start and end of filtration and the test results: {filter lot}, {start}, {end}, {integrity result}."
          - "Record the buffer volume and the storage vessel, and the time the buffer is placed in hold and the time it is taken for use: {volume}, {vessel ID}, {hold start}, {hold end}."
        params:
          - { key: batch_volume, label: Buffer batch volume, collection: param, itemKey: batch_volume, field: setPoint }
          - { key: batch_volume_range, label: Buffer batch volume range, collection: param, itemKey: batch_volume, field: nor }
          - { key: mixing_speed, label: Buffer mixing speed, collection: param, itemKey: mixing_speed, field: setPoint }
          - { key: mixing_speed_range, label: Buffer mixing speed range, collection: param, itemKey: mixing_speed, field: nor }
          - { key: mixing_time, label: Buffer mixing time, collection: param, itemKey: mixing_time, field: setPoint }
          - { key: mixing_time_range, label: Buffer mixing time range, collection: param, itemKey: mixing_time, field: nor }
          - { key: buffer_controls, label: Buffer in-process controls, collection: ipc, itemKey: panel, field: tests }
          - { key: bioburden, label: Buffer pre-filtration bioburden, collection: ipc, itemKey: bioburden, field: limit }
          - { key: integrity, label: Buffer filter integrity testing approach, collection: ipc, itemKey: integrity, field: approach }
        timeLimits:
          - { key: buffer_hold, label: Buffer hold time, collection: param, itemKey: max_hold_time, field: max }
        sampleTypes: []
        cmoFields: [Component lot numbers, Weights and volumes, Balance ID, Mixer ID and settings, Filter lot and ID, Vessel ID, Signature and date]

  - id: pooling_with_weights
    version: 2
    title: Pooling of drug substance containers
    unitOps: [compounding]
    steps:
      - "Check the line clearance of the compounding area and record it: {line clearance form number}."
      - "Take the thawed containers out of cold storage and record the time. This ends the cold hold and the ambient clock runs again from this time: {out of cold storage time}, {cold hold time}."
      - "Weigh each thawed container before pooling and record the gross and net weights: {container ID}, {gross weight}, {net weight}."
      - "Pool the contents into the compounding vessel {vessel ID} and record the total pooled weight: {total weight}."
      - "Record the density of the pool, measured with the instrument {density instrument ID}, and the volume calculated from it: {density}, {calculated volume}."
      - "Record the time the ambient clock stops for the pooled drug substance and add up the ambient time before and after the cold hold. Record the total against the ambient limit shown in the receipt and thaw section: {ambient clock stop}, {total ambient time}."
    params: []
    timeLimits: []
    sampleTypes: []
    cmoFields: [Container IDs, Gross and net weights, Balance ID and calibration status, Density instrument ID and calibration status, Vessel ID, Density, Times out of cold storage, Total ambient time, Signature and date]
    history:
      - version: 1
        title: Pooling of drug substance containers
        unitOps: [compounding]
        steps:
          - "Check the line clearance of the compounding area and record it: {line clearance form number}."
          - "Weigh each thawed container before pooling and record the gross and net weights: {container ID}, {gross weight}, {net weight}."
          - "Pool the contents into the compounding vessel {vessel ID} and record the total pooled weight: {total weight}."
          - "Record the density of the pool and the volume calculated from it: {density}, {calculated volume}."
        params: []
        timeLimits: []
        sampleTypes: []
        cmoFields: [Container IDs, Gross and net weights, Balance ID and calibration status, Vessel ID, Density, Signature and date]

  - id: dilution_and_mixing
    version: 3
    title: Dilution and mixing
    unitOps: [compounding]
    steps:
      - "Calculate the volume of buffer or diluent to add: volume = the TRD diluent ratio (diluent volume per unit of batch size) x the batch size of this batch. Write the working next to the result: {batch size}, {diluent ratio from the TRD}, {calculated volume}."
      - "Record the protein concentration of the pooled drug substance (measured, or taken from the certificate of analysis where the TRD allows it). Calculate the concentration after dilution = pool concentration x pool volume / batch size, and check it against the target and range in the table below: {pool concentration}, {pool volume}, {calculated concentration after dilution}."
      - "Add the buffer or diluent to the pool to reach the batch size shown in the table below and record the amount: {buffer lot}, {amount}."
      - "Start mixing at the speed shown in the table below. Record the start of mixing and the mixer settings: {start}, {mixer settings}."
      - "Record the temperature of the bulk during mixing: {temperature reading}."
      - "Stop mixing when the mixing time shown in the table below has passed. Record the end of mixing: {end}."
      - "Record the final weight and volume of the formulated bulk: {final weight}, {final volume}."
      - "Run the in-process controls listed in the table below on the formulated bulk and record each result against its limit before the bulk goes to filtration: {pH}, {osmolality}, {protein concentration}, {appearance}, {bioburden result}, {reviewed by}."
      - "Record the time the formulated bulk is placed in hold (the start of the formulated bulk hold), the holding vessel and the holding temperature. The hold ends when the bulk is taken to filtration (recorded in the filtration section): {hold start}, {holding vessel ID}, {holding temperature}."
    params:
      - { key: batch_size, label: Batch size (formulated bulk), collection: param, itemKey: batch_size, field: setPoint }
      - { key: batch_size_range, label: Batch size range, collection: param, itemKey: batch_size, field: nor }
      - { key: mixing_speed, label: Mixing speed, collection: param, itemKey: mixing_speed, field: setPoint }
      - { key: mixing_speed_range, label: Mixing speed range, collection: param, itemKey: mixing_speed, field: nor }
      - { key: mixing_time, label: Mixing time, collection: param, itemKey: mixing_time, field: setPoint }
      - { key: mixing_time_range, label: Mixing time range, collection: param, itemKey: mixing_time, field: nor }
      - { key: temperature, label: Compounding temperature, collection: param, itemKey: temperature, field: setPoint }
      - { key: temperature_range, label: Compounding temperature range, collection: param, itemKey: temperature, field: nor }
      - { key: target_concentration, label: Target protein concentration after dilution, collection: param, itemKey: target_concentration, field: setPoint }
      - { key: target_concentration_range, label: Target protein concentration range, collection: param, itemKey: target_concentration, field: nor }
      - { key: compounding_controls, label: Compounding in-process controls, collection: ipc, itemKey: panel, field: tests }
    timeLimits:
      - { key: bulk_hold, label: Formulated bulk hold time, collection: param, itemKey: max_hold_time, field: max }
    sampleTypes: []
    sampleSlots:
      - { moment: beginning, afterStep: 4, text: "Take {samples} (sample table of this section) at the start of mixing and record the time and the person who took them: {sampling time}, {sampled by}." }
      - { moment: middle, afterStep: 5, text: "Take {samples} (sample table of this section) in the middle of the mixing time and record the time and the person who took them: {sampling time}, {sampled by}." }
      - { moment: end, afterStep: 5, text: "Take {samples} (sample table of this section) at the end of the mixing time, before the mixer is stopped, and record the time and the person who took them: {sampling time}, {sampled by}." }
