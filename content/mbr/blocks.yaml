        steps:
          - "Add the buffer or diluent to the pool to reach the batch size shown in the table below and record the amount: {buffer lot}, {amount}."
          - "Mix at the speed and for the time shown in the table below. Record the start and end of mixing and the mixer settings: {start}, {end}, {mixer settings}."
          - "Record the temperature of the bulk during mixing: {temperature reading}."
          - "Take the in-process samples listed in the sample table of this section and record the time: {sampling time}."
          - "Record the final weight and volume of the formulated bulk: {final weight}, {final volume}."
        params:
