  - { activity: stability_assessment, uo: none, key: act_stability, attribute: Stability study placement, category: supporting_study, materialType: Finished product, why: "The gap assessment implies a stability assessment." }
  - { activity: extractables_leachables, uo: none, key: act_el, attribute: Extractables and leachables samples, category: supporting_study, materialType: Product that contacted the equipment, why: "The gap assessment implies an extractables and leachables assessment." }
  - { activity: product_quality_impact, uo: aseptic_filling, key: act_quality_impact, attribute: Subvisible particles and aggregation after the RU equipment, category: ppq_enhanced, materialType: Filled containers, why: "The gap assessment implies a product-quality impact assessment of shear and stress." }
  - { activity: filter_bacterial_retention, uo: sterile_filtration, key: act_bacterial_retention, attribute: Bacterial retention (product-wet filter test), category: supporting_study, materialType: Filter with product, why: "The gap assessment implies a bacterial retention validation." }
  - { activity: bulk_pack_verification, uo: bulk_packaging, key: act_bulk_pack, attribute: Bulk pack verification, category: supporting_study, materialType: Packed bulk, why: "The gap assessment implies a bulk pack verification." }
