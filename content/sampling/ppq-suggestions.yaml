# PPQ sampling suggestions: candidates the Sampling plan page offers per unit operation. OPTIONS ONLY. An entry names something
# that is commonly sampled during process performance qualification (PPQ) and why. It carries no sample size, no acceptance
# criterion and no sampling method: those are decisions for the team (QA / statistics) and the tool never fills them in.
# A suggestion is never added to a plan by itself. When a person accepts one, the plan gets an INCOMPLETE point that still needs
# its timing, locations, method, acceptance criterion and rationale.
#
# `type` says which kind of sample or study the candidate usually is: ipc, release, ppq_enhanced, mixing_homogeneity, hold_time,
# filter_study, stability, retain_reserve, characterization, supporting_study, regulatory_commitment or other (the person can change
# it when accepting). A type only decides which questions the interview asks next; it never fills an answer.
# `uo` is a unit-operation key of the process-model catalog, or "finished_product" (the filled and finished units) or "none"
# (work that rides on the PPQ batches but belongs to no single step). Suggestions of an excluded unit operation, or of a topic
# that was left out of the scope, are not offered.
# Editable without code changes. Bump catalog.version on any change.
catalog:
  id: ppq-suggestions
  version: 1.1.0

candidates:
  - { uo: ds_receipt_thaw, key: post_thaw_homogeneity, attribute: Post-thaw homogeneity (concentration at defined positions), type: mixing_homogeneity, materialType: Thawed drug substance, why: "Frozen drug substance can form a concentration gradient during freeze and thaw; PPQ commonly shows it is homogeneous before use." }
  - { uo: ds_receipt_thaw, key: thaw_temperature_profile, attribute: Thaw temperature profile, type: ppq_enhanced, materialType: Drug substance container, why: "Shows the thaw method keeps the product within its allowed temperature." }

  - { uo: buffer_prep, key: buffer_bioburden, attribute: Buffer bioburden before filtration, type: ipc, materialType: Buffer, why: "Microbial load of the buffer before its bioburden-reduction or sterilizing filter." }

  - { uo: compounding, key: blend_uniformity, attribute: "Blend uniformity (concentration at top, middle and bottom)", type: mixing_homogeneity, materialType: Bulk solution, why: "Shows the mixing gives a uniform bulk at the receiving unit's batch size and mixing set-up." }
  - { uo: compounding, key: bulk_concentration, attribute: Concentration of the bulk solution, type: ipc, materialType: Bulk solution, why: "In-process check of the bulk against its target before filtration." }
  - { uo: compounding, key: compounding_ph_osmolality, attribute: pH and osmolality of the bulk, type: ipc, materialType: Bulk solution, why: "Routine in-process properties of the formulated bulk." }
  - { uo: compounding, key: compounding_bioburden, attribute: Bioburden of the bulk solution, type: ipc, materialType: Bulk solution, why: "Microbial load of the bulk before filtration." }

  - { uo: bbr_filtration, key: bbr_prefiltration_bioburden, attribute: Pre-filtration bioburden (bioburden-reduction filter inlet), type: ipc, materialType: Bulk solution, why: "Microbial load entering the bioburden-reduction filter." }
  - { uo: bbr_filtration, key: bbr_filter_integrity, attribute: Filter integrity test (before and after use), type: filter_study, materialType: Filter assembly, why: "Confirms the bioburden-reduction filter was intact." }

  - { uo: sterile_filtration, key: sf_prefiltration_bioburden, attribute: Bioburden before the sterilizing filter, type: ipc, materialType: Bulk solution, why: "Microbial load entering the sterilizing filter; it must stay within what the filter was challenged with." }
  - { uo: sterile_filtration, key: sf_filter_integrity, attribute: Filter integrity test (pre-use and post-use), type: filter_study, materialType: Filter assembly, why: "Confirms the sterilizing filter was intact before and after the filtration." }
  - { uo: sterile_filtration, key: sf_filtrate_samples, attribute: Filtrate concentration and pH after filtration, type: ppq_enhanced, materialType: Filtrate, why: "Shows the filter does not change the product (for example by adsorption)." }

  - { uo: aseptic_filling, key: fill_weight, attribute: Fill weight or fill volume, type: ipc, materialType: Filled containers, why: "Routine check that each needle fills to target." }
  - { uo: aseptic_filling, key: fill_particulates, attribute: Subvisible and visible particulates, type: ppq_enhanced, materialType: Filled containers, why: "Pumps and filling lines can add particles; PPQ commonly samples across the run." }
  - { uo: aseptic_filling, key: fill_concentration_start_end, attribute: Product concentration across the filling run, type: ppq_enhanced, materialType: Filled containers, why: "Shows the product stays consistent from the start to the end of filling." }
  - { uo: aseptic_filling, key: bioburden_pre_fill, attribute: Bioburden of the bulk before filling, type: ipc, materialType: Bulk solution in the filling tank, why: "Microbial load of the product held before filling." }

  - { uo: stoppering, key: stopper_position, attribute: Stopper position or placement, type: ipc, materialType: Stoppered containers, why: "Routine check that each stopper sits where it should." }

  - { uo: lyophilization, key: residual_moisture_per_shelf, attribute: Residual moisture (per shelf location), type: ppq_enhanced, materialType: Lyophilized product, why: "Shelves and locations can dry differently; PPQ commonly samples across the loaded shelves." }
  - { uo: lyophilization, key: cake_appearance, attribute: Cake appearance, type: ipc, materialType: Lyophilized product, why: "Visual check of the lyophilized cake." }
  - { uo: lyophilization, key: reconstitution_time, attribute: Reconstitution time, type: ppq_enhanced, materialType: Lyophilized product, why: "Shows the cake dissolves as expected across the load." }

  - { uo: capping, key: container_closure_integrity, attribute: Container closure integrity, type: ppq_enhanced, materialType: Capped containers, why: "Shows the capping process seals the container." }
  - { uo: capping, key: crimp_quality, attribute: Crimp or seal quality (for example residual seal force), type: ipc, materialType: Capped containers, why: "Routine check of the seal produced by the capper." }

  - { uo: visual_inspection, key: visual_aql, attribute: Visual inspection of accepted units (AQL check), type: ipc, materialType: Accepted containers, why: "Re-inspection of accepted units to confirm the inspection performs." }

  - { uo: bulk_packaging, key: bulk_pack_check, attribute: Check of the packed bulk, type: ipc, materialType: Packed bulk, why: "Routine check of the packed bulk containers." }

  - { uo: labeling_packaging, key: label_check, attribute: Label and print check, type: ipc, materialType: Labelled containers, why: "Routine check of labels and printing." }

  - { uo: finished_product, key: release_sterility, attribute: Sterility, type: release, materialType: Finished product, why: "Release test." }
  - { uo: finished_product, key: release_endotoxin, attribute: Bacterial endotoxins, type: release, materialType: Finished product, why: "Release test." }
  - { uo: finished_product, key: release_potency, attribute: Potency, type: release, materialType: Finished product, why: "Release test." }
  - { uo: finished_product, key: release_purity, attribute: Purity (for example size-variant and charge-variant methods), type: release, materialType: Finished product, why: "Release test." }
  - { uo: finished_product, key: release_appearance, attribute: Appearance and visible particulates, type: release, materialType: Finished product, why: "Release test." }
  - { uo: finished_product, key: extended_characterization, attribute: Extended characterization, type: characterization, materialType: Finished product, why: "Additional testing beyond release to describe the PPQ batches; often collected and reported without a criterion." }

  - { uo: none, key: hold_time_samples, attribute: Hold time samples, type: hold_time, materialType: Bulk or intermediate, why: "PPQ material is often used to support the allowed hold times." }
  - { uo: none, key: shipping_study_units, attribute: Shipping study units, type: supporting_study, materialType: Finished product, why: "PPQ units are often used for a shipping study." }
  - { uo: none, key: stability_placement, attribute: Stability study placement, type: stability, materialType: Finished product, why: "PPQ batches are often placed on stability." }
  - { uo: none, key: extractables_leachables_units, attribute: Extractables and leachables samples, type: supporting_study, materialType: Product that contacted the equipment, why: "Material from the PPQ run is sometimes used for leachables work." }

  # Added in 1.1.0: hold times, mixing / homogeneity, retains and reserve, stability, filter studies, agency requests.
  - { uo: ds_receipt_thaw, key: thaw_pool_homogeneity, attribute: Homogeneity after pooling thawed drug substance, type: mixing_homogeneity, materialType: Pooled drug substance, why: "Several containers are often pooled after thaw; PPQ commonly shows the pool is uniform." }
  - { uo: ds_receipt_thaw, key: thaw_hold, attribute: Hold of the thawed drug substance, type: hold_time, materialType: Thawed drug substance, why: "Thawed drug substance is held before use; the hold is commonly supported with samples." }
  - { uo: buffer_prep, key: buffer_mixing_homogeneity, attribute: Buffer homogeneity (pH and conductivity at defined positions), type: mixing_homogeneity, materialType: Buffer, why: "Shows the buffer is uniform after mixing in the receiving unit's vessel." }
  - { uo: buffer_prep, key: buffer_hold, attribute: Hold of the prepared buffer, type: hold_time, materialType: Buffer, why: "Prepared buffer is held before use; the hold is commonly supported with samples." }
  - { uo: compounding, key: bulk_hold, attribute: Hold of the bulk solution before filtration, type: hold_time, materialType: Bulk solution, why: "The bulk waits before filtration; the hold is commonly supported with samples." }
  - { uo: sterile_filtration, key: filtrate_hold, attribute: Hold of the filtered bulk before filling, type: hold_time, materialType: Filtered bulk, why: "The filtered bulk waits for filling; the hold is commonly supported with samples." }
  - { uo: sterile_filtration, key: sf_filter_flush, attribute: Filter flush before use, type: filter_study, materialType: Filter assembly, why: "Shows the flush removes what it should before the product passes through." }
  - { uo: finished_product, key: retain_samples, attribute: Retain samples, type: retain_reserve, materialType: Finished product, why: "Units kept from each batch for the retention period." }
  - { uo: finished_product, key: reserve_samples, attribute: Reserve samples, type: retain_reserve, materialType: Finished product, why: "Extra units kept for investigations." }
  - { uo: finished_product, key: stability_pulls, attribute: Stability study units, type: stability, materialType: Finished product, why: "PPQ batches are often placed on stability; the pulls are planned here." }
  - { uo: none, key: agency_request_study, attribute: Sample or study that answers an agency request, type: regulatory_commitment, materialType: Depends on the request, why: "An agency request or commitment sometimes names a study on the PPQ batches." }

# Candidates that follow a validation activity of the gap assessment. They are offered only when a gap in the project implies
# that activity (the same activities the Validation plan page lists).
activityCandidates:
  - { activity: mixing_study, uo: compounding, key: act_mixing_homogeneity, attribute: Homogeneity at the batch volume and mixing configuration, type: mixing_homogeneity, materialType: Bulk solution, why: "The gap assessment implies a mixing study." }
  - { activity: hold_time_study, uo: none, key: act_hold_time, attribute: Hold time samples, type: hold_time, materialType: Bulk or intermediate, why: "The gap assessment implies a hold time study." }
  - { activity: freeze_thaw_study, uo: ds_receipt_thaw, key: act_freeze_thaw, attribute: Freeze-thaw and thaw samples, type: supporting_study, materialType: Drug substance, why: "The gap assessment implies a freeze-thaw or thaw study." }
  - { activity: fill_accuracy_study, uo: aseptic_filling, key: act_fill_accuracy, attribute: Fill accuracy and precision, type: ppq_enhanced, materialType: Filled containers, why: "The gap assessment implies a fill accuracy study." }
  - { activity: lyo_cycle_verification, uo: lyophilization, key: act_lyo_cycle, attribute: Product temperature and residual moisture across the shelves, type: ppq_enhanced, materialType: Lyophilized product, why: "The gap assessment implies a lyophilization cycle verification." }
  - { activity: cci_study, uo: capping, key: act_cci, attribute: Container closure integrity, type: ppq_enhanced, materialType: Capped containers, why: "The gap assessment implies a container closure integrity study." }
  - { activity: rsf_study, uo: capping, key: act_rsf, attribute: Residual seal force, type: ppq_enhanced, materialType: Capped containers, why: "The gap assessment implies a residual seal force study." }
  - { activity: stopper_position_study, uo: stoppering, key: act_stopper_position, attribute: Stopper position capability, type: ppq_enhanced, materialType: Stoppered containers, why: "The gap assessment implies a stopper position capability study." }
  - { activity: shipping_validation, uo: none, key: act_shipping, attribute: Shipping study units, type: supporting_study, materialType: Finished product, why: "The gap assessment implies a shipping validation." }
  - { activity: stability_assessment, uo: none, key: act_stability, attribute: Stability study placement, type: stability, materialType: Finished product, why: "The gap assessment implies a stability assessment." }
  - { activity: extractables_leachables, uo: none, key: act_el, attribute: Extractables and leachables samples, type: supporting_study, materialType: Product that contacted the equipment, why: "The gap assessment implies an extractables and leachables assessment." }
  - { activity: product_quality_impact, uo: aseptic_filling, key: act_quality_impact, attribute: Subvisible particles and aggregation after the RU equipment, type: ppq_enhanced, materialType: Filled containers, why: "The gap assessment implies a product-quality impact assessment of shear and stress." }
  - { activity: filter_bacterial_retention, uo: sterile_filtration, key: act_bacterial_retention, attribute: Bacterial retention (product-wet filter test), type: filter_study, materialType: Filter with product, why: "The gap assessment implies a bacterial retention validation." }
  - { activity: bulk_pack_verification, uo: bulk_packaging, key: act_bulk_pack, attribute: Bulk pack verification, type: supporting_study, materialType: Packed bulk, why: "The gap assessment implies a bulk pack verification." }
