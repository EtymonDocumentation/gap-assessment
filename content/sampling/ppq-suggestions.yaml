  - { activity: cci_study, uo: capping, key: act_cci, attribute: Container closure integrity, category: ppq_enhanced, materialType: Capped containers, why: "The gap assessment implies a container closure integrity study." }
  - { activity: rsf_study, uo: capping, key: act_rsf, attribute: Residual seal force, category: ppq_enhanced, materialType: Capped containers, why: "The gap assessment implies a residual seal force study." }
  - { activity: stopper_position_study, uo: stoppering, key: act_stopper_position, attribute: Stopper position capability, category: ppq_enhanced, materialType: Stoppered containers, why: "The gap assessment implies a stopper position capability study." }
